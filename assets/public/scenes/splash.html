<!-- scenes/splash.html -->
<link rel="stylesheet" href="assets/styles/theme.css">
<style>
:root{
  --fg:#f9fbf6;
  --ink:#24443f;
  --glass:rgba(255,255,246,0.42);
  --glass-strong:rgba(255,255,248,0.62);
  --border-warm:rgba(255,231,172,0.68);
  --shadow-soft:rgba(39,64,52,0.24);
}

/* ===== Splash ===== */
.splash{
  height:100%;
  min-height:0;
  width:100%;
  display:grid;
  place-items:end center;
  padding:
    max(26px, env(safe-area-inset-top))
    clamp(18px, 4.8vw, 46px)
    max(34px, calc(env(safe-area-inset-bottom) + 32px));

  background:
    url("assets/pictures/splashscreen.png") center/cover no-repeat,
    #cce9df;

  color:var(--fg);
  font-family:var(--ui-font);
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
}

.splash .splash-bg-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
  z-index:0;
  opacity:1;
}

.splash .splash-bg-video.is-hidden{
  display:none;
}

/* ===== Stack ===== */
.splash .stack{
  width:min(100%, 328px);
  display:flex;
  flex-direction:column;
  gap:10px;
  justify-self:end;
  margin-right:clamp(0px, 3vw, 34px);
  margin-bottom:clamp(22px, 7vh, 84px);
  padding:14px;
  border-radius:28px;
  background:
    linear-gradient(145deg, rgba(255,255,250,0.24), rgba(185,224,210,0.10)),
    rgba(246,255,248,0.12);
  border:1px solid rgba(255,238,190,0.32);
  box-shadow:
    0 22px 52px rgba(47,76,61,0.18),
    inset 0 1px 0 rgba(255,255,255,0.44);
  backdrop-filter: blur(8px) saturate(1.12);
  -webkit-backdrop-filter: blur(8px) saturate(1.12);
  animation: splashMenuIn .72s ease both;

  position:relative;
  z-index:2;
}

/* ===== Button base ===== */
.splash .btn{
  width:100%;
  min-height:48px;
  padding:12px 18px;
  border-radius:18px;

  background:
    linear-gradient(180deg, var(--glass-strong), var(--glass)),
    rgba(229,248,242,0.24);
  color:var(--ink);
  font-size:16px;
  font-weight:700;
  letter-spacing:0;
  text-shadow:0 1px 0 rgba(255,255,255,0.58);
  cursor:pointer;

  border:1px solid var(--border-warm);
  box-shadow:
    0 12px 28px var(--shadow-soft),
    inset 0 1px 0 rgba(255,255,255,0.78),
    inset 0 -1px 0 rgba(87,139,126,0.10);

  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .22s ease,
    filter .18s ease,
    transform .16s cubic-bezier(.2,.8,.2,1);

  position:relative;
  overflow:hidden;
  will-change:transform;
}

.splash .btn::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(120deg, rgba(255,255,255,0.62), rgba(255,255,255,0.08) 42%, rgba(157,207,202,0.16));
  opacity:.54;
}

.splash .btn::after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:inherit;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(90deg, transparent 0%, rgba(255,242,191,0.28) 48%, rgba(134,205,214,0.20) 100%);
  transition:opacity .18s ease;
}

.splash .btn.start{
  min-height:56px;
  font-size:18px;
  background:
    linear-gradient(180deg, rgba(255,255,250,0.82), rgba(237,248,222,0.56)),
    linear-gradient(120deg, rgba(236,211,142,0.38), rgba(104,185,201,0.28));
  border-color:rgba(255,230,157,0.92);
  box-shadow:
    0 16px 34px rgba(40,89,73,0.28),
    0 0 22px rgba(255,226,153,0.26),
    inset 0 1px 0 rgba(255,255,255,0.92);
}

.splash .btn.options{
  background:
    linear-gradient(180deg, rgba(253,255,249,0.58), rgba(224,242,232,0.34)),
    rgba(188,225,215,0.16);
}

.splash .btn.update{
  min-height:52px;
  background:
    linear-gradient(180deg, rgba(255,255,252,0.74), rgba(232,247,239,0.46)),
    linear-gradient(120deg, rgba(255,230,157,0.30), rgba(104,185,201,0.26));
  border-color:rgba(255,236,180,0.88);
  color:#173f42;
  box-shadow:
    0 14px 30px rgba(38,88,73,0.24),
    0 0 18px rgba(255,226,153,0.20),
    inset 0 1px 0 rgba(255,255,255,0.86);
}

.splash .btn.patreon{
  background:
    linear-gradient(180deg, rgba(255,255,250,0.54), rgba(239,246,228,0.30)),
    rgba(236,211,142,0.13);
}

.splash .btn.subscribestar{
  background:
    linear-gradient(180deg, rgba(251,255,250,0.54), rgba(219,244,241,0.32)),
    rgba(104,185,201,0.16);
}

/* ===== Hover ===== */
.splash .btn:hover{
  transform:translateY(-2px);
  border-color:rgba(255,239,188,0.95);
  background:
    linear-gradient(180deg, rgba(255,255,252,0.76), rgba(231,248,239,0.48)),
    rgba(176,226,222,0.22);
  box-shadow:
    0 16px 34px rgba(38,88,73,0.24),
    0 0 22px rgba(255,230,162,0.20),
    inset 0 1px 0 rgba(255,255,255,0.88);
  filter:brightness(1.03);
}

.splash .btn:hover::after{
  opacity:.82;
}

.splash .btn.patreon:hover{
  color:#101414;
  border-color:rgba(255,255,255,0.98);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.94), rgba(232,234,230,0.72)),
    linear-gradient(115deg, rgba(0,0,0,0.48), rgba(255,255,255,0.42) 43%, rgba(18,18,18,0.34));
  box-shadow:
    0 17px 34px rgba(10,12,12,0.30),
    0 0 0 1px rgba(255,255,255,0.20),
    0 0 24px rgba(255,255,255,0.32),
    inset 0 1px 0 rgba(255,255,255,0.96);
}

.splash .btn.patreon:hover::after{
  opacity:.9;
  background:linear-gradient(90deg, rgba(0,0,0,0.36), rgba(255,255,255,0.52) 48%, rgba(18,18,18,0.30));
}

.splash .btn.subscribestar:hover{
  color:#15384b;
  border-color:rgba(255,196,234,0.98);
  background:
    linear-gradient(180deg, rgba(255,255,252,0.88), rgba(218,247,252,0.58)),
    linear-gradient(120deg, rgba(37,181,242,0.62), rgba(255,85,188,0.58));
  box-shadow:
    0 17px 34px rgba(34,112,143,0.30),
    0 0 26px rgba(255,95,195,0.26),
    0 0 18px rgba(47,190,242,0.20),
    inset 0 1px 0 rgba(255,255,255,0.94);
}

.splash .btn.subscribestar:hover::after{
  opacity:.9;
  background:linear-gradient(90deg, rgba(37,181,242,0.38), rgba(255,85,188,0.46) 52%, rgba(72,206,238,0.34));
}

/* ===== Press ===== */
.splash .btn:active{
  transform:translateY(1px) scale(0.99);
  filter:brightness(.99);
  box-shadow:
    0 8px 18px rgba(45,81,68,0.20),
    inset 0 2px 8px rgba(70,117,104,0.14),
    inset 0 1px 0 rgba(255,255,255,0.62);
}

.splash .btn:focus-visible{
  outline:2px solid rgba(255,239,180,0.82);
  outline-offset:4px;
}

@media (prefers-reduced-motion: reduce){
  .splash .stack{
    animation:none;
  }
  .splash .btn{
    transition:background .12s ease, border-color .12s ease, box-shadow .12s ease, filter .12s ease;
    will-change:auto;
  }
  .splash .btn:hover,
  .splash .btn:active{
    transform:none;
  }
}

.splash .language-panel{
  display:none;
  width:100%;
  padding:0;
  border-radius:18px;
  background:transparent;
  border:0;
  box-shadow:none;
}

.splash .language-panel.show{
  display:block;
}

.splash .language-select{
  width:100%;
  min-height:48px;
  padding:12px 18px;
  border-radius:18px;
  border:1px solid var(--border-warm);
  background:
    linear-gradient(180deg, rgba(255,255,250,0.58), rgba(224,242,232,0.34)),
    rgba(188,225,215,0.16);
  color:var(--ink);
  font:inherit;
  font-size:1rem !important;
  font-weight:700;
  box-shadow:
    0 12px 28px var(--shadow-soft),
    inset 0 1px 0 rgba(255,255,255,0.78),
    inset 0 -1px 0 rgba(87,139,126,0.10);
}

@keyframes splashMenuIn{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media (min-width: 760px){
  .splash .stack{
    width:320px;
    margin-right:clamp(24px, 6vw, 86px);
    margin-bottom:clamp(34px, 8vh, 96px);
  }
}

@media (min-width:600px) and (max-height:600px){
  .splash{ padding:18px; place-items:center; }
  .splash .stack{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    width:min(100%,560px);
    margin-block:0;
    margin-right:0;
  }
  .splash .language-panel{ grid-column:1 / -1; }
}

@media (max-width: 430px){
  .splash{
    place-items:end center;
    padding-inline:16px;
    padding-bottom:max(24px, calc(env(safe-area-inset-bottom) + 24px));
  }
  .splash .stack{
    width:min(100%, 304px);
    margin-right:0;
    margin-bottom:clamp(10px, 4.5vh, 42px);
    padding:12px;
    gap:9px;
    border-radius:24px;
  }
  .splash .btn{
    min-height:46px;
    padding:11px 16px;
    font-size:15px;
  }
  .splash .language-select{
    min-height:46px;
    padding:11px 16px;
    font-size:15px;
  }
  .splash .btn.start{
    min-height:54px;
    font-size:17px;
  }
  .splash .btn.update{
    min-height:48px;
  }
}
</style>

<div class="splash" data-scene>
  <!-- Drop the future animated MP4 here; the image background above stays as fallback. -->
  <video class="splash-bg-video is-hidden" autoplay muted loop playsinline preload="auto" aria-hidden="true" oncanplay="this.classList.remove('is-hidden')" onerror="this.classList.add('is-hidden')">
    <source src="assets/backgrounds/splashscreen.mp4" type="video/mp4" onerror="this.parentElement.classList.add('is-hidden')">
  </video>
  <div class="stack">
    <button class="btn start" type="button" onclick="startFreshGame()" data-i18n="splash.start">Start</button>
    <button class="btn start-from" type="button" onclick="openStartFromMenu()">Start From</button>
    <button class="btn update" type="button" onclick="openNewUpdateAccess()" data-i18n="splash.new_update">NEW UPDATE</button>
    <button class="btn options" type="button" onclick="toggleSplashLanguage()" data-i18n="splash.language">Language</button>
    <div class="language-panel" id="splash-language-panel">
      <select id="splash-language" class="language-select" aria-label="Language" data-i18n-aria-label="settings.language">
        <option value="en">English</option>
        <option value="fr">Fran&ccedil;ais</option>
        <option value="es">Espa&ntilde;ol</option>
        <option value="pt">Portugu&ecirc;s</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="ru">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
        <option value="zh-CN">&#31616;&#20307;&#20013;&#25991;</option>
        <option value="ja">&#26085;&#26412;&#35486;</option>
        <option value="ko">&#54620;&#44397;&#50612;</option>
        <option value="hi">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368;</option>
        <option value="ar">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</option>
      </select>
    </div>
    <button class="btn options" type="button" onclick="navigateToScene('settings')" data-i18n="splash.options">Options</button>
    <button class="btn patreon" type="button" onclick="openPatreon()" data-i18n="splash.patreon">Patreon</button>
    <button class="btn subscribestar" type="button" onclick="openSubscribeStar()" data-i18n="splash.subscribestar">SubscribeStar</button>
  </div>
</div>

<script>
  async function startFreshGame(){
    let existingVariant = "";
    try { existingVariant = String(localStorage.getItem("character_variant_mason") || "").trim().toLowerCase(); } catch {}
    const canonicalState = window.GameStateEngine?.getState?.();
    const engineVariant = String(canonicalState?.world?.masonVariant || "").trim().toLowerCase();
    const hasProgress = (() => {
      try {
        return localStorage.getItem("conv_boot_done") === "1" ||
          localStorage.getItem("story_prologue_done") === "1" ||
          canonicalState?.initialization?.status === "READY" ||
          canonicalState?.initialization?.status === "READY_WITH_ACTIVE_STORY" ||
          !!canonicalState?.initialization?.launchReceipt ||
          (Array.isArray(canonicalState?.progression?.completedStoryIds) && canonicalState.progression.completedStoryIds.length > 0) ||
          !!canonicalState?.execution?.activeStoryId;
      } catch { return false; }
    })();
    const canonicalVariantIsDecided = (engineVariant === "male" || engineVariant === "female") && hasProgress;
    const hasExplicitVariant = canonicalVariantIsDecided || existingVariant === "male" || existingVariant === "female";
    if (hasProgress) {
      navigateToScene("home");
      return true;
    }
    const variant = hasExplicitVariant ? existingVariant : await window.Game?.chooseMasonVariant?.();
    if (variant !== "male" && variant !== "female") return false;
    const engine = window.GameStateEngine;
    if (!engine?.dispatch || !engine?.getState) return false;
    // Only an explicit Start may initialize a pristine campaign. Commit the
    // selected Mason before Home can enqueue the first conversation.
    const initial = engine.getState();
    if (!initial.initialization || initial.initialization.status === "UNINITIALIZED") {
      const initialized = engine.dispatch({
        type: "INITIALIZE_NEW_GAME",
        commandId: "fresh-new-game:splash",
        expectedRevision: initial.revision,
        payload: { initializationToken: "fresh-new-game:splash" }
      });
      if (!initialized?.ok) return false;
    }
    // Keep legacy avatar/template readers coherent during the synchronous
    // canonical notification; the engine command remains the authority.
    try { localStorage.setItem("character_variant_mason", variant); } catch {}
    const before = engine.getState();
    const committed = engine.dispatch({
      type: "SET_MASON_VARIANT",
      commandId: "fresh-start:mason-variant:" + variant,
      expectedRevision: before.revision,
      payload: { variant, source: "fresh_start" }
    });
    if (!committed?.ok) {
      try { localStorage.removeItem("character_variant_mason"); } catch {}
      return false;
    }
    try { window.dispatchEvent(new CustomEvent("character-variant:changed", { detail:{ id:"mason", value:variant } })); } catch {}
    navigateToScene("home");
    return true;
  }
  function normalizeSplashLanguage(raw){
    return window.Game?.i18n?.normalizeLanguage
      ? window.Game.i18n.normalizeLanguage(raw)
      : (String(raw || "").trim() || "en");
  }
  function syncSplashLanguage(){
    const select = document.getElementById("splash-language");
    if (!select) return;
    let lang = "en";
    try { lang = normalizeSplashLanguage(localStorage.getItem("settings_language") || "en"); } catch {}
    select.value = lang;
  }
  function toggleSplashLanguage(){
    const panel = document.getElementById("splash-language-panel");
    if (!panel) return;
    panel.classList.toggle("show");
    syncSplashLanguage();
  }
  (function initSplashLanguage(){
    const select = document.getElementById("splash-language");
    if (!select) return;
    syncSplashLanguage();
    select.addEventListener("change", () => {
      const lang = normalizeSplashLanguage(select.value);
      try { window.Game?.i18n?.setLanguage?.(lang); } catch {
        try { localStorage.setItem("settings_language", lang); } catch {}
      }
    });
    try { window.Game?.i18n?.applyTo?.(document.querySelector(".splash")); } catch {}
  })();
  function openExternalSupportUrl(url){
    const isElectron = !!(window?.process?.versions?.electron);

    try {
      if (window.Game && typeof window.Game.openExternalUrl === "function") {
        return window.Game.openExternalUrl(url);
      }
    } catch {}

    try{
      if (window.electronAPI && typeof window.electronAPI.openExternal === "function") {
        return window.electronAPI.openExternal(url);
      }
    }catch{}

    try{
      if (isElectron && typeof require === "function") {
        const { shell } = require("electron");
        return shell.openExternal(url);
      }
    }catch{}

    window.open(url, "_blank", "noopener,noreferrer");
  }
  function openPatreon(){
    return openExternalSupportUrl("https://www.patreon.com/cw/FreNchTR");
  }

  function openSubscribeStar(){
    return openExternalSupportUrl("https://subscribestar.art/frenchtr");
  }
</script>
