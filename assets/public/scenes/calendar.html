<style>
.calendar-app{height:100%;box-sizing:border-box;overflow:auto;background:radial-gradient(ellipse at top right,#243e46 0,transparent 45%),#101c24;color:#eef8f7;padding:30px 18px 40px;font-family:var(--ui-font,system-ui);color-scheme:dark}
.calendar-app{position:relative;isolation:isolate}
.calendar-app::before{content:"";position:fixed;inset:0;z-index:-1;background:#101c24ed;pointer-events:none}
.calendar-app *{box-sizing:border-box}
.cal-message.has-media{width:min(320px,92%)}.cal-message-media{display:block;position:relative;width:100%;height:210px;padding:0;overflow:hidden;border:1px solid #56867b;border-radius:10px;background:#122027;color:#cef0e6;font:inherit;cursor:pointer}.cal-message-media .media-thumb{min-height:0}.cal-message-media .media-thumb img{position:absolute;inset:0;min-width:0;min-height:0;width:100%;height:100%;object-fit:contain}.cal-message-media+p{margin-top:10px}
.cal-event.is-routine{background:#203438;border-color:#406065}.cal-event.is-routine .cal-event-icon{background:#304c50;color:#bbe0d8}.cal-event.is-routine .cal-event-meta{color:#b5d6ce}
.cal-event.is-activity{background:#20382f;border-color:#47745b}.cal-event.is-activity .cal-event-icon{background:#31573f;color:#c4ebcc}.cal-event.is-activity .cal-event-meta{color:#bdddc5}
.cal-event.is-milestone{background:#292b40;border-color:#58516d}.cal-event.is-milestone .cal-event-icon{background:#443953;color:#d8bdf5}
.cal-event.is-onlyfun{background:#342b35;border-color:#66516b}.cal-event.is-onlyfun .cal-event-icon{background:#523d59;color:#e4c6ed}
.calendar-app [hidden]{display:none!important}.cal-read-chat,.cal-reader-back,.cal-reader-pages button{font:inherit;font-size:12px;color:#cef0e6;background:#28483f;border:1px solid #56867b;border-radius:16px;min-height:36px;padding:7px 12px;cursor:pointer}.cal-read-chat{margin-top:12px}.cal-reader-back{margin-bottom:20px}.cal-reader h2{font-size:23px;margin:0 0 10px;overflow-wrap:anywhere}.cal-reader-note{font-size:12px;color:#b6cbce;line-height:1.6;margin:0 0 18px}.cal-reader-messages{display:flex;flex-direction:column;gap:10px}.cal-message{max-width:92%;align-self:flex-start;padding:12px 14px;border:1px solid #435b64;border-radius:15px;background:#203139;overflow-wrap:anywhere}.cal-message.is-player{align-self:flex-end;background:#28483f;border-color:#56867b}.cal-message.is-note{align-self:center;background:transparent;border:0;color:#b6cbce;text-align:center}.cal-message-sender{font-size:10px;font-weight:600;color:#b8e3d5;margin-bottom:6px}.cal-message p{font-size:13px;line-height:1.6;margin:0;white-space:pre-wrap}.cal-reader-pages{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 0}.cal-reader-pages span{font-size:11px;color:#b6cbce}.cal-reader-pages button:disabled{opacity:.35;cursor:default}
.cal-message.is-thought{position:relative;align-self:center;margin:6px 0 24px;border-color:#7ec2e8;border-radius:26px 26px 26px 12px;background:linear-gradient(135deg,#fff,#ebf7ff 62%,#eefaf7);color:#263f50}.cal-message.is-thought .cal-message-sender{color:#366984}.cal-message.is-thought p{font-style:italic}.cal-message.is-thought::before,.cal-message.is-thought::after{content:"";position:absolute;border:1px solid #7ec2e8;border-radius:50%;background:#edf8fc}.cal-message.is-thought::before{width:10px;height:10px;left:18px;bottom:-15px}.cal-message.is-thought::after{width:5px;height:5px;left:8px;bottom:-24px}
.cal-message.is-hak-transcript{align-self:center;width:100%;max-width:100%;border:1px solid #bfc9c8;border-left:3px solid #e7eeeb;border-radius:7px;background:repeating-linear-gradient(90deg,#ffffff06 0,#ffffff06 1px,transparent 1px,transparent 22px),#101211;color:#edf2ee;font-family:ui-monospace,Consolas,monospace}.cal-hak-header{margin:-12px -14px 10px;padding:8px 12px;border-bottom:1px solid #ffffff30;background:#ffffff0a;color:#edf2ee;font-size:10px;font-weight:800;letter-spacing:.08em}.is-hak-transcript .cal-message-sender{color:#ccd8d0}.is-hak-transcript p{font-size:12px}
.cal-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.cal-kicker{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:#a4c5c3;font-weight:700}.cal-heading h1{font-size:30px;line-height:1.2;margin:6px 0 0;letter-spacing:-1px}.cal-today{color:#c6eee4;background:#28483f;border:1px solid #56867b;border-radius:20px;padding:9px 14px;font:inherit;font-size:12px;cursor:pointer}
.cal-current{font-size:13px;color:#b6cbce;line-height:1.5;margin:0 0 22px}.cal-week{background:#203139;border:1px solid #43565c;border-radius:20px;padding:12px 8px 15px;box-shadow:0 10px 30px #0002}.cal-week-nav{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px;font-size:12px;font-weight:600;color:#dce7e7}.cal-week-nav button{width:34px;height:34px;border:0;border-radius:50%;background:#344850;color:#dce7e7;font-size:22px;cursor:pointer}.cal-week-nav button:disabled{opacity:.28;cursor:default}
.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.cal-day{min-width:0;padding:10px 0 5px;background:transparent;border:1px solid transparent;border-radius:13px;color:#d9e6e9;cursor:pointer;font:inherit}.cal-day-name{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis}.cal-day strong{display:block;font-size:19px;font-weight:500;line-height:1;margin-top:12px}.cal-day:disabled{opacity:.25;cursor:default}.cal-day.is-today{border-color:#5c827b}.cal-day.is-selected{background:#b8e3d5;color:#142d29;border-color:#b8e3d5}.cal-day-mark{height:13px;display:flex;align-items:flex-end;justify-content:center;gap:3px}.cal-day-mark.has-history:before,.cal-day-mark.has-plan:after{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}.cal-day-mark.has-plan:after{background:#dfb967}.cal-selected{font-size:17px;letter-spacing:-.25px;margin:27px 0 5px}.cal-note{font-size:11px;color:#a6bec2;line-height:1.5;margin:0 0 17px}.cal-events{display:flex;flex-direction:column;gap:10px}.cal-event{display:flex;gap:13px;background:#1b2b34;border:1px solid #31464e;padding:15px 13px;border-radius:16px}.cal-event-icon{width:33px;height:33px;flex-shrink:0;display:grid;place-items:center;background:#2c424a;border-radius:11px;color:#a8dcd9;font-size:18px}.cal-event.is-plan{background:#302e26;border-color:#615237}.cal-event.is-plan .cal-event-icon{background:#4a402b;color:#efd99e}.cal-event-meta{font-size:10px;color:#a6bec2;margin-bottom:5px}.cal-event.is-plan .cal-event-meta{color:#d6c69f}.cal-event-copy{min-width:0}.cal-event h3{font-size:14px;line-height:1.4;margin:0 0 5px;overflow-wrap:anywhere}.cal-event p{font-size:12px;color:#b8c9cb;line-height:1.4;margin:0}.cal-empty{padding:27px 15px 22px;text-align:center;border:1px dashed #425963;border-radius:18px}.cal-empty-icon{color:#7eadad;font-size:32px}.cal-empty h3{font-size:16px;font-weight:500}.cal-empty p{max-width:290px;margin:0 auto;color:#a9c1c5;font-size:12px;line-height:1.7}.calendar-app button:focus-visible{outline:2px solid #f4d69a;outline-offset:3px}
@media(min-width:600px){.calendar-app{padding-left:max(24px,calc((100% - 600px)/2));padding-right:max(24px,calc((100% - 600px)/2))}.cal-day strong{font-size:24px}.cal-day-name{font-size:12px}}
</style>
<section class="calendar-app" data-scene data-scene-name="calendar">
  <div data-cal-overview>
  <header class="cal-heading"><div><div class="cal-kicker" data-cal-label="calendar.kicker" data-cal-fallback="Your days">Your days</div><h1 data-cal-label="home.calendar" data-cal-fallback="Calendar">Calendar</h1></div><button class="cal-today" data-cal-today data-cal-label="calendar.today" data-cal-fallback="Today">Today</button></header>
  <p class="cal-current" data-cal-current></p>
  <section class="cal-week"><div class="cal-week-nav"><button type="button" data-cal-prev aria-label="Previous week">‹</button><span data-cal-week-label></span><button type="button" data-cal-next aria-label="Next week">›</button></div><div class="cal-days" data-cal-grid></div></section>
  <h2 class="cal-selected" data-cal-selected></h2>
  <p class="cal-note" data-cal-label="calendar.note" data-cal-fallback="A record of your conversations, shared plans and daily activities.">A record of your conversations, shared plans and daily activities.</p>
  <div class="cal-events" data-cal-events aria-live="polite"></div>
  </div>
  <section class="cal-reader" data-cal-reader hidden aria-labelledby="cal-reader-title">
    <button type="button" class="cal-reader-back" data-cal-reader-back>Back to calendar</button>
    <h2 id="cal-reader-title" data-cal-reader-title></h2>
    <p class="cal-reader-note" data-cal-reader-note></p>
    <div class="cal-reader-messages" data-cal-reader-messages aria-live="polite"></div>
    <nav class="cal-reader-pages" data-cal-reader-pages aria-label="Chat pages"><button type="button" data-cal-reader-prev>Previous messages</button><span data-cal-reader-page></span><button type="button" data-cal-reader-next>Next messages</button></nav>
  </section>
</section>
<script>window.CalendarService?.mount(document.querySelector('[data-scene-name="calendar"]'));</script>
