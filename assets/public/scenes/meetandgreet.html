<style>
  .mg-scene{
    height:100%; overflow:hidden; color:#f7f4ff;
    background:
      radial-gradient(circle at 80% 0%,rgba(255,102,154,.18),transparent 38%),
      linear-gradient(180deg,#17131d 0%,#0c0a10 100%);
    font-family:var(--ui-font);
    display:flex; flex-direction:column;position:relative;isolation:isolate;
  }
  /* The phone's global wallpaper clears scene backgrounds. Keep an app-local
     readability layer behind all content, including tabs and empty states. */
  .mg-scene::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(12,10,16,.94)}
  .mg-head{padding:28px 18px 12px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(12,10,16,.82)}
  .mg-brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.08em;font-size:1.05rem}
  .mg-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#ff5b9d,#ff8a72);box-shadow:0 8px 22px rgba(255,91,157,.25)}
  .mg-mark svg{width:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mg-sub{margin:6px 0 0;color:rgba(247,244,255,.62);font-size:.76rem}
  .mg-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 18px 8px}
  .mg-tab{min-height:40px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.045);color:rgba(247,244,255,.68);font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px}
  .mg-tab.is-active{color:#fff;border-color:rgba(255,109,157,.55);background:rgba(255,91,157,.14)}
  .mg-tab-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;background:#ff3d74;color:#fff;font-size:.68rem;line-height:1;letter-spacing:0;box-shadow:0 0 14px rgba(255,61,116,.5)}
  .mg-tab-badge[hidden]{display:none!important}
  .mg-body{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 92px}
  .mg-panel[hidden]{display:none!important}
  .mg-section-title{margin:10px 0 12px;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(247,244,255,.52)}
  .mg-profile-list{display:grid;gap:12px}
  .mg-profile{width:100%;display:grid;grid-template-columns:88px 1fr auto;gap:13px;align-items:center;text-align:left;padding:0;border:1px solid rgba(255,255,255,.11);border-radius:12px;background:rgba(255,255,255,.055);color:#fff;overflow:hidden;min-height:104px}
  .mg-profile:active{transform:scale(.99)}
  .mg-portrait{align-self:stretch;min-height:104px;background:#27212c;overflow:hidden}
  .mg-portrait img{display:block;width:100%;height:100%;min-height:104px;object-fit:cover;object-position:center}
  .mg-profile-copy{padding:12px 0}.mg-name{display:block;font-size:1rem;font-weight:900}.mg-meta{display:block;margin-top:3px;color:#ff9fbd;font-size:.78rem;font-weight:800}.mg-blurb{display:block;margin-top:7px;color:rgba(247,244,255,.66);font-size:.77rem;line-height:1.35}.mg-counts{display:block;margin-top:7px;color:rgba(247,244,255,.5);font-size:.72rem}
  .mg-chevron{padding-right:14px;color:rgba(255,255,255,.38);font-size:1.3rem}
  .mg-timeline{display:grid;gap:14px}
  .mg-event{border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.045);overflow:hidden}
  .mg-event.is-unread{border-color:rgba(255,95,147,.76);box-shadow:0 0 0 1px rgba(255,95,147,.22),0 0 24px rgba(255,95,147,.28);animation:mg-unread-pulse 1.45s ease-in-out infinite}
  @keyframes mg-unread-pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,95,147,.2),0 0 18px rgba(255,95,147,.18)}50%{box-shadow:0 0 0 1px rgba(255,95,147,.58),0 0 32px rgba(255,95,147,.5)}}
  .mg-event-head{padding:10px 12px 9px}.mg-event-day{font-size:.68rem;font-weight:900;letter-spacing:.13em;color:#ff9fbd;text-transform:uppercase}.mg-event-client{display:flex;align-items:center;gap:9px;margin-top:6px}.mg-event-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#27212c;box-shadow:0 0 0 1px rgba(255,255,255,.18)}.mg-event-name{display:block;font-size:.95rem;font-weight:900;color:#fff}
  .mg-event-frame{position:relative;width:100%;height:min(62vh,560px);background:#07060a;overflow:hidden;cursor:zoom-in}
  .mg-event-frame:focus-visible{outline:2px solid rgba(255,159,189,.95);outline-offset:-4px}
  .mg-event-frame img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;background:#07060a}
  .mg-comment{margin:10px 12px 12px;padding:10px 12px;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:rgba(0,0,0,.18)}.mg-comment-from{display:block;color:#ff9fbd;font-weight:900;font-size:.78rem}.mg-comment-text{display:block;margin-top:4px;color:rgba(247,244,255,.78);font-size:.82rem;line-height:1.38}
  .mg-empty{padding:26px 18px;text-align:center;border:1px dashed rgba(255,255,255,.13);border-radius:16px;color:rgba(247,244,255,.58);font-size:.82rem;line-height:1.5}
  .mg-modal{position:absolute;inset:0;z-index:12;background:rgba(4,3,6,.88);display:flex;align-items:flex-end;padding:16px}.mg-modal[hidden]{display:none!important}
  .mg-sheet{width:100%;max-height:86%;overflow:auto;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#19141e;box-shadow:0 22px 60px rgba(0,0,0,.65)}
  .mg-sheet-hero{height:300px;background:#09070c;overflow:hidden;position:relative}.mg-sheet-hero::before{content:"";position:absolute;inset:0;background-image:var(--mg-portrait-bg);background-size:cover;background-position:center;filter:blur(18px);transform:scale(1.08);opacity:.34}.mg-sheet-hero img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;object-position:center}
  .mg-sheet-copy{padding:16px 17px 18px}.mg-sheet h2{margin:0;font-size:1.25rem}.mg-sheet-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.mg-sheet-tags span{padding:5px 8px;border-radius:999px;background:rgba(255,105,159,.12);color:#ffadc7;font-size:.72rem;font-weight:800}.mg-sheet p{color:rgba(247,244,255,.72);font-size:.85rem;line-height:1.55}
  .mg-close{width:100%;min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-weight:900}
  @media (min-width:600px){.mg-profile-list{grid-template-columns:1fr 1fr}.mg-modal{align-items:center;justify-content:center}.mg-sheet{max-width:440px}}
</style>

<div class="mg-scene" data-scene data-meetandgreet>
  <header class="mg-head">
    <div class="mg-brand">
      <span class="mg-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>
      <span>MeetAndGreet</span>
    </div>
    <p class="mg-sub">Evelyn's private client timeline</p>
  </header>
  <nav class="mg-tabs" aria-label="MeetAndGreet sections">
    <button class="mg-tab is-active" type="button" data-mg-tab="profiles">Profiles</button>
    <button class="mg-tab" type="button" data-mg-tab="timeline">Encounters</button>
  </nav>
  <main class="mg-body">
    <section class="mg-panel" data-mg-panel="profiles">
      <h2 class="mg-section-title">Available profiles</h2>
      <div class="mg-profile-list" id="mg-profile-list"></div>
    </section>
    <section class="mg-panel" data-mg-panel="timeline" hidden>
      <h2 class="mg-section-title">Date photos</h2>
      <div class="mg-timeline" id="mg-timeline"></div>
    </section>
  </main>
  <div class="mg-modal" id="mg-modal" hidden role="dialog" aria-modal="true" aria-label="Profile details">
    <article class="mg-sheet" id="mg-sheet"></article>
  </div>
</div>

<script>
(async () => {
  "use strict";
  const root = document.querySelector("[data-meetandgreet]");
  if (!root) return;

  const api = window.MeetAndGreetSystem;
  if (api && typeof api.reconstructFromCompletedStoriesSync === "function") {
    try { api.reconstructFromCompletedStoriesSync(); } catch {}
  }
  if (api && typeof api.reconstructFromCompletedStories === "function") {
    try { api.reconstructFromCompletedStories().catch(() => {}); } catch {}
  }
  const state = api && typeof api.getState === "function"
    ? api.getState()
    : { unlocked:false, profiles:[], photos:{}, comments:{}, badge:0, seen:[] };
  let stateRef = state;

  const esc = (value) => String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
  const tr = (key, source, vars) => {
    let text = (window.Game && window.Game.i18n && typeof window.Game.i18n.ui === "function")
      ? window.Game.i18n.ui(key, source)
      : source;
    if (vars && typeof vars === "object") {
      Object.entries(vars).forEach(([name, value]) => {
        text = String(text).split("{{" + name + "}}").join(String(value));
      });
    }
    return text;
  };
  const sx = (source) => (window.Game && window.Game.i18n && typeof window.Game.i18n.sourceText === "function")
    ? window.Game.i18n.sourceText(source)
    : source;
  const plural = (count, one, many) => sx(Number(count) === 1 ? one : many);
  const token = (value) => String(value || "").trim().toLowerCase().replace(/\s+/g, "_").replace(/^profile_/, "");
  const profileList = root.querySelector("#mg-profile-list");
  const timeline = root.querySelector("#mg-timeline");
  const modal = root.querySelector("#mg-modal");
  const sheet = root.querySelector("#mg-sheet");
  const timelineTab = root.querySelector("[data-mg-tab='timeline']");

  function clearNode(node) {
    if (!node) return;
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function profilePhotos(profileId) {
    const pid = token(profileId);
    return Array.isArray(stateRef.photos && stateRef.photos[pid]) ? stateRef.photos[pid] : [];
  }

  function profileComments(profileId) {
    const pid = token(profileId);
    return Array.isArray(stateRef.comments && stateRef.comments[pid]) ? stateRef.comments[pid] : [];
  }

  function portraitClass(profile) {
    const n = Math.max(0, Math.min(2, Number(profile && profile.portrait || 0) || 0));
    return "p" + n;
  }

  function profileAvatar(profile) {
    const pid = token(profile && (profile.profileId || profile.id));
    return String(profile && profile.avatar || (api && api.defaultProfiles && api.defaultProfiles[pid] && api.defaultProfiles[pid].avatar) || (api && api.placeholderImage) || "assets/avatars/evelyn.jpg").trim();
  }

  function refreshState() {
    stateRef = api && typeof api.getState === "function" ? api.getState() : stateRef;
    return stateRef;
  }

  function unreadIds() {
    if (Array.isArray(stateRef.unreadEncounterIds)) return new Set(stateRef.unreadEncounterIds.map(token));
    const seen = new Set((Array.isArray(stateRef.seen) ? stateRef.seen : []).map(token));
    const ids = [];
    (Array.isArray(stateRef.profiles) ? stateRef.profiles : []).forEach((profile) => {
      const pid = token(profile.profileId || profile.id);
      profilePhotos(pid).forEach((photo) => ids.push("photo:" + pid + ":" + token(photo.photoId || photo.id)));
    });
    return new Set(ids.filter((id) => !seen.has(token(id))).map(token));
  }

  function setEncounterBadge() {
    const count = Number(stateRef.unreadEncounterCount ?? (api?.getUnreadEncounterCount?.()) ?? unreadIds().size) || 0;
    let badge = timelineTab?.querySelector(".mg-tab-badge");
    if (!timelineTab) return;
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "mg-tab-badge";
      timelineTab.appendChild(badge);
    }
    badge.textContent = count > 99 ? "99+" : String(count);
    badge.hidden = count <= 0;
    timelineTab.setAttribute("aria-label", count > 0
      ? tr("meetandgreet.encounters_unread", "Encounters, {{count}} unread", { count })
      : tr("meetandgreet.encounters", "Encounters"));
  }

  function isClientComment(comment) {
    const text = String(comment && comment.text || "").trim();
    if (!text) return false;
    const from = token(comment && (comment.from || comment.fromName || ""));
    return from && from !== "meetandgreet" && from !== "meetandgreet_tips";
  }

  function commentForPhoto(profileId, photo, usedComments) {
    const pid = token(profileId);
    const photoId = token(photo && (photo.photoId || photo.id));
    const comments = profileComments(pid).filter(isClientComment);
    let match = comments.find((comment) => token(comment.photoId || comment.photo || "") === photoId);
    if (!match) match = comments.find((comment) => !usedComments.has(token(comment.commentId || comment.id)));
    if (match) usedComments.add(token(match.commentId || match.id));
    return match || null;
  }

  function openProfile(profile) {
    const pid = token(profile && (profile.profileId || profile.id));
    api?.markSeen?.("profile:" + pid);
    refreshState();
    const photos = profilePhotos(pid);
    const tags = Array.isArray(profile.tags) ? profile.tags : [];
    const photoHtml = photos.length
      ? "<div class=\"mg-sheet-tags\">" + photos.map((photo) => "<span>" + esc(photo.day || tr("meetandgreet.date_photo", "Date photo")) + "</span>").join("") + "</div>"
      : "";
    sheet.innerHTML =
      "<div class=\"mg-sheet-hero\"><img src=\"" + esc(profileAvatar(profile)) + "\" alt=\"" + esc((profile.name || pid) + " portrait") + "\"></div>" +
      "<div class=\"mg-sheet-copy\">" +
        "<h2>" + esc(profile.name || pid) + "</h2>" +
        "<div class=\"mg-sheet-tags\">" + tags.map((tag) => "<span>" + esc(tag) + "</span>").join("") + "</div>" +
        "<p>" + esc(profile.about || profile.blurb || "") + "</p>" +
        photoHtml +
        "<button type=\"button\" class=\"mg-close\">" + esc(tr("common.close", "Close")) + "</button>" +
      "</div>";
    const heroImg = sheet.querySelector(".mg-sheet-hero img");
    if (heroImg) heroImg.addEventListener("error", () => { heroImg.src = (api && api.placeholderImage) || "assets/avatars/evelyn.jpg"; }, { once:true });
    const hero = sheet.querySelector(".mg-sheet-hero");
    if (hero) hero.style.setProperty("--mg-portrait-bg", "url('" + profileAvatar(profile).replace(/'/g, "\\'") + "')");
    modal.hidden = false;
    sheet.querySelector(".mg-close")?.addEventListener("click", () => { modal.hidden = true; });
  }

  function renderProfiles() {
    clearNode(profileList);
    const profiles = Array.isArray(stateRef.profiles) ? stateRef.profiles : [];
    if (!stateRef.unlocked || profiles.length === 0) {
      profileList.className = "mg-empty";
      profileList.textContent = stateRef.unlocked
        ? tr("meetandgreet.no_profiles", "No profiles unlocked yet. Evelyn will discover them through the story.")
        : tr("meetandgreet.not_installed", "MeetAndGreet is not installed yet.");
      return;
    }
    profileList.className = "mg-profile-list";
    profiles.forEach((profile) => {
      const pid = token(profile.profileId || profile.id);
      const photos = profilePhotos(pid);
      const comments = profileComments(pid).filter(isClientComment);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mg-profile";
      button.dataset.profileId = pid;
      button.innerHTML =
        "<span class=\"mg-portrait\"><img src=\"" + esc(profileAvatar(profile)) + "\" alt=\"" + esc((profile.name || pid) + " portrait") + "\"></span>" +
        "<span class=\"mg-profile-copy\">" +
          "<strong class=\"mg-name\">" + esc(profile.name || pid) + "</strong>" +
          "<span class=\"mg-meta\">" + esc(profile.meta || "") + "</span>" +
          "<span class=\"mg-blurb\">" + esc(profile.blurb || "") + "</span>" +
          "<span class=\"mg-counts\">" + photos.length + " " + esc(plural(photos.length, "photo", "photos")) + " / " + comments.length + " " + esc(plural(comments.length, "comment", "comments")) + "</span>" +
        "</span>" +
        "<span class=\"mg-chevron\" aria-hidden=\"true\">&gt;</span>";
      const img = button.querySelector(".mg-portrait img");
      if (img) img.addEventListener("error", () => { img.src = (api && api.placeholderImage) || "assets/avatars/evelyn.jpg"; }, { once:true });
      button.addEventListener("click", () => openProfile(profile));
      profileList.appendChild(button);
    });
  }

  function renderTimeline() {
    clearNode(timeline);
    const profiles = Array.isArray(stateRef.profiles) ? stateRef.profiles : [];
    const events = [];
    profiles.forEach((profile) => {
      const pid = token(profile.profileId || profile.id);
      profilePhotos(pid).forEach((photo) => {
        events.push({ profile, pid, photo, at:Number(photo.addedAt || 0) || 0 });
      });
    });
    events.sort((a, b) => {
      const bd = Number(String(b.photo.day || "").match(/\d+/)?.[0] || 0) || 0;
      const ad = Number(String(a.photo.day || "").match(/\d+/)?.[0] || 0) || 0;
      return bd - ad || b.at - a.at || String(b.photo.photoId || b.photo.id || "").localeCompare(String(a.photo.photoId || a.photo.id || ""));
    });
    if (!stateRef.unlocked || events.length === 0) {
      timeline.className = "mg-empty";
      timeline.textContent = stateRef.unlocked
        ? tr("meetandgreet.photos_empty", "Date photos will appear here after Evelyn meets someone.")
        : tr("meetandgreet.install_to_unlock", "Install MeetAndGreet through the story to unlock this feed.");
      return;
    }
    timeline.className = "mg-timeline";
    const usedComments = new Set();
    const unread = unreadIds();
    function markEventSeen(article, event) {
      try { api?.markPhotoSeen?.(event.pid, event.photo.photoId || event.photo.id); } catch {}
      refreshState();
      article.classList.remove("is-unread");
      setEncounterBadge();
    }
    function openEncounterPhoto(article, event, img) {
      markEventSeen(article, event);
      const raw = String(event.photo?.image || event.photo?.src || "").trim();
      const src = raw || String(img?.currentSrc || img?.src || "").trim();
      if (!src) return;
      const title = String(event.photo.title || event.photo.caption || ((event.profile.name || event.pid) + " encounter")).trim();
      if (window.MediaViewer && typeof window.MediaViewer.open === "function") {
        window.MediaViewer.open(src, { title, type: "image" });
      } else if (window.Game && typeof window.Game.openMediaViewer === "function") {
        window.Game.openMediaViewer(src, { title, type: "image" });
      }
    }
    events.forEach((event) => {
      const article = document.createElement("article");
      const image = String(event.photo.image || event.photo.src || "").trim();
      const comment = commentForPhoto(event.pid, event.photo, usedComments);
      const seenId = api?.photoSeenId?.(event.pid, event.photo.photoId || event.photo.id) || ("photo:" + event.pid + ":" + token(event.photo.photoId || event.photo.id));
      article.className = "mg-event";
      article.dataset.eventId = token(event.photo.photoId || event.photo.id);
      article.dataset.seenId = seenId;
      article.tabIndex = 0;
      article.setAttribute("role", "button");
      article.classList.toggle("is-unread", unread.has(token(seenId)));
      const head = document.createElement("div");
      head.className = "mg-event-head";
      head.innerHTML =
        "<div class=\"mg-event-day\">" + esc(event.photo.day || "") + "</div>" +
        "<div class=\"mg-event-client\">" +
          "<img class=\"mg-event-avatar\" src=\"" + esc(profileAvatar(event.profile)) + "\" alt=\"" + esc((event.profile.name || event.pid) + " profile avatar") + "\">" +
          "<strong class=\"mg-event-name\">" + esc(event.profile.name || event.pid) + "</strong>" +
        "</div>";
      const avatar = head.querySelector(".mg-event-avatar");
      if (avatar) avatar.addEventListener("error", () => { avatar.src = (api && api.placeholderImage) || "assets/avatars/evelyn.jpg"; }, { once:true });
      const frame = document.createElement("div");
      frame.className = "mg-event-frame";
      frame.tabIndex = 0;
      frame.setAttribute("role", "button");
      frame.setAttribute("aria-label", tr("meetandgreet.open_encounter_photo", "Open {{name}} encounter photo", { name: event.profile.name || event.pid }));
      const img = document.createElement("img");
      img.src = image || (api && api.placeholderImage) || "assets/avatars/evelyn.jpg";
      img.alt = (event.profile.name || event.pid) + " " + tr("meetandgreet.date_photo", "Date photo").toLowerCase();
      img.loading = "lazy";
      img.addEventListener("error", () => {
        try { api?.imageFallbackHandler?.(img, image, event.photo.missingArtDebt || "Temporary MeetAndGreet art placeholder debt", { profileId:event.pid, photoId:event.photo.photoId || event.photo.id }); } catch {}
      });
      frame.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        openEncounterPhoto(article, event, img);
      });
      frame.addEventListener("keydown", (ev) => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault();
        ev.stopPropagation();
        openEncounterPhoto(article, event, img);
      });
      frame.appendChild(img);
      article.appendChild(head);
      article.appendChild(frame);
      if (comment) {
        const commentEl = document.createElement("div");
        commentEl.className = "mg-comment";
        commentEl.innerHTML =
          "<span class=\"mg-comment-from\">" + esc(comment.from || event.profile.name || event.pid) + ":</span>" +
          "<span class=\"mg-comment-text\">" + esc(comment.text || "") + "</span>";
        article.appendChild(commentEl);
      }
      article.addEventListener("click", () => {
        markEventSeen(article, event);
      });
      article.addEventListener("keydown", (ev) => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault();
        article.click();
      });
      timeline.appendChild(article);
    });
  }

  setEncounterBadge();
  renderProfiles();
  renderTimeline();

  root.querySelectorAll("[data-mg-tab]").forEach((button) => {
    button.addEventListener("click", () => {
      const tab = button.dataset.mgTab;
      root.querySelectorAll("[data-mg-tab]").forEach((node) => node.classList.toggle("is-active", node === button));
      root.querySelectorAll("[data-mg-panel]").forEach((panel) => { panel.hidden = panel.dataset.mgPanel !== tab; });
    });
  });
  modal.addEventListener("click", (event) => { if (event.target === modal) modal.hidden = true; });

  // Reconstruction may finish after first paint (old saves and cold startup).
  // Refresh this mounted scene immediately rather than requiring another visit.
  const onStateChanged = () => {
    if (!root.isConnected) { cleanup();return; }
    refreshState();setEncounterBadge();renderProfiles();renderTimeline();
    if (!stateRef.unlocked) modal.hidden = true;
  };
  const onSceneMounted = event => {
    if (!root.isConnected || String(event?.detail?.name || "") !== "meetandgreet") cleanup();
  };
  function cleanup() {
    window.removeEventListener("meetandgreet:state-changed",onStateChanged);
    window.removeEventListener("scene:mounted",onSceneMounted);
  }
  window.addEventListener("meetandgreet:state-changed",onStateChanged);
  window.addEventListener("scene:mounted",onSceneMounted);

  try { window.dispatchEvent(new CustomEvent("meetandgreet:mounted", { detail: stateRef })); } catch {}
})();
</script>
