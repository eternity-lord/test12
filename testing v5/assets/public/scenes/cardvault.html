<!-- scenes/cardvault.html -->
<style>
  :root{
    --fg:#f0f5ff;
    --muted:rgba(240,245,255,0.68);
    --edge:rgba(245,248,255,0.18);
    --edge-strong:rgba(245,248,255,0.38);
    --panel:rgba(6,7,10,0.52);
    --panel-strong:rgba(8,10,16,0.78);
    --accent:#70dcff;
    --warm:#ffbc66;
    --status-h:32px;
  }
  .vault{
    height:100%;
    padding:calc(var(--status-h) + 8px) 14px 16px;
    position:relative;
    z-index:0;
    overflow:auto;
    color:var(--fg);
    font-family:var(--ui-font);
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .vault[data-scene="cardvault"],
  .vault[data-scene="cardvault"] *{
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .vault[data-scene="cardvault"]::-webkit-scrollbar,
  .vault[data-scene="cardvault"] *::-webkit-scrollbar{
    display:none;
    width:0;
    height:0;
  }
  .vault::after{
    content:"";
    position:fixed;
    inset:-18px;
    z-index:-3;
    pointer-events:none;
    background:var(--phone-wallpaper-image) center/cover no-repeat;
    filter:blur(12px) saturate(.62) brightness(.58) contrast(1.06);
    transform:scale(1.06);
  }
  .vault::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 0%, rgba(112,220,255,0.14), rgba(0,0,0,0) 42%),
      linear-gradient(180deg, rgba(5,7,14,0.30), rgba(4,5,10,0.58)),
      repeating-linear-gradient(to bottom, rgba(255,255,255,0) 0 3px, rgba(255,255,255,0.034) 4px);
  }
  .vault-shell{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .vault-header{
    position:sticky;
    top:0;
    z-index:5;
    padding:10px 0 8px;
    background:linear-gradient(180deg, rgba(4,5,10,0.92), rgba(4,5,10,0));
  }
  .vault-title-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }
  .vault-title{
    margin:0;
    font-size:21px;
    line-height:1;
    text-transform:uppercase;
    letter-spacing:.16em;
  }
  .vault-balance{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .vault-pill{
    min-height:32px;
    display:flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--edge);
    border-radius:999px;
    background:rgba(6,7,10,0.58);
    padding:6px 10px;
    font-size:12px;
    font-weight:850;
    letter-spacing:.04em;
  }
  .vault-pill b{ color:#fff; }
  .vault-tabs{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:8px;
    margin-top:12px;
  }
  .vault-tab,
  .vault-btn,
  .vault-filter{
    border:1px solid var(--edge);
    border-radius:999px;
    background:rgba(6,7,10,0.48);
    color:rgba(240,245,255,0.86);
    cursor:pointer;
    font-weight:850;
    letter-spacing:.06em;
    text-transform:uppercase;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:transform .16s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .vault-tab{
    min-height:38px;
    font-size:12px;
  }
  .vault-tab.is-active,
  .vault-filter.is-active{
    border-color:rgba(112,220,255,0.66);
    color:#fff;
    background:rgba(112,220,255,0.14);
    box-shadow:0 0 0 1px rgba(112,220,255,0.12), 0 0 14px rgba(112,220,255,0.12);
  }
  .vault-view[hidden]{ display:none !important; }
  .vault-grid{
    display:grid;
    grid-template-columns:minmax(0, .86fr) minmax(320px, 1.14fr);
    gap:12px;
    align-items:start;
  }
  .vault-panel{
    border:1px solid var(--edge);
    border-radius:16px;
    background:var(--panel);
    box-shadow:0 18px 44px rgba(0,0,0,0.54);
    overflow:hidden;
  }
  .vault-panel-head{
    padding:12px 13px;
    border-bottom:1px solid rgba(245,248,255,0.12);
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
  }
  .vault-panel-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:rgba(240,245,255,0.82);
    font-weight:900;
  }
  .vault-panel-body{ padding:13px; }
  .pack-list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
    gap:12px;
  }
  .pack-card{
    display:flex;
    flex-direction:column;
    gap:12px;
    border:1px solid var(--pack-border, rgba(245,248,255,0.14));
    border-radius:14px;
    background:rgba(6,7,10,0.42);
    padding:12px;
    box-shadow:0 0 22px var(--pack-glow, rgba(245,248,255,0.04));
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .pack-art{
    aspect-ratio:1/1;
    min-height:172px;
    border-radius:14px;
    border:1px solid var(--pack-border, rgba(245,248,255,0.16));
    background:
      var(--pack-bg-image, linear-gradient(transparent, transparent)),
      radial-gradient(circle at 28% 18%, var(--pack-glow, rgba(112,220,255,0.24)), rgba(0,0,0,0) 42%),
      radial-gradient(circle at 78% 82%, color-mix(in srgb, var(--pack-border, #ffbc66) 22%, transparent), rgba(0,0,0,0) 38%),
      linear-gradient(145deg, rgba(17,24,42,0.96), rgba(6,7,10,0.96));
    background-size:cover;
    background-position:center;
    display:grid;
    place-items:center;
    position:relative;
    overflow:hidden;
  }
  .pack-art-img{
    position:absolute;
    inset:0;
    z-index:2;
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    object-position:center;
  }
  .pack-art:not(.has-pack-artwork)::before{
    content:"";
    position:absolute;
    inset:18px 42px;
    border:1px solid rgba(245,248,255,0.24);
    border-radius:13px;
    transform:rotate(-7deg);
    background:linear-gradient(150deg, rgba(245,248,255,0.16), rgba(245,248,255,0.02));
    box-shadow:0 18px 32px rgba(0,0,0,0.44);
  }
  .pack-card[data-pack-pattern="grid"] .pack-art{
    background:
      linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,.06) 1px, transparent 1px),
      var(--pack-bg-image, linear-gradient(transparent, transparent)),
      linear-gradient(145deg, rgba(54,58,66,.96), rgba(8,9,12,.98));
    background-size:28px 28px, 28px 28px, cover, cover;
  }
  .pack-card[data-pack-pattern="circuit"] .pack-art{
    background:
      linear-gradient(115deg, rgba(85,207,255,.22), transparent 34%),
      repeating-linear-gradient(90deg, transparent 0 18px, rgba(85,207,255,.10) 19px 20px),
      radial-gradient(circle at 50% 12%, rgba(85,207,255,.46), transparent 32%),
      linear-gradient(145deg, rgba(12,35,52,.98), rgba(4,8,16,.98));
  }
  .pack-card[data-pack-pattern="sunburst"] .pack-art{
    background:
      conic-gradient(from 20deg at 50% 45%, rgba(255,178,63,.34), transparent 12%, rgba(255,240,178,.22) 18%, transparent 26%, rgba(255,178,63,.34) 36%, transparent 46%),
      radial-gradient(circle at 50% 18%, rgba(255,222,138,.56), transparent 32%),
      linear-gradient(145deg, rgba(70,33,7,.98), rgba(9,6,4,.98));
  }
  .pack-card[data-pack-finish="chrome"] .pack-art:not(.has-pack-artwork)::before{
    background:linear-gradient(130deg, rgba(255,255,255,.34), rgba(85,207,255,.08) 45%, rgba(255,255,255,.18));
  }
  .pack-card[data-pack-finish="gold_foil"] .pack-art:not(.has-pack-artwork)::before{
    background:linear-gradient(130deg, rgba(255,244,184,.42), rgba(255,178,63,.10) 45%, rgba(255,244,184,.30));
    box-shadow:0 18px 42px rgba(255,178,63,.20), 0 18px 32px rgba(0,0,0,.44);
  }
  .pack-name{
    font-size:20px;
    font-weight:900;
    letter-spacing:.06em;
  }
  .pack-desc{
    color:var(--muted);
    font-size:13px;
    line-height:1.45;
  }
  .pack-odds{
    display:grid;
    gap:5px;
    border:1px solid rgba(245,248,255,.12);
    border-radius:10px;
    padding:8px;
    background:rgba(0,0,0,.18);
  }
  .pack-odds-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:10px;
    color:rgba(240,245,255,.74);
    font-size:11px;
    font-weight:850;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .pack-meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .pack-badge{
    min-height:26px;
    display:inline-flex;
    align-items:center;
    border:1px solid rgba(255,188,102,0.34);
    border-radius:999px;
    background:rgba(255,188,102,0.12);
    color:rgba(255,229,188,0.96);
    padding:4px 9px;
    font-size:11px;
    font-weight:900;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .vault-btn{
    min-height:42px;
    padding:0 14px;
    background:rgba(112,220,255,0.14);
    border-color:rgba(112,220,255,0.44);
    color:#fff;
  }
  .vault-btn[disabled]{
    opacity:.46;
    cursor:not-allowed;
  }
  .reveal-stage{
    min-height:365px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
  }
  .reveal-pack{
    width:116px;
    height:154px;
    margin:0 auto;
    border-radius:16px;
    border:1px solid rgba(245,248,255,0.26);
    background:linear-gradient(145deg, rgba(112,220,255,0.22), rgba(255,188,102,0.14)), rgba(6,7,10,0.88);
    box-shadow:0 20px 46px rgba(0,0,0,.6), 0 0 26px rgba(112,220,255,.12);
    display:grid;
    place-items:center;
    text-transform:uppercase;
    letter-spacing:.22em;
    font-size:12px;
    font-weight:900;
    transform:translateZ(0);
  }
  .reveal-pack.is-opening{
    animation:vault-pack-open .72s cubic-bezier(.2,.82,.2,1) both;
  }
  .reveal-cards{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:10px;
  }
  .vault-card{
    min-height:218px;
    perspective:900px;
  }
  .vault-card-inner{
    height:100%;
    min-height:218px;
    border-radius:15px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.82,.2,1);
  }
  .vault-card.is-revealed .vault-card-inner{ transform:rotateY(180deg); }
  .vault-card-back,
  .vault-card-front{
    position:absolute;
    inset:0;
    border-radius:15px;
    border:1px solid rgba(245,248,255,0.16);
    backface-visibility:hidden;
    overflow:hidden;
    background:rgba(6,7,10,0.82);
  }
  .vault-card-back{
    display:grid;
    place-items:center;
    color:rgba(240,245,255,0.62);
    text-transform:uppercase;
    letter-spacing:.18em;
    font-size:11px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.06) 0 1px, rgba(255,255,255,0) 1px 7px),
      linear-gradient(145deg, rgba(12,16,28,0.98), rgba(4,5,10,0.98));
  }
  .vault-card-front{
    transform:rotateY(180deg);
    display:flex;
    flex-direction:column;
    border-color:var(--rarity-border, rgba(245,248,255,0.18));
    box-shadow:
      0 0 0 1px var(--rarity-border, rgba(245,248,255,0.18)) inset,
      0 0 var(--rarity-glow-strength, 8px) var(--rarity-glow, rgba(245,248,255,0.14));
  }
  .vault-card-front.is-special{
    box-shadow:
      0 0 0 1px var(--rarity-color, rgba(245,248,255,0.24)) inset,
      0 0 24px color-mix(in srgb, var(--rarity-color, #ffbc66) 42%, transparent);
  }
  .vault-card-img{
    height:126px;
    background:#06070a center/contain no-repeat;
  }
  .vault-card-info{
    padding:9px;
    display:flex;
    flex-direction:column;
    gap:5px;
    min-height:92px;
  }
  .vault-card-title{
    font-weight:900;
    font-size:13px;
    line-height:1.15;
  }
  .vault-card-meta{
    color:var(--rarity-color, #d7e1f2);
    text-transform:uppercase;
    letter-spacing:.13em;
    font-size:10px;
    font-weight:900;
  }
  .vault-card-desc{
    display:none;
  }
  .vault-card-dupe{
    margin-top:auto;
    color:rgba(255,220,158,0.94);
    font-size:11px;
    font-weight:850;
  }
  .vault-card-dupe.is-duplicate{
    display:inline-flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:3px;
    opacity:.9;
    animation:vault-dupe-in .32s ease-out both;
  }
  .dust-count{ font-variant-numeric:tabular-nums; color:#ffe29a; }
  .summary-strip{
    min-height:28px;
    text-align:center;
    color:rgba(240,245,255,0.74);
    font-size:13px;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
  }
  .collection-controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
  }
  .mason-display-preference{
    flex:1 1 100%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:7px;
    padding:8px;
    border:1px solid rgba(245,248,255,.12);
    border-radius:12px;
    background:rgba(6,7,10,.34);
  }
  .mason-display-preference-label{
    flex:1 1 100%;
    font-size:11px;
    font-weight:850;
    letter-spacing:.06em;
    color:rgba(240,245,255,.78);
  }
  .mason-display-preference .vault-filter{ flex:1 1 120px; }
  .vault-filter{
    min-height:30px;
    padding:0 10px;
    font-size:11px;
    letter-spacing:.04em;
    max-width:100%;
    white-space:normal;
    line-height:1.15;
  }
  .collection-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(146px, 1fr));
    gap:10px;
    position:relative;
    isolation:isolate;
    align-items:stretch;
  }
  .collection-card{
    border:1px solid rgba(245,248,255,0.14);
    border-radius:14px;
    background:rgba(6,7,10,0.50);
    overflow:hidden;
    min-height:216px;
    height:100%;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    position:relative;
    isolation:isolate;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s ease, border-color .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .collection-card.is-owned{
    border-color:var(--rarity-border, rgba(245,248,255,0.18));
    box-shadow:0 0 var(--rarity-glow-strength, 8px) var(--rarity-glow, rgba(245,248,255,0.12));
  }
  .collection-card.is-missing{
    filter:saturate(.25);
    opacity:.62;
    cursor:default;
  }
  .collection-img{
    height:152px;
    flex:0 0 152px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#06070a;
    position:relative;
  }
  .collection-img > .vault-artwork{
    position:relative;
    inset:auto;
    flex:0 0 auto;
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    object-position:center;
    opacity:1 !important;
    filter:none !important;
    mix-blend-mode:normal !important;
  }
  .collection-img.is-pending{
    background:
      linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.10), rgba(255,255,255,.04)),
      #06070a;
    background-size:220% 100%;
    animation:vault-loading-sheen 1.4s ease-in-out infinite;
  }
  .new-badge{
    position:absolute;
    top:8px;
    left:8px;
    z-index:7;
    min-height:24px;
    display:inline-flex;
    align-items:center;
    border:1px solid rgba(112,220,255,.70);
    border-radius:999px;
    background:rgba(112,220,255,.22);
    color:#fff;
    padding:3px 8px;
    font-size:10px;
    font-weight:950;
    letter-spacing:.12em;
    text-transform:uppercase;
    box-shadow:0 0 16px rgba(112,220,255,.22);
  }
  .new-badge.is-celebrating{ animation:vault-new-badge .72s cubic-bezier(.2,.82,.2,1) both; }
  .collection-card.is-missing .collection-img::after{
    content:"?";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    background:rgba(0,0,0,.62);
    color:rgba(240,245,255,.68);
    font-size:42px;
    font-weight:900;
  }
  .collection-copy{
    padding:8px 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:62px;
    flex:1 1 auto;
  }
  .collection-meta{
    width:100%;
    min-height:46px;
    display:grid;
    grid-template-rows:minmax(0, auto) minmax(0, auto);
    align-content:center;
    justify-items:center;
    gap:4px;
    text-align:center;
    text-transform:uppercase;
    font-size:clamp(10px, 2.8vw, 12px);
    font-weight:900;
    line-height:1.15;
  }
  .collection-character,
  .collection-rarity{
    display:block;
    max-width:100%;
    text-align:center;
    overflow-wrap:anywhere;
  }
  .collection-character{
    color:rgba(245,248,255,.94);
    letter-spacing:.08em;
  }
  .collection-rarity{
    color:var(--rarity-color, #d7e1f2);
    letter-spacing:.12em;
    font-size:.9em;
  }
  .dust-exchange{
    display:grid;
    grid-template-columns:minmax(0, 1fr) auto;
    gap:12px;
    align-items:center;
  }
  .dust-rate{
    color:rgba(240,245,255,.74);
    font-size:13px;
    line-height:1.45;
  }
  .dust-controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:flex-end;
  }
  .dust-select{
    min-height:42px;
    border:1px solid var(--edge);
    border-radius:999px;
    background:rgba(6,7,10,0.68);
    color:#fff;
    padding:0 12px;
    font-weight:850;
  }
  .vault-message{
    margin-top:10px;
    min-height:18px;
    color:rgba(240,245,255,.76);
    font-size:12px;
  }
  .pack-overlay,
  .card-viewer{
    position:fixed;
    inset:0;
    z-index:1000;
    display:grid;
    place-items:center;
    padding:20px;
    background:rgba(0,0,0,.86);
    color:var(--fg);
  }
  .pack-overlay:not([hidden]),
  .card-viewer:not([hidden]){ animation:vault-overlay-in .22s ease-out both; }
  .pack-overlay[hidden],
  .card-viewer[hidden]{ display:none !important; }
  .pack-flow{
    width:min(980px, 100%);
    min-height:min(760px, calc(100vh - var(--nav-h, 0px) - 40px));
    max-height:calc(100vh - var(--nav-h, 0px) - 40px);
    display:grid;
    grid-template-rows:1fr auto auto;
    gap:14px;
    align-items:center;
  }
  .pack-flow.is-summary{
    height:min(760px, calc(100vh - var(--nav-h, 0px) - 40px));
    min-height:0;
    grid-template-rows:minmax(0, 1fr) auto;
    align-items:stretch;
    overflow:hidden;
  }
  .pack-package{
    width:min(260px, 64vw);
    aspect-ratio:3/4;
    margin:auto;
    border:1px solid var(--pack-border, rgba(245,248,255,.28));
    border-radius:20px;
    background:
      var(--pack-bg-image, linear-gradient(transparent, transparent)),
      radial-gradient(circle at 28% 18%, var(--pack-glow, rgba(112,220,255,0.28)), rgba(0,0,0,0) 42%),
      radial-gradient(circle at 76% 80%, color-mix(in srgb, var(--pack-border, #ffbc66) 26%, transparent), rgba(0,0,0,0) 38%),
      linear-gradient(145deg, rgba(17,24,42,0.98), rgba(6,7,10,0.98));
    background-size:cover;
    background-position:center;
    box-shadow:0 30px 90px rgba(0,0,0,.72), 0 0 44px var(--pack-glow, rgba(112,220,255,.18));
    display:flex;
    align-items:center;
    justify-content:center;
    text-transform:uppercase;
    letter-spacing:.18em;
    font-weight:950;
    text-align:center;
    cursor:pointer;
    user-select:none;
    position:relative;
    padding:24px;
    opacity:0;
    transform:translate3d(0, 34px, 0) scale(.88);
    will-change:transform, opacity;
    container-type:inline-size;
  }

        <span class="bonus-particle"></span><span class="bonus-particle"></span><span class="bonus-particle"></span><span class="bonus-particle"></span><span class="bonus-particle"></span>

        <div class="tutorial-top"><span data-tutorial-step></span><button class="tutorial-skip" type="button" data-tutorial-skip></button></div>
        <h2 class="tutorial-title" id="card-vault-tutorial-title" data-tutorial-title></h2>
        <div class="tutorial-copy" data-tutorial-copy></div>
        <div class="tutorial-actions">
          <div class="tutorial-dots" data-tutorial-dots aria-hidden="true"></div>
          <div class="tutorial-actions-right"><button class="vault-btn" type="button" data-tutorial-back></button><button class="vault-btn" type="button" data-tutorial-next></button></div>
        </div>

</div>

<script>
(function () {
  const root = document.querySelector('[data-scene="cardvault"]');
  if (!root || !window.CardVaultSystem) return;
  try { window.__cardVaultSceneCleanup?.(); } catch {}

  // Timers belong to this mounted scene, including delayed reveal receipts.
  // Leaving it must retire them without collecting or changing a pending pack.
  let sceneActive = true;
  const sceneTimers = new Set();
  const sceneFrames = new Set();
  const setTimeout = (callback, delay, ...args) => {
    if (!sceneActive) return 0;
    const id = window.setTimeout(() => {
      sceneTimers.delete(id);
      if (sceneActive) callback(...args);
    }, delay);
    sceneTimers.add(id);
    return id;
  };
  const clearTimeout = (id) => { sceneTimers.delete(id); window.clearTimeout(id); };
  const requestAnimationFrame = (callback) => {
    if (!sceneActive) return 0;
    const id = window.requestAnimationFrame((time) => {
      sceneFrames.delete(id);
      if (sceneActive) callback(time);
    });
    sceneFrames.add(id);
    return id;
  };

  const q = (sel) => root.querySelector(sel);
  const qa = (sel) => Array.from(root.querySelectorAll(sel));
  const ui = (key, source) => {
    const cleanKey = String(key || "").replace(/^ui\./, "");
    try { return window.Game?.i18n?.ui?.(cleanKey, source) || source; } catch { return source; }
  };
  const sourceText = (source) => {
    try { return window.Game?.i18n?.sourceText?.(source) || source; } catch { return source; }
  };
  const builtInCharacterNames = Object.freeze({
    lena: ui("cardvault.character_lena", "Lena"),
    hailey: ui("cardvault.character_hailey", "Hailey"),
    evelyn: ui("cardvault.character_evelyn", "Evelyn"),
    aiden: ui("cardvault.character_aiden", "Aiden"),
    mason_male: ui("cardvault.character_mason_male", "Mason — Male"),
    mason_female: ui("cardvault.character_mason_female", "Mason — Female")
  });

  let config = null;
  let state = null;
  let filter = { mode: "all", rarity: "", character: "", duplicate: false };
  let sortMode = "newest";
  let opening = false;
  let reveal = { result: null, stage: 0, locked: false, timer: 0, introTimer: 0, unlockTimer: 0, cueTimers: [], queuedAdvances: 0 };
  let revealClosing = false;
  let revealPointer = null;
  let viewer = { cards: [], index: -1, touchX: 0, history: false, closing: false, timer: 0 };
  let exchanging = false;
  let specialRedeeming = false;
  let specialFeedback = "ready";
  let specialGrantedAmount = 0;
  let specialGrantedCard = false;
  let bonusTimer = 0;
  let tutorial = { step: 0, replay: false, awaitingFreeReveal: false, lastFocus: null };
  const imageCache = new Set();
  const failedImages = new Set();
  const lazyImages = "IntersectionObserver" in window
    ? new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        loadLazyImage(entry.target);
        lazyImages.unobserve(entry.target);
      });
    }, { root: q(".vault"), rootMargin: "260px 0px" })
    : null;
  const rarityEffectsObserver = "IntersectionObserver" in window
    ? new IntersectionObserver((entries) => {
      entries.forEach((entry) => entry.target.classList.toggle("is-effects-visible", entry.isIntersecting));
    }, { root: null, rootMargin: "80px 0px", threshold: .01 })
    : null;

  function fmt(n) {
    const value = Math.max(0, Math.floor(Number(n || 0) || 0));
    const language = String(window.Game?.i18n?.getLanguage?.() || "en");
    try { return new Intl.NumberFormat(language).format(value); } catch { return String(value); }
  }

  function tutorialSteps() {
    const basic = config?.packById?.basic_pack || config?.packs?.find((pack) => pack.enabled) || { cardCount: 3, cost: 0 };
    const dustValues = config?.duplicatePolicy?.rarityValues || {};
    const exchange = config?.duplicatePolicy?.dustExchange || {};
    const tierRows = (config?.rewardTiers || []).filter((tier) => tier.id !== "free");
    const packRows = (config?.packs || []).filter((pack) => pack.enabled);
    const p = (key, source) => ({ key, source });
    return [
      { title: p("cardvault.tutorial.welcome.title", "Welcome to Card Vault"), body: [
        p("cardvault.tutorial.welcome.bonus", "Card Vault is a bonus collectible system where you can unlock exclusive cards featuring characters from iNTeRcepted."),
        p("cardvault.tutorial.welcome.noncanon", "These cards are not canon. Their scenes do not necessarily happen in the official story and are bonus collectible artwork."),
        p("cardvault.tutorial.welcome.independent", "Opening packs, collecting cards, and spending Card Points never affect story progress, choices, relationships, or routes.") ] },
      { title: p("cardvault.tutorial.cards.title", "Collect Cards"), body: [
        p("cardvault.tutorial.cards.pack", "Each pack contains {count} cards.".replace("{count}", fmt(basic.cardCount))),
        p("cardvault.tutorial.cards.rarity", "Cards have different rarities, and rarer cards are harder to obtain."),
        p("cardvault.tutorial.cards.permanent", "Every new card is permanently added to your Collection. Character filters adapt to every available character.") ] },
      { title: p("cardvault.tutorial.free.title", "Your First Pack Is Free"), body: [
        p("cardvault.tutorial.free.body", "To get you started, your first Basic Pack is on us."),
        p("cardvault.tutorial.free.discover", "Open it and discover your first {count} cards.".replace("{count}", fmt(basic.cardCount))) ], action: "free" },
      { title: p("cardvault.tutorial.viewer.title", "Inspect Every Card"), body: [
        p("cardvault.tutorial.viewer.body", "After all cards are revealed, select any card to inspect it fullscreen. Close the viewer to return to the complete pack result."),
        p("cardvault.tutorial.viewer.controls", "Use touch or mouse, the visible close button, the area outside the card, or Escape on desktop.") ] },
      { title: p("cardvault.tutorial.collection.title", "Your Collection"), body: [
        p("cardvault.tutorial.collection.body", "Every card you unlock is stored here. Browse discovered cards and identify cards that are still locked."),
        p("cardvault.tutorial.collection.filters", "Filters automatically include all current and future Card Vault characters.") ], tab: "collection" },
      { title: p("cardvault.tutorial.dust.title", "Duplicates & Card Dust"), body: [
        p("cardvault.tutorial.dust.body", "A card you already own becomes Card Dust. Dust records the value of your duplicates and is preserved for future use."),
        { values: Object.entries(dustValues).map(([rarityId, amount]) => `${rarityName(rarityId)}: ${fmt(amount)} ${ui("cardvault.dust", "Dust")}`) },
        { values: [`${fmt(exchange.dustCost)} ${ui("cardvault.dust", "Dust")} → ${fmt(exchange.pointsReward)} ${ui("cardvault.points", "Card Points")}`] } ] },
      { title: p("cardvault.tutorial.points.title", "Card Points"), body: [
        p("cardvault.tutorial.points.body", "Card Points open Card Vault packs. Rewards, supporter benefits, and special Card Vault codes can grant them. Card Points and Card Dust are separate currencies."),
        { values: packRows.map((pack) => `${sourceText(pack.name || pack.id)}: ${fmt(pack.cost)} ${ui("cardvault.points", "Card Points")}`) } ] },
      { title: p("cardvault.tutorial.codes.title", "Supporter Rewards & Codes"), body: [
        p("cardvault.tutorial.codes.body", "Enter the code associated with your supporter tier to claim its exact-once Card Vault reward. Promotional reward codes are supported when available."),
        { values: tierRows.map((tier) => `${sourceText(tier.name || tier.id)}: ${fmt(tier.points)} ${ui("cardvault.points", "Card Points")}`) },
        p("cardvault.tutorial.codes.security", "Claimed codes cannot grant their reward again. Private QA and developer codes are never shown here.") ], tab: "rewards" },
      { title: p("cardvault.tutorial.ready.title", "You're Ready"), body: [
        p("cardvault.tutorial.ready.summary", "Open packs, discover cards, complete your Collection, convert duplicates into Card Dust, spend Card Points, and claim supporter rewards in Codes."),
        p("cardvault.tutorial.ready.noncanon", "Remember: Card Vault is bonus content, and its cards are not canon to the official iNTeRcepted story.") ], final: true }
    ];
  }

  function closeTutorial({ completed = false } = {}) {
    const overlay = q("[data-tutorial-overlay]");
    if (overlay) overlay.hidden = true;
    if (completed) window.CardVaultSystem.updateOnboarding({ tutorialSeen: true, tutorialCompleted: true });
    else window.CardVaultSystem.updateOnboarding({ tutorialSeen: true });
    tutorial.awaitingFreeReveal = false;
    tutorial.lastFocus?.focus?.();
  }

  function renderTutorial() {
    const steps = tutorialSteps();
    tutorial.step = Math.max(0, Math.min(steps.length - 1, tutorial.step));
    const step = steps[tutorial.step];
    const overlay = q("[data-tutorial-overlay]");
    if (!overlay) return;
    overlay.hidden = false;
    q("[data-tutorial-step]").textContent = `${tutorial.step + 1} / ${steps.length}`;
    q("[data-tutorial-title]").textContent = ui(step.title.key, step.title.source);
    const copy = q("[data-tutorial-copy]");
    copy.innerHTML = "";
    step.body.forEach((row) => {
      if (typeof row === "string") { const node = document.createElement("p"); node.textContent = row; copy.appendChild(node); return; }
      if (row.values) { const box = document.createElement("div"); box.className = "tutorial-values"; row.values.forEach((value) => { const line = document.createElement("span"); line.textContent = value; box.appendChild(line); }); copy.appendChild(box); return; }
      const node = document.createElement("p"); node.textContent = ui(row.key, row.source); copy.appendChild(node);
    });
    const dots = q("[data-tutorial-dots]"); dots.innerHTML = "";
    steps.forEach((_, index) => { const dot = document.createElement("span"); dot.className = `tutorial-dot${index === tutorial.step ? " is-active" : ""}`; dots.appendChild(dot); });
    const back = q("[data-tutorial-back]"); back.textContent = ui("cardvault.tutorial.back", "Back"); back.disabled = tutorial.step === 0;
    const skip = q("[data-tutorial-skip]"); skip.textContent = ui("cardvault.tutorial.skip", "Skip Tutorial");
    const next = q("[data-tutorial-next]");
    const granted = window.CardVaultSystem.readState().onboarding?.firstFreePackGranted === true;
    next.textContent = step.action === "free" ? (granted ? ui("cardvault.tutorial.continue", "Continue") : ui("cardvault.tutorial.open_free", "Open Free Pack")) : step.final ? ui("cardvault.tutorial.start", "Start Collecting") : ui("cardvault.tutorial.next", "Next");
    requestAnimationFrame(() => q("[data-tutorial-dialog]")?.focus());
  }

  function openTutorial(step = 0, replay = true) {
    tutorial = { step, replay, awaitingFreeReveal: false, lastFocus: document.activeElement };
    window.CardVaultSystem.updateOnboarding({ tutorialSeen: true });
    renderTutorial();
  }

  async function advanceTutorial() {
    const step = tutorialSteps()[tutorial.step];
    if (step.action === "free" && !window.CardVaultSystem.readState().onboarding?.firstFreePackGranted) {
      const result = await window.CardVaultSystem.openIntroductoryPack();
      if (!sceneActive) return;
      if (!result.ok) { if (result.reason === "storage_full") window.showToast?.(ui("storage.full.card_vault", "Storage is full. The pack was not opened and no points were spent.")); renderTutorial(); return; }
      tutorial.awaitingFreeReveal = true;
      q("[data-tutorial-overlay]").hidden = true;
      reveal.result = result; reveal.stage = 0; renderRevealOverlay(); armRevealFallback();
      return;
    }
    if (step.final) { closeTutorial({ completed: true }); switchTab("packs"); return; }
    tutorial.step += 1;
    const nextStep = tutorialSteps()[tutorial.step];
    if (nextStep?.tab) switchTab(nextStep.tab);
    renderTutorial();
  }

  function skipTutorial() {
    if (!window.CardVaultSystem.readState().onboarding?.firstFreePackGranted) { tutorial.step = 2; renderTutorial(); return; }
    closeTutorial({ completed: true });
  }
  function playVaultSound(id, opts = {}) {
    try {
      const playback = window.Game?.audio?.play?.(id, opts) || null;
      if (playback && typeof playback.catch === "function") playback.catch(() => null);
      return playback;
    } catch {
      return null;
    }
  }
  function playPendingRevealSoundOnce(cueId, soundId, { delayMs = 0 } = {}) {
    const pendingRevealId = String(reveal.result?.pendingReveal?.id || "");
    if (!pendingRevealId || !cueId || !soundId) return false;
    const claim = window.CardVaultSystem.claimPendingRevealAudioCue?.(cueId, pendingRevealId);
    if (!claim?.ok) return false;
    const play = () => playVaultSound(soundId, {
      cooldownKey: `card_vault_${pendingRevealId}_${cueId}`,
      bypassCooldown: true
    });
    if (delayMs > 0) setTimeout(play, delayMs);
    else play();
    return true;
  }
  const RARITY_REVEAL_ACCENT_SOUND_IDS = Object.freeze({
    rare: "cardVaultRareAccent",
    epic: "cardVaultEpicAccent",
    legendary: "cardVaultLegendaryAccent",
    mythic: "cardVaultMythicAccent",
    ultra_mythic: "cardVaultMythicAccent"
  });
  function resolveRarityRevealAccentSound(rarityId) {
    return RARITY_REVEAL_ACCENT_SOUND_IDS[String(rarityId || "").trim().toLowerCase()] || "";
  }
  function clearRevealCueTimers() {
    (reveal.cueTimers || []).forEach((timer) => clearTimeout(timer));
    reveal.cueTimers = [];
  }
  function scheduleVisibleRevealSoundOnce(cueId, soundId, stage, delayMs) {
    const pendingRevealId = String(reveal.result?.pendingReveal?.id || "");
    if (!pendingRevealId || !soundId) return false;
    const timer = setTimeout(() => {
      reveal.cueTimers = (reveal.cueTimers || []).filter((item) => item !== timer);
      const overlay = q("[data-pack-overlay]");
      if (String(reveal.result?.pendingReveal?.id || "") !== pendingRevealId || reveal.stage !== stage || !overlay || overlay.hidden) return;
      playPendingRevealSoundOnce(cueId, soundId);
    }, Math.max(0, Number(delayMs || 0)));
    reveal.cueTimers = reveal.cueTimers || [];
    reveal.cueTimers.push(timer);
    return true;
  }
  function visibleRevealDelayMs(rarityId) {
    if (reducedMotion()) return 35;
    const id = String(rarityId || "").trim().toLowerCase();
    if (id === "ultra_mythic") return 840;
    if (id === "mythic") return 740;
    if (id === "legendary") return 520;
    if (id === "epic") return 230;
    if (id === "rare") return 180;
    return 90;
  }
  function rarity(card) { return config?.rarityById?.[card?.rarity] || { id: card?.rarity || "", name: card?.rarity || "", color: "#d7e1f2" }; }
  function owned(card) { return !!state?.owned?.[card.id]; }
  function secretCodeCard(card) { return card?.acquisitionType === "code_only" || card?.acquisition === "code_only"; }
  function rarityIsVisible(def) { return def?.id !== "ultra_mythic" || (config?.cards || []).some((card) => card.rarity === def.id && owned(card)); }
  function rarityName(id) { return sourceText(config?.rarityById?.[id]?.name || id || "Unknown"); }
  function characterName(idOrCard) {
    const id = String(typeof idOrCard === "object" ? idOrCard?.characterId : idOrCard || "").trim().toLowerCase();
    const meta = config?.characterById?.[id] || null;
    if (builtInCharacterNames[id]) return builtInCharacterNames[id];
    return meta?.displayNameKey
      ? ui(meta.displayNameKey, sourceText(meta.displayName || id))
      : sourceText(meta?.displayName || (typeof idOrCard === "object" ? idOrCard?.character : id) || "");
  }
  function escapeUrl(url) { return String(url || "").replace(/"/g, "%22"); }
  function reducedMotion() { return !!window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches; }
  function liteEffects() {
    const html = document.documentElement;
    return !!(window.Game?.isAndroidWebView || html?.classList.contains("android-webview") || html?.classList.contains("lite-effects"));
  }
  function packText(pack, field, fallback = "") {
    const key = String(pack?.[`${field}Key`] || "");
    return key ? ui(key, sourceText(pack?.[field] || fallback)) : sourceText(pack?.[field] || fallback);
  }

  function packTitleLineCount(node) {
    if (!node || !node.textContent) return 0;
    const range = document.createRange();
    range.selectNodeContents(node);
    const tops = [];
    Array.from(range.getClientRects()).forEach((rect) => {
      if (rect.width <= 0 || rect.height <= 0) return;
      if (!tops.some((top) => Math.abs(top - rect.top) < 1)) tops.push(rect.top);
    });
    return Math.max(1, tops.length);
  }

  function fitPackTitle(node) {
    if (!node || !node.isConnected) return;
    node.style.removeProperty("font-size");
    let size = Number.parseFloat(getComputedStyle(node).fontSize) || 28;
    const minimum = 7;
    const fits = () => {
      const style = getComputedStyle(node);
      const lineHeight = Number.parseFloat(style.lineHeight) || size * 1.08;
      return node.scrollWidth <= node.clientWidth + 1
        && node.scrollHeight <= lineHeight * 2 + 1
        && packTitleLineCount(node) <= 2;
    };
    node.style.fontSize = `${size}px`;
    while (size > minimum && !fits()) {
      size = Math.max(minimum, size - .5);
      node.style.fontSize = `${size}px`;
    }
    node.dataset.packTitleFitSize = size.toFixed(1);
    node.dataset.packTitleFitLines = String(packTitleLineCount(node));
    node.dataset.packTitleFitText = node.textContent || "";
  }

  const packTitleFitObserver = typeof MutationObserver === "function"
    ? new MutationObserver((mutations) => {
        const titles = new Set();
        mutations.forEach((mutation) => {
          const target = mutation.target?.nodeType === 1 ? mutation.target : mutation.target?.parentElement;
          const closest = target?.closest?.(".pack-package-title");
          if (closest) titles.add(closest);
          mutation.addedNodes.forEach((added) => {
            if (added?.nodeType !== 1) return;
            if (added.matches?.(".pack-package-title")) titles.add(added);
            added.querySelectorAll?.(".pack-package-title").forEach((title) => titles.add(title));
          });
        });
        titles.forEach((title) => requestAnimationFrame(() => fitPackTitle(title)));
      })
    : null;
  packTitleFitObserver?.observe(root, { childList: true, characterData: true, subtree: true });

  function setText(sel, value) {
    const el = q(sel);
    if (el) el.textContent = String(value ?? "");
  }

  function applyRarityVars(el, rarityDef, mode = "vars") {
    if (!el || !rarityDef) return;
    [el.dataset.appliedFrameClass, el.dataset.appliedAnimationClass, el.dataset.appliedViewerFrameClass]
      .filter(Boolean).forEach((name) => el.classList.remove(name));
    el.classList.remove("frame-mode-grid", "frame-mode-reveal", "frame-mode-summary", "frame-mode-viewer");
    el.style.setProperty("--rarity-color", rarityDef.color || rarityDef.borderColor || "#d7e1f2");
    el.style.setProperty("--rarity-border", rarityDef.borderColor || rarityDef.color || "#d7e1f2");
    el.style.setProperty("--rarity-glow", rarityDef.glowColor || rarityDef.color || "rgba(245,248,255,.18)");
    const glowStrength = Math.max(0, Number(rarityDef.glowStrength || 8));
    const revealDuration = Math.max(120, Number(rarityDef.revealDurationMs || 320));
    const auraStrength = Math.max(0, Math.min(1, Number(rarityDef.auraStrength || 0)));
    const pulseStrength = Math.max(0, Math.min(1, Number(rarityDef.idlePulseStrength || 0)));
    el.style.setProperty("--rarity-glow-strength", `${glowStrength}px`);
    el.style.setProperty("--reveal-duration", `${revealDuration}ms`);
    el.style.setProperty("--stage-effect-duration", `${Math.round(revealDuration * 1.35)}ms`);
    el.style.setProperty("--frame-inner", rarityDef.innerBorderColor || rarityDef.borderColor || rarityDef.color || "#d7e1f2");
    el.style.setProperty("--frame-outer", rarityDef.outerBorderColor || rarityDef.borderColor || rarityDef.color || "#d7e1f2");
    el.style.setProperty("--frame-brightness", String(1 + Math.max(0, Number(rarityDef.frameDetailLevel || 1) - 1) * .07));
    el.style.setProperty("--aura-strength", String(auraStrength));
    el.style.setProperty("--aura-blur", `${Math.round((10 + glowStrength * 1.35) * 10) / 10}px`);
    el.style.setProperty("--aura-spread", `${Math.round(auraStrength * 90) / 10}px`);
    el.style.setProperty("--aura-opacity", String(.16 + auraStrength * .72));
    el.style.setProperty("--aura-opacity-low", String(.13 + auraStrength * .62));
    el.style.setProperty("--aura-opacity-high", String(.20 + auraStrength * .78));
    el.style.setProperty("--aura-opacity-reduced", String(.12 + auraStrength * .38));
    el.style.setProperty("--aura-opacity-lite", String(.12 + auraStrength * .42));
    el.style.setProperty("--idle-pulse-strength", String(pulseStrength));
    el.style.setProperty("--pulse-scale", String(1 + pulseStrength * .022));
    el.style.setProperty("--reveal-aura-scale", String(1.03 + auraStrength * .08));
    el.style.setProperty("--idle-pulse-speed", `${Math.max(3.4, 6.4 - pulseStrength * 5)}s`);
    el.style.setProperty("--edge-shimmer-speed", `${Math.max(1.8, Number(rarityDef.edgeShimmerSpeed || 7))}s`);
    el.style.setProperty("--ray-opacity", String(Math.max(0, Math.min(1, Number(rarityDef.auraStrength || 0)))));
    el.dataset.rarityId = String(rarityDef.id || "");
    const animationClass = mode === "vars" ? "" : String(rarityDef.animationClass || "").trim();
    if (animationClass) el.classList.add(animationClass);
    el.dataset.appliedAnimationClass = animationClass;
    if (mode !== "vars") {
      const frameClass = String(rarityDef.frameClass || "frame-common").trim();
      const viewerClass = mode === "viewer" ? String(rarityDef.viewerFrameClass || frameClass).trim() : "";
      el.classList.add("vault-frame", `frame-mode-${mode}`);
      if (frameClass) el.classList.add(frameClass);
      if (viewerClass) el.classList.add(viewerClass);
      el.dataset.appliedFrameClass = frameClass;
      el.dataset.appliedViewerFrameClass = viewerClass;
      el.dataset.framePattern = String(rarityDef.framePattern || "clean-metal");
      el.dataset.cornerStyle = String(rarityDef.cornerStyle || "clean");
      el.dataset.particleStyle = String(rarityDef.particleStyle || "none");
      el.dataset.particleDensity = String(Math.max(0, Number(rarityDef.particleDensity || 0)));
      el.dataset.foilEffect = String(rarityDef.foilEffect || "none");
      el.dataset.effectContext = mode;
      el.dataset.effectDetail = String(Math.max(1, Number(rarityDef.frameDetailLevel || 1)));
    }
  }

  function rarityParticleCount(rarityDef, context) {
    const fields = { reveal: "revealParticleCount", summary: "summaryParticleCount", viewer: "viewerParticleCount" };
    const caps = { reveal: 28, summary: 22, viewer: 18 };
    const field = fields[context];
    if (!field || reducedMotion()) return 0;
    return Math.max(0, Math.min(caps[context], Math.floor(Number(rarityDef?.[field] || 0))));
  }

  function liteRarityParticleCount(fullCount, context) {
    const caps = { reveal: 14, summary: 10, viewer: 9 };
    return Math.max(0, Math.min(caps[context] || 0, Math.ceil(Number(fullCount || 0) * .5)));
  }

  function ensureRarityEffectLayer(host) {
    let layer = host.querySelector(":scope > .rarity-effect-layer");
    if (layer) return layer;
    layer = document.createElement("span");
    layer.className = "rarity-effect-layer";
    layer.setAttribute("aria-hidden", "true");
    const aura = document.createElement("span");
    aura.className = "rarity-aura";
    const rays = document.createElement("span");
    rays.className = "rarity-rays";
    const particles = document.createElement("span");
    particles.className = "rarity-particles";
    layer.append(aura, rays, particles);
    host.appendChild(layer);
    return layer;
  }

  function mountRarityEffects(host, rarityDef, context) {
    if (!host || !rarityDef || !["reveal", "summary", "viewer"].includes(context)) return null;
    const layer = ensureRarityEffectLayer(host);
    const isUltra = rarityDef.id === "ultra_mythic";
    ["rarity-ultra-aurora", "rarity-ultra-orbits", "rarity-ultra-stars"].forEach((className) => {
      let element = layer.querySelector(`:scope > .${className}`);
      if (!isUltra) { element?.remove(); return; }
      if (element) return;
      element = document.createElement("span");
      element.className = className;
      if (className === "rarity-ultra-stars") {
        const positions = [[5,8],[95,18],[98,72],[86,97],[8,96],[1,68],[42,0],[62,100]];
        positions.forEach(([x,y], index) => {
          const star = document.createElement("i");
          star.className = "rarity-ultra-star";
          star.style.setProperty("--star-x", `${x}%`);
          star.style.setProperty("--star-y", `${y}%`);
          star.style.setProperty("--star-delay", `${index * -.57}s`);
          star.style.setProperty("--star-color", ["#fff0cc", "#c9f6ff", "#ffd7ec", "#d9d0ff"][index % 4]);
          element.appendChild(star);
        });
      }
      layer.appendChild(element);
    });
    const particleHost = layer.querySelector(".rarity-particles");
    const count = rarityParticleCount(rarityDef, context);
    const liteCount = liteRarityParticleCount(count, context);
    const colors = Array.isArray(rarityDef.particleColors) && rarityDef.particleColors.length
      ? rarityDef.particleColors.map(String)
      : [String(rarityDef.outerBorderColor || rarityDef.color || "#d7e1f2")];
    const minSize = Math.max(.5, Number(rarityDef.particleMinSize || 1));
    const maxSize = Math.max(minSize, Number(rarityDef.particleMaxSize || minSize));
    const speed = Math.max(.4, Number(rarityDef.particleSpeed || 1));
    const lifetime = Math.max(700, Number(rarityDef.particleLifetime || 1600) / speed);
    const sparkFrequency = Math.max(0, Math.min(1, Number(rarityDef.sparkFrequency || 0)));
    const existing = Array.from(particleHost.children);
    while (existing.length < count) {
      const particle = document.createElement("i");
      particle.className = "rarity-particle";
      particleHost.appendChild(particle);
      existing.push(particle);
    }
    existing.forEach((particle, index) => {
      particle.hidden = index >= count;
      if (particle.hidden) return;
      const side = index % 4;
      const lane = Math.floor(index / 4);
      const lanes = Math.max(1, Math.ceil(count / 4));
      const progress = Math.round(((lane + .55) / lanes) * 1000) / 10;
      const left = side === 0 ? 0 : side === 2 ? 100 : progress;
      const top = side === 1 ? 0 : side === 3 ? 100 : progress;
      const distance = Math.round((9 + (index % 5) * 2.5) * speed);
      const dx = side === 0 ? -distance : side === 2 ? distance : Math.round(((index % 3) - 1) * 3);
      const dy = side === 1 ? -distance : side === 3 ? distance : Math.round((((index + 1) % 3) - 1) * 3);
      const size = minSize + (maxSize - minSize) * ((index % 7) / 6);
      const delay = context === "reveal" ? index * 18 : -Math.round((lifetime / Math.max(1, count)) * index);
      particle.classList.toggle("is-streak", index < Math.round(count * sparkFrequency));
      particle.classList.toggle("is-lite-hidden", index >= liteCount);
      particle.style.setProperty("--particle-left", `${left}%`);
      particle.style.setProperty("--particle-top", `${top}%`);
      particle.style.setProperty("--particle-dx", `${dx}px`);
      particle.style.setProperty("--particle-dy", `${dy}px`);
      particle.style.setProperty("--particle-dx-end", `${Math.round(dx * 1.35)}px`);
      particle.style.setProperty("--particle-dy-end", `${Math.round(dy * 1.35)}px`);
      particle.style.setProperty("--particle-size", `${Math.round(size * 10) / 10}px`);
      particle.style.setProperty("--particle-offset", `${Math.round(size * -5) / 10}px`);
      particle.style.setProperty("--particle-glow", `${Math.round(size * 25) / 10}px`);
      particle.style.setProperty("--particle-streak-height", `${Math.max(.7, Math.round(size * 4.2) / 10)}px`);
      particle.style.setProperty("--particle-color", colors[index % colors.length]);
      particle.style.setProperty("--particle-lifetime", `${Math.round(lifetime)}ms`);
      particle.style.setProperty("--particle-delay", `${delay}ms`);
    });
    const rayCount = Math.max(0, Math.min(16, Math.floor(Number(rarityDef.rayCount || 0))));
    layer.style.setProperty("--ray-step", `${rayCount ? 360 / rayCount : 360}deg`);
    layer.style.setProperty("--ray-width", `${Math.max(.8, Math.min(2.4, Number(rarityDef.sparkFrequency || 0) * 3))}deg`);
    layer.dataset.effectContext = context;
    layer.dataset.rarityId = String(rarityDef.id || "");
    layer.dataset.particleCount = String(count);
    layer.dataset.liteParticleCount = String(liteCount);
    layer.dataset.rayCount = String(rayCount);
    layer.classList.toggle("has-rays", rayCount > 0);
    layer.classList.toggle("is-effects-visible", context === "reveal" || !rarityEffectsObserver);
    if (context !== "reveal" && rarityEffectsObserver) rarityEffectsObserver.observe(layer);
    return layer;
  }

  function applyPackVars(el, pack) {
    if (!el || !pack) return;
    const visual = pack.visual || {};
    el.style.setProperty("--pack-border", visual.borderColor || "#d7e1f2");
    el.style.setProperty("--pack-glow", visual.glowColor || "rgba(245,248,255,.18)");
    const bg = String(visual.backgroundImage || "").trim();
    el.style.setProperty("--pack-bg-image", bg ? `url("${escapeUrl(bg)}")` : "linear-gradient(transparent, transparent)");
    const sequence = visual.openingSequence || {};
    const duration = reducedMotion() ? 120 : liteEffects()
      ? Math.max(220, Number(sequence.liteDurationMs || 420))
      : Math.max(650, Number(sequence.introDurationMs || 1200));
    el.style.setProperty("--pack-intro-ms", `${duration}ms`);
    el.style.setProperty("--pack-shake", `${Math.max(0, Number(sequence.shakePx || 3))}px`);
    el.style.setProperty("--pack-burst-scale", String(Math.max(1, Number(sequence.burstScale || 1.06))));
    el.style.setProperty("--pack-flash-strength", String(Math.max(0, Math.min(1, Number(sequence.flashStrength || .4)))));
    el.dataset.packAnimation = String(visual.openingAnimation || "");
    el.dataset.packPattern = visual.pattern || "";
    el.dataset.packFinish = visual.finish || "";
    el.dataset.packParticles = visual.particleStyle || "";
  }

  function packIntroDuration(pack) {
    const sequence = pack?.visual?.openingSequence || {};
    if (reducedMotion()) return 120;
    if (liteEffects()) return Math.max(220, Number(sequence.liteDurationMs || 420));
    return Math.max(650, Number(sequence.introDurationMs || 1200));
  }

  function emitPresentationCue(pack, hook, details = {}) {
    const fallback = { packOpen: "pack_open", cardFlip: "card_flip", specialReveal: "legendary_reveal", summary: "summary" };
    const cue = String(pack?.effects?.hooks?.[hook] || fallback[hook] || hook || "");
    if (!cue) return;
    root.dispatchEvent(new CustomEvent("cardvault:presentation-cue", {
      bubbles: true,
      detail: { cue, hook, packId: pack?.id || "", ...details }
    }));
  }

  function cardIsNew(cardId) {
    const row = state?.owned?.[cardId];
    return !!row && row.seenInCollection !== true;
  }

  function artworkSource(cardOrUrl) {
    const raw = typeof cardOrUrl === "string" ? cardOrUrl : cardOrUrl?.image;
    return String(raw || "").trim();
  }

  function canonicalViewerArtwork(card) {
    const metadataSource = artworkSource(card);
    const displayedSource = q("[data-viewer-image] .vault-artwork")?.getAttribute("src") || "";
    return window.Game?.wallpaper?.canonicalize?.(displayedSource)
      || window.Game?.wallpaper?.canonicalize?.(metadataSource)
      || "";
  }

  function mountArtwork(host, card, mode = "card") {
    if (!host) return null;
    const source = artworkSource(card);
    const pendingArtwork = card?.imagePending === true && secretCodeCard(card);
    host.classList.add("artwork-host");
    host.dataset.artworkMode = mode;
    host.dataset.artworkSource = source;
    host.querySelectorAll(":scope > .vault-artwork").forEach((node) => node.remove());
    host.querySelectorAll(":scope > .pending-artwork").forEach((node) => node.remove());
    host.classList.remove("is-artwork-coming-soon");
    const img = document.createElement("img");
    img.className = "vault-artwork";
    img.alt = sourceText(card?.title || card?.id || ui("cardvault.card", "Card"));
    img.decoding = "async";
    img.loading = "eager";
    img.draggable = false;
    img.dataset.artworkState = "loading";
    img.dataset.loadEvent = "0";
    img.dataset.errorEvent = "0";
    img.dataset.decodeState = typeof img.decode === "function" ? "pending" : "unsupported";
    img.dataset.sourceKind = "full-resolution";
    host.dataset.fullResolution = "true";
    const markLoaded = () => {
      if (!img.isConnected || img.naturalWidth <= 0 || img.naturalHeight <= 0) return;
      img.dataset.artworkState = "loaded";
      img.dataset.naturalWidth = String(img.naturalWidth);
      img.dataset.naturalHeight = String(img.naturalHeight);
      img.dataset.currentSource = img.currentSrc || source;
      host.dataset.artworkState = "loaded";
      host.dataset.currentSource = img.currentSrc || source;
      if (mode === "viewer") {
        host.style.setProperty("--artwork-ratio", `${img.naturalWidth} / ${img.naturalHeight}`);
        host.style.setProperty("--artwork-aspect", String(img.naturalWidth / img.naturalHeight));
      }
      if (pendingArtwork) {
        card.imagePending = false;
        host.classList.remove("is-artwork-coming-soon");
        host.querySelector(":scope > .pending-artwork")?.remove();
        if (mode === "viewer") {
          const wallpaper = q("[data-viewer-wallpaper]");
          if (wallpaper) wallpaper.disabled = !owned(card) || !canonicalViewerArtwork(card);
        }
      }
      host.classList.remove("has-image-placeholder");
      imageCache.add(source);
      requestAnimationFrame(() => {
        const rect = img.getBoundingClientRect();
        img.dataset.displayedWidth = String(Math.round(rect.width * 100) / 100);
        img.dataset.displayedHeight = String(Math.round(rect.height * 100) / 100);
      });
    };
    img.addEventListener("load", () => {
      img.dataset.loadEvent = "1";
      markLoaded();
    }, { once: true });
    img.addEventListener("error", () => {
      img.dataset.errorEvent = "1";
      if (pendingArtwork) {
        img.dataset.artworkState = "pending";
        host.dataset.artworkState = "pending";
        failedImages.add(source);
        img.removeAttribute("src");
        return;
      }
      img.dataset.artworkState = "error";
      host.dataset.artworkState = "error";
      failedImages.add(source);
      showImagePlaceholder(host);
    }, { once: true });
    host.appendChild(img);
    if (pendingArtwork) {
      img.dataset.artworkState = "pending";
      img.dataset.decodeState = "pending_artwork";
      host.dataset.artworkState = "pending";
      host.classList.add("is-artwork-coming-soon");
      const placeholder = document.createElement("span");
      placeholder.className = "pending-artwork";
      const emblem = document.createElement("span");
      emblem.className = "pending-artwork-emblem";
      emblem.setAttribute("aria-hidden", "true");
      const label = document.createElement("span");
      label.textContent = ui("cardvault.artwork_coming_soon", "Artwork coming soon");
      placeholder.append(emblem, label);
      host.appendChild(placeholder);
      if (failedImages.has(source)) return img;
    }
    if (!source) {
      img.dataset.errorEvent = "1";
      img.dataset.artworkState = "error";
      host.dataset.artworkState = "error";
      showImagePlaceholder(host);
      return img;
    }
    img.src = source;
    if (typeof img.decode === "function") {
      const decodeFallback = setTimeout(() => {
        if (img.dataset.decodeState !== "pending") return;
        img.dataset.decodeState = img.complete && img.naturalWidth > 0 ? "loaded_without_decode" : "decode_timeout";
        markLoaded();
      }, 250);
      img.decode().then(() => {
        clearTimeout(decodeFallback);
        img.dataset.decodeState = "decoded";
        markLoaded();
      }).catch(() => {
        clearTimeout(decodeFallback);
        img.dataset.decodeState = img.complete && img.naturalWidth > 0 ? "loaded_without_decode" : "decode_error";
        markLoaded();
      });
    }
    if (img.complete) queueMicrotask(markLoaded);
    return img;
  }

  function showImagePlaceholder(node) {
    if (!node) return;
    node.style.backgroundImage = "linear-gradient(145deg, #283246, #111827)";
    node.classList.add("has-image-placeholder");
    node.setAttribute("aria-label", ui("cardvault.image_unavailable", "Image unavailable"));
  }

  function setCardBackground(node, url) {
    const source = artworkSource(url);
    if (!node || !source || failedImages.has(source)) {
      showImagePlaceholder(node);
      return;
    }
    if (imageCache.has(source)) {
      node.style.backgroundImage = `url("${escapeUrl(source)}")`;
      node.classList.remove("has-image-placeholder");
      return;
    }
    const probe = new Image();
    probe.onload = () => {
      imageCache.add(source);
      node.style.backgroundImage = `url("${escapeUrl(source)}")`;
      node.classList.remove("has-image-placeholder");
    };
    probe.onerror = () => {
      failedImages.add(source);
      showImagePlaceholder(node);
    };
    probe.src = source;
  }

  function loadLazyImage(node) {
    const url = node?.dataset?.src || "";
    if (!node || !url) return;
    const card = config?.cardById?.[node.dataset.lazyCardId] || {
      id: node.dataset.lazyCardId || "",
      title: node.dataset.lazyCardTitle || "",
      image: url
    };
    mountArtwork(node, card, "collection");
    node.classList.remove("is-pending");
    imageCache.add(url);
    delete node.dataset.src;
    delete node.dataset.lazyCardId;
    delete node.dataset.lazyCardTitle;
  }

  function setLazyBackground(node, cardOrUrl) {
    const url = artworkSource(cardOrUrl);
    if (!node || !url) return;
    node.dataset.src = url;
    if (cardOrUrl && typeof cardOrUrl === "object") {
      node.dataset.lazyCardId = String(cardOrUrl.id || "");
      node.dataset.lazyCardTitle = sourceText(cardOrUrl.title || cardOrUrl.id || "");
    }
    if (imageCache.has(url) || !lazyImages) {
      loadLazyImage(node);
      return;
    }
    node.classList.add("is-pending");
    lazyImages.observe(node);
  }

  function rarityClass(def) {
    return `is-reveal-${String(def?.id || "").replace(/[^\w-]/g, "")}`;
  }

  function revealClass(def) {
    const animation = String(def?.revealAnimation || def?.revealClass || "").trim().replace(/[^\w-]/g, "_");
    return animation ? `reveal_${animation}` : "";
  }

  function oddsRows(pack) {
    const table = config?.dropTableById?.[pack?.dropTableId] || null;
    const total = (table?.entries || []).reduce((sum, entry) => sum + Number(entry.weight || 0), 0);
    if (!table || total <= 0) return [];
    return (table.entries || []).map((entry) => {
      const pct = Math.round((Number(entry.weight || 0) / total) * 1000) / 10;
      return {
        label: rarityName(entry.rarity),
        value: `${Number.isInteger(pct) ? pct.toFixed(0) : pct}%`
      };
    });
  }

  function revealSummaryStage() {
    const count = Math.max(1, (reveal.result?.pulls || []).length);
    return count + 1;
  }

  function normalizeStage(raw) {
    return Math.max(0, Math.min(revealSummaryStage(), Number(raw || 0)));
  }
  function codeRewardReveal() { return reveal.result?.cardReward === true || reveal.result?.pack?.presentationType === "code_reward" || reveal.result?.pendingReveal?.presentationType === "code_reward"; }

  async function resumePendingReveal() {
    const pending = await window.CardVaultSystem.getPendingReveal();
    if (!sceneActive || !pending.ok) return false;
    if (!q("[data-tutorial-overlay]")?.hidden) closeTutorial();
    state = pending.state || window.CardVaultSystem.readState();
    reveal.result = pending;
    reveal.stage = normalizeStage(pending.pendingReveal?.revealIndex || 0);
    resetRevealInputState();
    renderRevealOverlay();
    armRevealFallback();
    emitRevealStageCue(reveal.stage);
    return true;
  }

  function refreshShell() {
    state = window.CardVaultSystem.readState();
    const progress = window.CardVaultSystem.computeProgress(state, config);
    setText("[data-vault-points]", fmt(state.points));
    setText("[data-vault-dust]", fmt(state.dust));
    setText("[data-vault-completion]", `${progress.percent}%`);
  }

  function specialFeedbackText(status) {
    if (status === "invalid_code") return ui("cardvault.invalid_code", "Invalid code.");
    if (status === "already_claimed") return ui("cardvault.already_claimed", "Already claimed.");
    if (status === "success") return specialGrantedCard ? ui("cardvault.secret_card_unlocked", "Secret card unlocked.") : ui("cardvault.points_added_announcement", "{amount} Collection Points added").replace("{amount}", fmt(specialGrantedAmount));
    if (status === "pending_reveal") return ui("cardvault.collect_pending_first", "Collect your current reward before redeeming this code.");
    if (status === "processing") return ui("cardvault.processing", "Processing...");
    if (status === "failed") return ui("cardvault.claim_failed", "Claim failed.");
    return ui("cardvault.code_ready", "Ready to redeem.");
  }

  function renderSpecialBonus() {
    const hasSpecialRewards = (config?.rewards || []).some(reward => reward.rewardType === "special_bonus" && reward.active !== false);
    const panel = q("[data-special-code-panel]");
    if (!panel) return;
    panel.hidden = !hasSpecialRewards;
    if (!hasSpecialRewards) return;
    const status = specialRedeeming ? "processing" : specialFeedback;
    panel.dataset.specialCodeState = status;
    setText("[data-special-code-balance]", fmt(state?.points || 0));
    setText("[data-special-code-message]", specialFeedbackText(status));
    const input = q("[data-special-code-input]");
    const button = q("[data-special-code-redeem]");
    if (input) input.disabled = specialRedeeming;
    if (button) {
      button.disabled = specialRedeeming;
      button.textContent = specialRedeeming
        ? ui("cardvault.processing", "Processing...")
        : ui("cardvault.redeem", "Redeem");
    }
  }

  function closeBonusCelebration() {
    if (bonusTimer) clearTimeout(bonusTimer);
    bonusTimer = 0;
    const overlay = q("[data-bonus-overlay]");
    if (overlay) overlay.hidden = true;
    root.removeAttribute("data-bonus-celebration-active");
    refreshAll();
  }

  function showBonusCelebration(previousPoints, nextPoints) {
    const overlay = q("[data-bonus-overlay]");
    const pointsNode = q("[data-vault-points]");
    if (!overlay) return refreshAll();
    setText("[data-bonus-amount]", `+${fmt(nextPoints - previousPoints)}`);
    overlay.hidden = false;
    root.setAttribute("data-bonus-celebration-active", "1");
    if (pointsNode) pointsNode.textContent = fmt(previousPoints);
    const started = performance.now();
    const animationMs = reducedMotion() || liteEffects() ? 520 : 950;
    const frame = (now) => {
      if (overlay.hidden) return;
      const progress = Math.min(1, Math.max(0, (now - started) / animationMs));
      const eased = 1 - Math.pow(1 - progress, 3);
      if (pointsNode) pointsNode.textContent = fmt(previousPoints + ((nextPoints - previousPoints) * eased));
      if (progress < 1) requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    bonusTimer = setTimeout(closeBonusCelebration, reducedMotion() || liteEffects() ? 1800 : 2100);
  }

  async function redeemSpecialBonus() {
    if (specialRedeeming) return;
    const input = q("[data-special-code-input]");
    if (!config || !input) return;
    specialRedeeming = true;
    specialFeedback = "processing";
    renderSpecialBonus();
    const result = await window.CardVaultSystem.redeemCode(input.value, { source: "card_vault_special_bonus" });
    if (!sceneActive) return;
    specialRedeeming = false;
    if (!result.ok) {
      specialFeedback = ["invalid_code", "already_claimed", "processing", "pending_reveal"].includes(result.reason)
        ? result.reason
        : "failed";
      state = window.CardVaultSystem.readState();
      renderSpecialBonus();
      return;
    }
    input.value = "";
    state = result.state;
    specialGrantedAmount = Number(result.amount || result.cardVaultPoints || 0);
    specialGrantedCard = result.cardReward === true || (result.cardIds || []).length > 0;
    specialFeedback = "success";
    renderSpecialBonus();
    if (specialGrantedCard) await resumePendingReveal();
  }

  function renderPack() {
    const host = q("[data-pack-list]");
    if (!host) return;
    const packs = (config.packs || []).filter((row) => row.enabled);
    if (!packs.length) {
      host.textContent = ui("cardvault.no_packs", "No packs available.");
      return;
    }
    host.innerHTML = "";
    packs.forEach((pack) => {
      const canOpen = state.points >= pack.cost && !opening && !state.pendingReveal;
      const node = document.createElement("article");
      node.className = "pack-card";
      node.setAttribute("data-pack-id", pack.id);
      applyPackVars(node, pack);
      const badge = pack.guaranteeKey || (Array.isArray(pack.guarantees) && pack.guarantees.length ? "cardvault.legendary_guaranteed" : "");
      node.innerHTML = `
        <div class="pack-art"></div>
        <div class="pack-name"></div>
        <div class="pack-desc"></div>
        <div class="pack-meta-row">
          <div class="vault-pill"><span></span> <b></b></div>
          <div class="vault-pill"><span></span> <b></b></div>
        </div>
        <div class="pack-odds" data-pack-odds></div>
        <div class="pack-badge" data-pack-badge hidden></div>
        <button class="vault-btn" type="button"></button>
        <div class="vault-message" data-pack-message></div>
      `;
      const art = node.querySelector(".pack-art");
      const artSrc = String(pack.artwork || pack.visual?.backgroundImage || "").trim();
      if (artSrc) {
        art.classList.add("has-pack-artwork");
        const image = document.createElement("img");
        image.className = "pack-art-img";
        image.src = artSrc;
        image.alt = ui(`cardvault.pack.${pack.id.replace("_pack", "")}.art_alt`, `${packText(pack, "name", pack.id)} iNTeRcepted Card Vault booster pack`);
        image.loading = "lazy";
        image.decoding = "async";
        image.width = 1254;
        image.height = 1254;
        art.appendChild(image);
      }
      node.querySelector(".pack-name").textContent = packText(pack, "name", pack.id);
      node.querySelector(".pack-desc").textContent = packText(pack, "description", "");
      const pills = node.querySelectorAll(".vault-pill");
      pills[0].querySelector("span").textContent = ui("cardvault.cost", "Cost");
      pills[0].querySelector("b").textContent = fmt(pack.cost);
      pills[1].querySelector("span").textContent = ui("cardvault.cards", "Cards");
      pills[1].querySelector("b").textContent = fmt(pack.cardCount || 3);
      const odds = node.querySelector("[data-pack-odds]");
      oddsRows(pack).forEach((row) => {
        const line = document.createElement("div");
        line.className = "pack-odds-row";
        line.innerHTML = `<span></span><b></b>`;
        line.querySelector("span").textContent = row.label;
        line.querySelector("b").textContent = row.value;
        odds.appendChild(line);
      });
      if (Array.isArray(pack.guarantees) && pack.guarantees.length) {
        const line = document.createElement("div");
        line.className = "pack-odds-row pack-odds-guarantee";
        line.innerHTML = `<span></span><b></b>`;
        line.querySelector("span").textContent = ui("cardvault.guarantee", "Guarantee");
        line.querySelector("b").textContent = ui("cardvault.legendary_guaranteed", "Guaranteed Legendary");
        odds.appendChild(line);
      }
      const badgeEl = node.querySelector("[data-pack-badge]");
      if (badge) {
        badgeEl.hidden = false;
        badgeEl.textContent = ui(badge, sourceText(pack.guaranteeLabel || ""));
      }
      const btn = node.querySelector("button");
      btn.setAttribute("data-pack-open", pack.id);
      btn.disabled = !canOpen;
      btn.textContent = canOpen ? ui("cardvault.open_pack", "Open Pack") : ui("cardvault.not_enough_points", "Not enough Collection Points");
      node.querySelector("[data-pack-message]").textContent = canOpen ? "" : ui("cardvault.not_enough_points", "Not enough Collection Points");
      btn.addEventListener("click", () => startPackOpening(pack.id));
      host.appendChild(node);
    });
  }

  function cardFace(pull) {
    const card = pull.card;
    const r = pull.rarity || rarity(card);
    const special = r.specialReveal === true || String(r.revealClass || "").trim();
    const node = document.createElement("div");
    node.className = "vault-card";
    node.innerHTML = `
      <div class="vault-card-inner">
        <div class="vault-card-back">${ui("cardvault.card", "Card")}</div>
        <div class="vault-card-front${special ? " is-special" : ""}">
          <div class="vault-card-img"></div>
          <div class="vault-card-info">
            <div class="vault-card-title"></div>
            <div class="vault-card-meta"></div>
            <div class="vault-card-dupe" hidden></div>
          </div>
        </div>
      </div>
    `;
    applyRarityVars(node.querySelector(".vault-card-front"), r, "reveal");
    mountArtwork(node.querySelector(".vault-card-img"), card, "reveal-preview");
    node.querySelector(".vault-card-title").textContent = sourceText(card.title || card.id);
    node.querySelector(".vault-card-meta").textContent = `${characterName(card)} - ${sourceText(r.name || r.id || "")}`;
    const dupe = node.querySelector(".vault-card-dupe");
    if (pull.duplicate) {
      renderDuplicateStatus(dupe, pull, false);
    }
    return node;
  }

  function renderDuplicateStatus(node, pull, animate = false) {
    if (!node || !pull?.duplicate) return;
    node.hidden = false;
    node.classList.add("is-duplicate");
    node.textContent = "";
    node.append(document.createTextNode(`${ui("cardvault.duplicate_dust", "Duplicate")} +`));
    const count = document.createElement("span");
    count.className = "dust-count";
    count.dataset.dustTarget = fmt(pull.dust);
    count.textContent = animate && !reducedMotion() ? "0" : fmt(pull.dust);
    node.append(count, document.createTextNode(` ${ui("cardvault.dust", "Dust")}`));
  }

  function animateDustCounters(scope) {
    const counters = Array.from(scope?.querySelectorAll?.("[data-dust-target]") || []);
    if (!counters.length) return;
    const duration = liteEffects() ? 260 : 520;
    counters.forEach((counter, index) => {
      const target = Math.max(0, Number(counter.dataset.dustTarget || 0));
      if (reducedMotion() || target <= 0) {
        counter.textContent = fmt(target);
        return;
      }
      const startAt = performance.now() + index * 70;
      const step = (now) => {
        if (!counter.isConnected) return;
        const progress = Math.max(0, Math.min(1, (now - startAt) / duration));
        counter.textContent = fmt(Math.round(target * (1 - Math.pow(1 - progress, 3))));
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  function clearRevealTimer() {
    if (reveal.timer) clearTimeout(reveal.timer);
    reveal.timer = 0;
  }

  function clearPackIntroTimer() {
    if (reveal.introTimer) clearTimeout(reveal.introTimer);
    reveal.introTimer = 0;
  }

  function clearRevealUnlockTimer() {
    if (reveal.unlockTimer) clearTimeout(reveal.unlockTimer);
    reveal.unlockTimer = 0;
  }

  function resetRevealInputState() {
    clearRevealUnlockTimer();
    clearRevealCueTimers();
    reveal.locked = false;
    reveal.queuedAdvances = 0;
  }

  function armRevealFallback() {
    clearRevealTimer();
    reveal.timer = setTimeout(() => {
      if (!reveal.result || q("[data-pack-overlay]")?.hidden) return;
      clearPackIntroTimer();
      resetRevealInputState();
      reveal.stage = revealSummaryStage();
      window.CardVaultSystem.updatePendingReveal({ id: reveal.result.pendingReveal?.id, revealIndex: reveal.stage, status: "summary" });
      renderRevealOverlay();
      emitRevealStageCue(reveal.stage);
    }, 90000);
  }

  function revealCardNode(pull, compact = false, summaryIndex = 0) {
    const card = pull.card || {};
    const r = pull.rarity || rarity(card);
    const node = document.createElement("article");
    node.className = compact ? "pack-summary-card" : "pack-flow-card";
    if (compact) node.style.setProperty("--summary-index", String(summaryIndex));
    if (compact) {
      node.tabIndex = 0;
      node.setAttribute("role", "button");
      node.setAttribute("aria-label", ui("cardvault.tutorial.inspect_card", "Inspect card"));
      const inspect = () => openViewer(card.id, { cards: (reveal.result?.pulls || []).map((row) => row.card).filter(Boolean), index: summaryIndex, fromReveal: true });
      node.addEventListener("click", (event) => { event.stopPropagation(); inspect(); });
      node.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); event.stopPropagation(); inspect(); } });
    }
    node.classList.add(revealClass(r));
    applyRarityVars(node, r, compact ? "summary" : "reveal");
    node.innerHTML = compact ? `
      <div class="pack-summary-img"></div>
      <div class="pack-summary-copy">
        <div class="vault-card-title"></div>
        <div class="vault-card-meta"></div>
        <div class="vault-card-dupe" hidden></div>
      </div>
    ` : `
      <div class="pack-flow-img"></div>
      <div class="pack-flow-copy">
        <div class="pack-flow-title"></div>
        <div class="pack-flow-meta"></div>
        <div class="vault-card-dupe" hidden></div>
      </div>
    `;
    const img = node.querySelector(compact ? ".pack-summary-img" : ".pack-flow-img");
    mountArtwork(img, card, compact ? "summary" : "reveal");
    mountRarityEffects(node, r, compact ? "summary" : "reveal");
    const title = node.querySelector(compact ? ".vault-card-title" : ".pack-flow-title");
    title.textContent = sourceText(card.title || card.id);
    node.querySelector(compact ? ".vault-card-meta" : ".pack-flow-meta").textContent = `${characterName(card)} - ${sourceText(r.name || r.id || "")}`;
    const dupe = node.querySelector(".vault-card-dupe");
    if (pull.duplicate) {
      renderDuplicateStatus(dupe, pull, compact);
    }
    if (!pull.duplicate && (pull.isNew || cardIsNew(card.id))) {
      if (compact) node.classList.add("is-new");
      const badge = document.createElement("span");
      badge.className = "new-badge is-celebrating";
      badge.textContent = ui("cardvault.new", "NEW");
      node.appendChild(badge);
    }
    return node;
  }

  function revealRecoveryActions({ includeSkip = true } = {}) {
    const actions = document.createElement("div");
    actions.className = "pack-actions pack-recovery-actions";
    if (includeSkip) {
      const skip = document.createElement("button");
      skip.className = "vault-btn";
      skip.type = "button";
      skip.textContent = ui("cardvault.skip_to_results", "Skip to Results");
      skip.addEventListener("click", () => {
        clearPackIntroTimer();
        resetRevealInputState();
        reveal.stage = revealSummaryStage();
        window.CardVaultSystem.updatePendingReveal({ id: reveal.result?.pendingReveal?.id, revealIndex: reveal.stage, status: "summary" });
        renderRevealOverlay();
        emitRevealCompletionCue({ grouped: true });
      });
      actions.appendChild(skip);
    }
    const close = document.createElement("button");
    close.className = "vault-btn";
    close.type = "button";
    close.textContent = ui("cardvault.collect_continue", "Collect / Continue");
    close.addEventListener("click", closeRevealCollected);
    actions.appendChild(close);
    return actions;
  }

  function appendPackOpeningEffects(pkg, pack) {
    const tear = document.createElement("span");
    tear.className = "pack-tear";
    const burst = document.createElement("span");
    burst.className = "pack-burst";
    pkg.append(tear, burst);
    // Duplicate only the sealed top of the existing artwork, so its seam can
    // lift independently while the wrapper drops away from the card stack.
    const artwork = pkg.querySelector(".pack-package-art");
    if (artwork) {
      const cap = document.createElement("span");
      cap.className = "pack-wrapper-top";
      cap.setAttribute("aria-hidden", "true");
      const capImage = artwork.cloneNode(false);
      capImage.removeAttribute("class");
      cap.appendChild(capImage);
      const cards = document.createElement("span");
      cards.className = "pack-sealed-cards";
      cards.setAttribute("aria-hidden", "true");
      for (let index = 0; index < Math.min(3, Number(pack.cardCount || 3)); index += 1) {
        const back = document.createElement("i");
        back.className = "tcg-card-back";
        back.style.setProperty("--stack-angle", ((index - 1) * 7) + "deg");
        cards.appendChild(back);
      }
      pkg.prepend(cards);
      pkg.appendChild(cap);
    }
    const configured = Math.max(0, Math.min(18, Number(pack?.visual?.openingSequence?.particleCount || 0)));
    const count = reducedMotion() ? 0 : liteEffects() ? Math.min(4, configured) : configured;
    if (!count) return;
    const particles = document.createElement("span");
    particles.className = "pack-particles";
    for (let index = 0; index < count; index += 1) {
      const particle = document.createElement("i");
      particle.className = "pack-particle";
      const angle = ((Math.PI * 2) / count) * index - Math.PI / 2;
      const distance = 92 + (index % 4) * 18;
      particle.style.setProperty("--particle-x", `${Math.round(Math.cos(angle) * distance)}px`);
      particle.style.setProperty("--particle-y", `${Math.round(Math.sin(angle) * distance)}px`);
      particle.style.setProperty("--particle-size", `${3 + (index % 3)}px`);
      particle.style.setProperty("--particle-delay", `${(index % 4) * 12}ms`);
      particles.appendChild(particle);
    }
    pkg.appendChild(particles);
  }

  function emitRevealStageCue(stage) {
    const pack = reveal.result?.pack || {};
    const pulls = reveal.result?.pulls || [];
    if (stage >= revealSummaryStage()) {
      emitRevealCompletionCue({ grouped: false });
      emitPresentationCue(pack, "summary", { stage });
      return;
    }
    if (stage <= 0 || stage > pulls.length) return;
    const pull = pulls[stage - 1] || {};
    const rarityId = String(pull.rarity?.id || pull.card?.rarity || "");
    const cardCueId = `card_draw_${stage}_${String(pull.card?.id || "")}`;
    playPendingRevealSoundOnce(cardCueId, "cardVaultCardDraw");
    const visibleDelay = visibleRevealDelayMs(rarityId);
    const accentSoundId = resolveRarityRevealAccentSound(rarityId);
    if (accentSoundId) {
      scheduleVisibleRevealSoundOnce(`rarity_accent_${stage}_${String(pull.card?.id || "")}`, accentSoundId, stage, visibleDelay);
    }
    if (pull.isNew === true) {
      scheduleVisibleRevealSoundOnce(`new_card_${stage}_${String(pull.card?.id || "")}`, "cardVaultNewCard", stage, visibleDelay + (accentSoundId ? 170 : 110));
    }
    emitPresentationCue(pack, "cardFlip", { stage, cardId: pull.card?.id || "", rarity: rarityId });
    if (["legendary", "mythic", "ultra_mythic"].includes(rarityId)) {
      emitPresentationCue(pack, "specialReveal", { stage, cardId: pull.card?.id || "", rarity: rarityId });
    }
  }

  function emitRevealCompletionCue({ grouped = false } = {}) {
    const pulls = reveal.result?.pulls || [];
