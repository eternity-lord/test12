    playPendingRevealSoundOnce("open_all", "cardVaultOpenAll");
    if (grouped && pulls.some((pull) => pull.isNew === true)) {
      playPendingRevealSoundOnce("new_card_grouped", "cardVaultNewCard", { delayMs: 90 });
    }
  }

  function armPackOpening(pkg, pack) {
    clearPackIntroTimer();
    emitPresentationCue(pack, "packOpen", { stage: 0, animation: pack?.visual?.openingAnimation || "" });
    requestAnimationFrame(() => {
      if (pkg.isConnected) pkg.classList.add("is-opening");
    });
    reveal.introTimer = setTimeout(() => {
      reveal.introTimer = 0;
      if (reveal.result && reveal.stage <= 0 && !q("[data-pack-overlay]")?.hidden) advanceReveal();
    }, packIntroDuration(pack) + 35);
  }

  function revealHeading(pack, count) {
    const heading = document.createElement("div");
    heading.className = "tcg-reveal-heading";
    const textScale = Math.max(1, Math.min(1.25, Number(window.Game?.settings?.textSizePx || 18) / 16));
    heading.dataset.baseFont = "12";
    heading.style.fontSize = (12 * textScale) + "px";
    const title = document.createElement("span");
    title.className = "tcg-reveal-title";
    // The global text-size observer may run before linked styles finish loading.
    // Seed the intended base so it scales the actual label, not an inherited size.
    title.dataset.baseFont = "12";
    title.style.fontSize = (12 * textScale) + "px";
    title.textContent = packText(pack, "name", ui("cardvault.pack", "Pack"));
    const progress = document.createElement("div");
    progress.className = "tcg-reveal-progress";
    progress.dataset.baseFont = "12";
    progress.style.fontSize = (12 * textScale) + "px";
    for (let index = 0; index < count; index += 1) {
      const pip = document.createElement("i");
      pip.className = "tcg-reveal-pip" + (reveal.stage > index ? " is-done" : "");
      pip.setAttribute("aria-hidden", "true");
      progress.appendChild(pip);
    }
    const number = document.createElement("span");
    number.className = "tcg-reveal-count";
    number.dataset.baseFont = "11";
    number.style.fontSize = (11 * textScale) + "px";
    number.textContent = Math.min(count, reveal.stage) + " / " + count;
    progress.appendChild(number);
    heading.append(title, progress);
    return heading;
  }

  function renderRevealOverlay() {
    const overlay = q("[data-pack-overlay]");
    const flow = q("[data-pack-flow]");
    if (!overlay || !flow || !reveal.result) return;
    const pulls = reveal.result.pulls || [];
    const pack = reveal.result.pack || {};
    const summaryStage = revealSummaryStage();
    overlay.hidden = false;
    overlay.setAttribute("aria-label", ui("cardvault.reveal_tap_anywhere", "Tap anywhere to continue"));
    overlay.className = "pack-overlay";
    overlay.removeAttribute("data-rarity-id");
    overlay.removeAttribute("data-reveal-darken");
    overlay.removeAttribute("data-reveal-effect-detail");
    flow.innerHTML = "";
    flow.classList.remove("is-summary");
    applyPackVars(flow, pack);
    flow.appendChild(revealHeading(pack, pulls.length));

    if (reveal.stage <= 0) {
      const pkg = document.createElement("div");
      pkg.className = "pack-package";
      applyPackVars(pkg, pack);
      const artwork = String(pack.artwork || pack.visual?.backgroundImage || "").trim();
      pkg.innerHTML = `<div class="pack-package-title"></div>`;
      if (artwork) {
        pkg.classList.add("has-pack-artwork");
        const image = document.createElement("img");
        image.className = "pack-package-art";
        image.src = artwork;
        image.alt = "";
        image.decoding = "async";
        image.width = 1254;
        image.height = 1254;
        pkg.prepend(image);
      }
      appendPackOpeningEffects(pkg, pack);
      pkg.querySelector(".pack-package-title").textContent = packText(pack, "name", ui("cardvault.pack", "Pack"));
      const prompt = document.createElement("div");
      prompt.className = "pack-prompt";
      prompt.textContent = ui("cardvault.opening", "Opening...");
      flow.append(pkg, prompt, revealRecoveryActions({ includeSkip: true }));
      if (!artwork) fitPackTitle(pkg.querySelector(".pack-package-title"));
      armPackOpening(pkg, pack);
      setTimeout(() => overlay.focus(), 0);
      return;
    }

    if (reveal.stage >= summaryStage) {
      flow.classList.add("is-summary");
      const summaryScroll = document.createElement("div");
      summaryScroll.className = "pack-summary-scroll";
      summaryScroll.setAttribute("data-reveal-summary-stage", "true");
      const grid = document.createElement("div");
      grid.className = "pack-summary-grid" + (codeRewardReveal() ? " is-code-reward" : "");
      pulls.forEach((pull, index) => grid.appendChild(revealCardNode(pull, true, index)));
      const actions = document.createElement("div");
      actions.className = "pack-actions pack-summary-actions";
      actions.setAttribute("data-reveal-actions", "true");
      const collect = document.createElement("button");
      collect.className = "vault-btn";
      collect.type = "button";
      collect.setAttribute("data-reveal-action", "continue");
      collect.textContent = ui("cardvault.continue", "Continue");
      collect.addEventListener("click", closeRevealCollected);
      const again = document.createElement("button");
      again.className = "vault-btn";
      again.type = "button";
      again.setAttribute("data-reveal-action", "open-another");
      again.textContent = ui("cardvault.open_another_pack", "Open Another Pack");
      const canOpenAgain = !codeRewardReveal() && pack.enabled !== false && state.points >= Number(pack.cost || 0);
      again.disabled = !canOpenAgain;
      again.hidden = !canOpenAgain;
      const message = document.createElement("div");
      message.className = "pack-action-message";
      message.setAttribute("data-reveal-unaffordable-message", "true");
      message.hidden = codeRewardReveal() || canOpenAgain;
      message.textContent = ui("cardvault.not_enough_points", "Not enough Collection Points");
      again.addEventListener("click", async () => {
        if (revealClosing || opening) return;
        const fresh = window.CardVaultSystem.readState();
        if (fresh.points < Number(pack.cost || 0)) {
          message.hidden = false;
          again.hidden = true;
          again.disabled = true;
          refreshShell();
          return;
        }
        const nextPackId = pack.id;
        const closed = await closeRevealCollected({ refresh: false });
        if (closed) startPackOpening(nextPackId);
      });
      const collection = document.createElement("button");
      collection.className = "vault-btn";
      collection.type = "button";
      collection.setAttribute("data-reveal-action", "collection");
      collection.textContent = ui("cardvault.view_collection", "View Collection");
      collection.addEventListener("click", async () => {
        const closed = await closeRevealCollected();
        if (closed) switchTab("collection");
      });
      actions.append(collect, again, collection, message);
      const hint = document.createElement("div");
      hint.className = "pack-flow-hint";
      hint.textContent = codeRewardReveal() ? ui("cardvault.reward_collected", "Reward collected.") : ui("cardvault.pack_results", "Pack results");
      summaryScroll.append(grid, hint);
      flow.append(summaryScroll, actions);
      animateDustCounters(grid);
      setTimeout(() => collect.focus(), 0);
      return;
    }

    const index = Math.max(0, Math.min(pulls.length - 1, reveal.stage - 1));
    const activeRarity = pulls[index]?.rarity || rarity(pulls[index]?.card || {});
    applyRarityVars(overlay, activeRarity, "vars");
    overlay.dataset.revealDarken = String(Number(activeRarity.rayCount || 0) >= 8);
    overlay.dataset.revealEffectDetail = String(Math.max(1, Number(activeRarity.frameDetailLevel || 1)));
    const stack = document.createElement("div");
    stack.className = "pack-card-stack";
    applyRarityVars(stack, activeRarity, "vars");
    const remaining = Math.max(0, pulls.length - index - 1);
    for (let i = 0; i < remaining; i += 1) {
      const back = document.createElement("div");
      back.className = "pack-stack-back";
      stack.appendChild(back);
    }
    stack.appendChild(revealCardNode(pulls[index], false));
    const cover = document.createElement("div");
    cover.className = "tcg-card-back tcg-reveal-cover";
    cover.setAttribute("aria-hidden", "true");
    stack.appendChild(cover);
    const hint = document.createElement("div");
    hint.className = "pack-flow-hint";
    hint.textContent = ui("cardvault.reveal_tap_anywhere", "Tap anywhere to continue");
    flow.append(stack, hint, revealRecoveryActions({ includeSkip: true }));
    setTimeout(() => overlay.focus(), 0);
  }

  function revealUnlockDelay(stage) {
    // Keep reduced-motion progression short, but leave enough room for the
    // visible accent and a genuinely-new acquisition cue to remain distinct.
    if (reducedMotion()) return 260;
    const pulls = reveal.result?.pulls || [];
    if (stage <= 0 || stage > pulls.length) return 320;
    const def = pulls[stage - 1]?.rarity || rarity(pulls[stage - 1]?.card || {});
    return Math.max(180, Math.min(def.id === "ultra_mythic" ? 2800 : 2100, Number(def.revealDurationMs || 320) + 80));
  }

  function advanceReveal() {
    if (!reveal.result) return;
    if (reveal.locked) return;
    clearPackIntroTimer();
    clearRevealUnlockTimer();
    reveal.locked = true;
    const summaryStage = revealSummaryStage();
    reveal.stage = Math.min(summaryStage, reveal.stage + 1);
    const status = reveal.stage >= summaryStage ? "summary" : "revealing";
    window.CardVaultSystem.updatePendingReveal({ id: reveal.result.pendingReveal?.id, revealIndex: reveal.stage, status });
    // Crash-safety: renderRevealOverlay()/emitRevealStageCue() build DOM/audio
    // cues from per-card catalog data (rarity config, artwork resolution,
    // presentation hooks) that a single malformed or missing entry for THIS
    // specific pull can throw out of -- and the unlock timer below was only
    // ever scheduled AFTER this call. A single uncaught exception here (e.g.
    // a Windows Light packaged build missing/altering one card's assets)
    // permanently left reveal.locked === true with no timer ever armed to
    // clear it: every further tap's own `if (reveal.locked) return` guard
    // then silently discarded it forever, matching a real reported bug
    // ("unpacking the first pack only showed one card") -- the player's
    // first card renders fine, the second card's render throws, and nothing
    // they do afterward can ever advance again. General robustness fix, not
    // specific to any one card/rarity: guarantee the lock is always released
    // (immediately on failure, on the normal timer on success) regardless of
    // what a future catalog entry's render throws.
    try {
      renderRevealOverlay();
      emitRevealStageCue(reveal.stage);
    } catch (err) {
      try { console.error("[CardVault] reveal render failed, unlocking input so the player can retry", { stage: reveal.stage, err }); } catch {}
      reveal.locked = false;
      return;
    }
    const acceptedRevealId = String(reveal.result.pendingReveal?.id || "");
    const acceptedStage = reveal.stage;
    reveal.unlockTimer = setTimeout(() => {
      reveal.unlockTimer = 0;
      if (String(reveal.result?.pendingReveal?.id || "") !== acceptedRevealId || reveal.stage !== acceptedStage) return;
      q("[data-pack-flow] .pack-flow-card")?.classList.add("is-reveal-settled");
      reveal.locked = false;
    }, revealUnlockDelay(acceptedStage));
  }

  async function closeRevealCollected(options = {}) {
    if (revealClosing) return false;
    revealClosing = true;
    clearRevealTimer();
    clearPackIntroTimer();
    clearRevealUnlockTimer();
    try {
      const result = await window.CardVaultSystem.collectPendingReveal(reveal.result?.pendingReveal?.id || "");
      if (!sceneActive) return false;
      if (result && result.ok === false) return false;
      clearRevealCueTimers();
      const resumeTutorial = tutorial.awaitingFreeReveal;
      reveal = { result: null, stage: 0, locked: false, timer: 0, introTimer: 0, unlockTimer: 0, cueTimers: [], queuedAdvances: 0 };
      const overlay = q("[data-pack-overlay]");
      if (overlay) overlay.hidden = true;
      const flow = q("[data-pack-flow]");
      if (flow) flow.classList.remove("is-summary");
      if (options.refresh !== false) refreshAll();
      const onboardingIncomplete = !window.CardVaultSystem.readState().onboarding?.tutorialCompleted;
      if (resumeTutorial || onboardingIncomplete) {
        tutorial.awaitingFreeReveal = false;
        tutorial.step = resumeTutorial ? 3 : 0;
        tutorial.replay = false;
        renderTutorial();
      }
      return true;
    } finally {
      revealClosing = false;
    }
  }

  async function startPackOpening(packId) {
    if (opening || revealClosing) return;
    opening = true;
    refreshShell();
    renderPack();
    const packNode = q("[data-reveal-pack]");
    const cardsHost = q("[data-reveal-cards]");
    const summary = q("[data-reveal-summary]");
    if (cardsHost) cardsHost.innerHTML = "";
    if (summary) summary.textContent = ui("cardvault.opening", "Opening...");
    if (packNode) {
      packNode.classList.remove("is-opening");
      void packNode.offsetWidth;
      packNode.classList.add("is-opening");
    }

    const result = await window.CardVaultSystem.openPack(packId);
    if (!sceneActive) return;
    if (!result.ok) {
      if (summary) summary.textContent = result.reason === "not_enough_points"
        ? ui("cardvault.not_enough_points", "Not enough points.")
        : result.reason === "card_pool_empty"
          ? ui("cardvault.no_cards_available", "No cards available.")
          : result.reason === "storage_full"
            ? ui("storage.full.card_vault", "Storage is full. The pack was not opened and no points were spent.")
          : ui("cardvault.open_failed", "Pack could not be opened.");
      opening = false;
      refreshShell();
      renderPack();
      return;
    }

    opening = false;
    refreshShell();
    reveal.result = result;
    if (!result.resumed) playPendingRevealSoundOnce("pack_opening", "cardVaultPackOpening");
    reveal.stage = normalizeStage(result.pendingReveal?.revealIndex || 0);
    resetRevealInputState();
    renderRevealOverlay();
    armRevealFallback();
    if (summary) summary.textContent = ui("cardvault.opening", "Opening...");
    if (cardsHost) {
      cardsHost.innerHTML = "";
      result.pulls.forEach((pull) => {
        const node = cardFace(pull);
        node.classList.add("is-revealed");
        cardsHost.appendChild(node);
      });
    }
    refreshAll();
  }

  function makeFilter(label, active, onClick) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "vault-filter" + (active ? " is-active" : "");
    btn.textContent = label;
    btn.setAttribute("aria-pressed", active ? "true" : "false");
    btn.addEventListener("click", onClick);
    return btn;
  }

  function renderFilters() {
    const host = q("[data-filter-root]");
    if (!host) return;
    host.innerHTML = "";
    const controls = document.createElement("div");
    controls.className = "collection-controls";
    const sort = document.createElement("select");
    sort.className = "dust-select";
    sort.setAttribute("aria-label", "Collection sort");
    [
      ["newest", ui("cardvault.sort_newest", "Newest")],
      ["oldest", ui("cardvault.sort_oldest", "Oldest")],
      ["rarity", ui("cardvault.sort_rarity", "Rarity")],
      ["character", ui("cardvault.sort_character", "Character")],
      ["alphabetical", ui("cardvault.sort_alphabetical", "Alphabetical")]
    ].forEach(([value, label]) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      opt.selected = sortMode === value;
      sort.appendChild(opt);
    });
    sort.addEventListener("change", () => {
      sortMode = sort.value || "newest";
      renderCollection();
    });
    controls.appendChild(sort);
    const masonPreference = document.createElement("div");
    masonPreference.className = "mason-display-preference";
    masonPreference.setAttribute("role", "group");
    masonPreference.setAttribute("aria-label", ui("cardvault.mason_display_preference_aria", "Mason card display preference"));
    const masonLabel = document.createElement("div");
    masonLabel.className = "mason-display-preference-label";
    masonLabel.textContent = ui("cardvault.mason_display_preference", "Mason cards");
    masonPreference.appendChild(masonLabel);
    [
      ["male", ui("cardvault.mason_display_male", "Mason — Male")],
      ["female", ui("cardvault.mason_display_female", "Mason — Female")],
      ["both", ui("cardvault.mason_display_both", "Both Mason variants")]
    ].forEach(([value, label]) => {
      const button = makeFilter(label, state.masonCardDisplayPreference === value, () => {
        const result = window.CardVaultSystem.setMasonCardDisplayPreference(value);
        if (result?.ok) state = result.state;
        renderCollection();
      });
      button.dataset.masonDisplayPreference = value;
      masonPreference.appendChild(button);
    });
    controls.appendChild(masonPreference);
    host.appendChild(controls);
    host.append(
      makeFilter(ui("cardvault.filter_all", "All"), filter.mode === "all" && !filter.rarity && !filter.character && !filter.duplicate, () => { filter = { mode: "all", rarity: "", character: "", duplicate: false }; renderCollection(); }),
      makeFilter(ui("cardvault.filter_owned", "Owned"), filter.mode === "owned", () => { filter.mode = "owned"; renderCollection(); }),
      makeFilter(ui("cardvault.filter_missing", "Missing"), filter.mode === "missing", () => { filter.mode = "missing"; renderCollection(); }),
      makeFilter(ui("cardvault.filter_duplicates", "Duplicates"), filter.duplicate === true, () => { filter.duplicate = !filter.duplicate; if (filter.duplicate) filter.mode = "owned"; renderCollection(); })
    );
    (config.rarities || []).filter(rarityIsVisible).forEach((r) => {
      host.appendChild(makeFilter(sourceText(r.name || r.id), filter.rarity === r.id, () => { filter.rarity = filter.rarity === r.id ? "" : r.id; renderCollection(); }));
    });
    (config.characters || []).forEach((character) => {
      host.appendChild(makeFilter(characterName(character.id), filter.character === character.id, () => {
        filter.character = filter.character === character.id ? "" : character.id;
        renderCollection();
      }));
    });
  }

  function cardMatches(card) {
    const isOwned = owned(card);
    if (secretCodeCard(card) && !isOwned) return false;
    if (filter.mode === "owned" && !isOwned) return false;
    if (filter.mode === "missing" && isOwned) return false;
    if (filter.duplicate && !(Number(state.owned?.[card.id]?.count || 0) > 1)) return false;
    if (filter.rarity && card.rarity !== filter.rarity) return false;
    if (filter.character && String(card.characterId || "") !== filter.character) return false;
    if (!filter.character && state.masonCardDisplayPreference !== "both") {
      const hiddenVariant = state.masonCardDisplayPreference === "female" ? "mason_male" : "mason_female";
      if (String(card.characterId || "") === hiddenVariant) return false;
    }
    return true;
  }

  function sortCards(cards) {
    const rows = cards.slice();
    const ownedRow = (card) => state.owned?.[card.id] || {};
    const timeValue = (raw) => {
      const n = Date.parse(String(raw || ""));
      return Number.isFinite(n) ? n : 0;
    };
    const byName = (a, b) => sourceText(a.title || a.id).localeCompare(sourceText(b.title || b.id));
    rows.sort((a, b) => {
      if (sortMode === "oldest") return timeValue(ownedRow(a).firstUnlockedAt) - timeValue(ownedRow(b).firstUnlockedAt) || byName(a, b);
      if (sortMode === "rarity") return (Number(rarity(b).sortOrder || 0) - Number(rarity(a).sortOrder || 0)) || byName(a, b);
      if (sortMode === "character") return characterName(a).localeCompare(characterName(b)) || byName(a, b);
      if (sortMode === "alphabetical") return byName(a, b);
      return timeValue(ownedRow(b).lastPulledAt || ownedRow(b).firstUnlockedAt) - timeValue(ownedRow(a).lastPulledAt || ownedRow(a).firstUnlockedAt) || byName(a, b);
    });
    return rows;
  }

  function renderProgress() {
    const host = q("[data-progress-list]");
    if (!host) return;
    host.innerHTML = "";
    const progress = window.CardVaultSystem.computeProgress(state, config);
    const rows = [[ui("cardvault.overall", "Overall"), progress.owned, progress.total, null]];
    (config.rarities || []).filter(rarityIsVisible).slice().sort((a, b) => Number(b.sortOrder || 0) - Number(a.sortOrder || 0)).forEach((rarityDef) => {
      const row = progress.byRarity?.[rarityDef.id] || { owned: 0, total: 0 };
      rows.push([sourceText(rarityDef.name || rarityDef.id), row.owned, row.total, rarityDef]);
    });
    Object.entries(progress.byCharacter).sort((a, b) => a[0].localeCompare(b[0])).forEach(([name, row]) => rows.push([sourceText(name), row.owned, row.total]));
    rows.forEach(([name, own, total, rarityDef]) => {
      const node = document.createElement("div");
      node.className = "progress-row";
      if (rarityDef) applyRarityVars(node, rarityDef);
      node.innerHTML = `<div class="progress-name"></div><div class="progress-count"></div><div class="progress-bar"><div class="progress-fill"></div></div>`;
      node.querySelector(".progress-name").textContent = name;
      node.querySelector(".progress-count").textContent = `${fmt(own)} / ${fmt(total)}`;
      node.querySelector(".progress-fill").style.width = `${total ? Math.max(0, Math.min(100, (own / total) * 100)) : 0}%`;
      host.appendChild(node);
    });
  }

  function renderCollection() {
    renderFilters();
    const host = q("[data-collection-grid]");
    if (!host) return;
    host.innerHTML = "";
    sortCards((config.cards || []).filter(cardMatches)).forEach((card) => {
      const r = rarity(card);
      const isOwned = owned(card);
      const node = document.createElement("article");
      node.className = "collection-card" + (isOwned ? " is-owned" : " is-missing");
      node.dataset.cardId = String(card.id || "");
      node.dataset.collectionOwned = String(isOwned);
      applyRarityVars(node, r, "grid");
      node.innerHTML = `
        <div class="collection-img"></div>
        <div class="collection-copy">
          <div class="collection-meta">
            <span class="collection-character"></span>
            <span class="collection-rarity"></span>
          </div>
        </div>
      `;
      const imgNode = node.querySelector(".collection-img");
      if (isOwned) setLazyBackground(imgNode, card);
      if (isOwned && cardIsNew(card.id)) {
        const badge = document.createElement("span");
        badge.className = "new-badge";
        badge.textContent = ui("cardvault.new", "NEW");
        node.appendChild(badge);
      }
      node.querySelector(".collection-character").textContent = characterName(card);
      node.querySelector(".collection-rarity").textContent = rarityName(card.rarity);
      if (isOwned) {
        node.tabIndex = 0;
        node.addEventListener("click", () => openViewer(card.id));
        node.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            openViewer(card.id);
          }
        });
      }
      host.appendChild(node);
    });
  }

  function ownedViewerCards() {
    return (config.cards || []).filter((card) => owned(card));
  }

  function openViewer(cardId, options = {}) {
    const requestedCard = config?.cardById?.[cardId];
    if (secretCodeCard(requestedCard) && !owned(requestedCard)) return false;
    if (viewer.timer) clearTimeout(viewer.timer);
    viewer.timer = 0;
    viewer.closing = false;
    q("[data-card-viewer]")?.classList.remove("is-closing");
    viewer.cards = Array.isArray(options.cards) && options.cards.length ? options.cards : ownedViewerCards();
    viewer.index = Number.isInteger(options.index) ? options.index : Math.max(0, viewer.cards.findIndex((card) => card.id === cardId));
    const result = window.CardVaultSystem.markCardSeen?.(cardId);
    if (result?.ok) state = result.state;
    if (!viewer.history && options.fromReveal !== true) {
      try {
        window.history.pushState({ cardVaultViewer: true }, "");
        viewer.history = true;
      } catch {}
    }
    document.body?.classList.add("card-vault-viewer-open");
    renderViewer();
    renderCollection();
  }

  function renderViewer() {
    const overlay = q("[data-card-viewer]");
    const card = viewer.cards[viewer.index];
    if (!overlay || !card) return;
    const r = rarity(card);
    overlay.hidden = false;
    applyRarityVars(overlay, r);
    const viewerImage = q("[data-viewer-image]");
    applyRarityVars(viewerImage, r, "viewer");
    mountArtwork(viewerImage, card, "viewer");
    mountRarityEffects(viewerImage, r, "viewer");
    setText("[data-viewer-title]", sourceText(card.title || card.id));
    setText("[data-viewer-meta]", `${characterName(card)} - ${rarityName(card.rarity)}`);
    const row = state.owned[card.id] || {};
    const duplicateBadge = q("[data-viewer-extra]");
    const duplicateCount = Math.max(0, Number(row.count || 0) - 1);
    if (duplicateBadge) {
      duplicateBadge.textContent = duplicateCount > 0 ? `${ui("cardvault.duplicates", "Duplicates")} ×${fmt(duplicateCount)}` : "";
      duplicateBadge.hidden = duplicateCount < 1;
    }
    const prev = q("[data-viewer-prev]");
    const next = q("[data-viewer-next]");
    const wallpaper = q("[data-viewer-wallpaper]");
    if (wallpaper) {
      wallpaper.textContent = ui("wallpaper.set_as", "Set as Wallpaper");
      wallpaper.disabled = card.imagePending === true || !owned(card) || !canonicalViewerArtwork(card);
    }
    if (prev) {
      prev.textContent = ui("cardvault.previous_card", "Previous Card");
      prev.disabled = viewer.cards.length < 2;
    }
    if (next) {
      next.textContent = ui("cardvault.next_card", "Next Card");
      next.disabled = viewer.cards.length < 2;
    }
  }

  function closeViewer(opts = {}) {
    const overlay = q("[data-card-viewer]");
    const shouldPopHistory = viewer.history && opts.fromPop !== true;
    if (overlay) {
      overlay.hidden = true;
      overlay.classList.remove("is-closing");
    }
    document.body?.classList.remove("card-vault-viewer-open");
    viewer.index = -1;
    viewer.cards = [];
    viewer.touchX = 0;
    viewer.history = false;
    viewer.closing = false;
    if (viewer.timer) clearTimeout(viewer.timer);
    viewer.timer = 0;
    if (shouldPopHistory) {
      try { window.history.back(); } catch {}
    }
    return true;
  }

  function moveViewer(delta) {
    if (!viewer.cards.length) return;
    viewer.index = (viewer.index + delta + viewer.cards.length) % viewer.cards.length;
    renderViewer();
  }

  function renderRewards() {
    const host = q("[data-reward-list]");
    if (!host) return;
    host.innerHTML = "";
    const summary = q("[data-entitlement-summary]");
    if (summary) {
      let mason = false;
      let gallery = false;
      try {
        mason = localStorage.getItem("patreon_mason_day9_15_unlock_v1") === "1";
        gallery = localStorage.getItem("gallery_full_unlock_v1") === "1";
      } catch {}
      summary.textContent = [
        `${ui("cardvault.mason_update", "Mason Update")}: ${mason ? ui("cardvault.unlocked", "Unlocked") : ui("cardvault.locked", "Locked")}`,
        `${ui("cardvault.full_gallery", "Full Gallery")}: ${gallery ? ui("cardvault.unlocked", "Unlocked") : ui("cardvault.locked", "Locked")}`
      ].join(" / ");
    }
    (config.rewards || config.rewardTiers || []).filter((reward) => reward.rewardType !== "special_bonus" && reward.hidden !== true && reward.visibility !== "secret").forEach((reward) => {
      const eligibility = window.CardVaultSystem.rewardClaimEligibility(reward, state);
      const claimed = eligibility.claimed;
      const availability = eligibility.reason || "available";
      const row = document.createElement("div");
      row.className = "reward-row";
      row.innerHTML = `
        <div>
          <div class="reward-name"></div>
          <div class="reward-status"></div>
          <div class="reward-points"></div>
          <div class="vault-message" data-reward-message></div>
        </div>
        <input class="reward-code" type="text" autocomplete="off" spellcheck="false">
        <button class="vault-btn" type="button"></button>
      `;
      row.querySelector(".reward-name").textContent = sourceText(reward.name || reward.id);
      row.querySelector(".reward-points").textContent = `+${fmt(reward.points)} ${ui("cardvault.points", "Points")}`;
      const status = row.querySelector(".reward-status");
      const input = row.querySelector("input");
      input.hidden = !eligibility.requiresCode || claimed;
      input.placeholder = ui("cardvault.patreon_code", "Patreon code");
      input.disabled = claimed || availability !== "available";
      const btn = row.querySelector("button");
      btn.textContent = claimed ? ui("cardvault.claimed", "Claimed") : ui("cardvault.claim", "Claim");
      btn.disabled = !eligibility.canClaim;
      const message = row.querySelector("[data-reward-message]");
      if (claimed) {
        status.textContent = ui("cardvault.claimed", "Claimed");
        message.textContent = `${ui("cardvault.reward_collected", "Reward collected.")} ${ui("cardvault.remaining_points", "Remaining points")}: ${fmt(state.points)}`;
      }
      else if (availability === "future") message.textContent = ui("cardvault.reward_future", "Not available yet.");
      else if (availability === "expired") message.textContent = ui("cardvault.reward_expired", "Expired.");
      else if (availability === "inactive") message.textContent = ui("cardvault.reward_inactive", "Inactive.");
      else status.textContent = eligibility.requiresCode
        ? ui("cardvault.locked", "Locked")
        : ui("cardvault.available", "Available");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        input.disabled = true;
        const currentEligibility = window.CardVaultSystem.rewardClaimEligibility(reward, window.CardVaultSystem.readState());
        const result = currentEligibility.requiresCode
          ? await window.CardVaultSystem.redeemCode(input.value, { source: "card_vault_scene" })
          : await window.CardVaultSystem.claimReward(reward.id, "", { source: "card_vault_scene" });
        if (!sceneActive) return;
        if (!result.ok) {
          const text = result.reason === "already_claimed"
            ? ui("cardvault.already_claimed", "Already claimed.")
            : result.reason === "invalid_code"
              ? ui("cardvault.invalid_code", "Invalid code.")
              : result.reason === "storage_full"
                ? ui("storage.full.card_vault_reward", "Storage is full. The reward was not claimed.")
              : ui("cardvault.claim_failed", "Claim failed.");
          message.textContent = text;
          btn.disabled = false;
          input.disabled = false;
          return;
        }
        message.textContent = `${ui("cardvault.reward_collected", "Reward collected.")} ${ui("cardvault.remaining_points", "Remaining points")}: ${fmt(result.state?.points || 0)}`;
        refreshAll();
      });
      host.appendChild(row);
    });
  }

  function renderHistory() {
    const host = q("[data-history-list]");
    if (!host) return;
    host.innerHTML = "";
    const rows = [];
    (state.packHistory || []).slice().reverse().forEach((packRow) => {
      (packRow.cards || []).forEach((pull) => rows.push({ ...pull, openedAt: packRow.openedAt, packId: packRow.packId }));
    });
    (state.rewardHistory || []).slice().reverse().forEach((rewardRow) => {
      const rewardCard = config.cardById?.[rewardRow.cardId || config.rewardById?.[rewardRow.rewardId]?.cardId];
      const node = document.createElement("div");
      node.className = "history-row";
      if (rewardCard) applyRarityVars(node, rarity(rewardCard), "grid");
      node.innerHTML = `
        <div class="history-img" aria-hidden="true"></div>
        <div class="history-copy">
          <div class="history-rarity"></div>
          <div class="history-title"></div>
          <div class="reward-points"></div>
        </div>
        <div class="history-result"></div>
      `;
      node.querySelector(".history-rarity").textContent = rewardCard ? rarityName(rewardCard.rarity) : ui("cardvault.special_bonus", "Special bonus");
      node.querySelector(".history-title").textContent = rewardCard ? sourceText(rewardCard.title || rewardCard.id) : `+${fmt(rewardRow.amount)} ${ui("cardvault.collection_points", "Collection Points")}`;
      if (rewardCard && owned(rewardCard)) setLazyBackground(node.querySelector(".history-img"), rewardCard);
      node.querySelector(".reward-points").textContent = String(rewardRow.timestamp || "");
      node.querySelector(".history-result").textContent = ui("cardvault.claimed", "Claimed");
      host.appendChild(node);
    });
    // Each pull row is resolved by its EXACT immutable card id (pull.cardId)
    // -- every character variant (e.g. Mason male/female) is its own
    // separate catalog entry with its own fixed image, never re-derived
    // from the player's CURRENT display preference -- so this thumbnail
    // always shows what was actually pulled at the time, never retroactively
    // changed by a later variant switch. Reuses the exact same lazy,
    // protected-resolver-backed loader (setLazyBackground/mountArtwork)
    // already used for the Collection grid, so History stays lightweight
    // (images only load as rows scroll into view) and never loads a raw
    // path directly.
    rows.slice(0, 80).forEach((pull) => {
      const card = config.cardById?.[pull.cardId] || { id: pull.cardId, title: pull.cardId, rarity: pull.rarity };
      const r = config.rarityById?.[pull.rarity || card.rarity] || rarity(card);
      const node = document.createElement("div");
      node.className = "history-row";
      applyRarityVars(node, r, "grid");
      node.innerHTML = `
        <div class="history-img"></div>
        <div class="history-copy">
          <div class="history-rarity"></div>
          <div class="history-title"></div>
          <div class="reward-points"></div>
        </div>
        <div class="history-result"></div>
      `;
      node.querySelector(".history-rarity").textContent = sourceText(r.name || r.id || "");
      node.querySelector(".history-title").textContent = sourceText(card.title || card.id);
      node.querySelector(".reward-points").textContent = characterName(card);
      node.querySelector(".history-result").textContent = pull.duplicate
        ? `${ui("cardvault.duplicate", "Duplicate")} +${fmt(pull.dust)} ${ui("cardvault.dust", "Dust")}`
        : ui("cardvault.new_card", "New Card");
      setLazyBackground(node.querySelector(".history-img"), card);
      host.appendChild(node);
    });
    if (!rows.length && !(state.rewardHistory || []).length) {
      const empty = document.createElement("div");
      empty.className = "vault-message";
      empty.textContent = ui("cardvault.no_history", "No pulls yet.");
      host.appendChild(empty);
    }
  }

  function renderDustExchange() {
    const exchange = config.duplicatePolicy?.dustExchange || { dustCost: 100, pointsReward: 50 };
    const max = Math.floor((state.dust || 0) / exchange.dustCost);
    setText("[data-dust-rate]", `${fmt(exchange.dustCost)} ${ui("cardvault.dust_balance", "Dust balance")} -> ${fmt(exchange.pointsReward)} ${ui("cardvault.collection_points", "Collection Points")}`);
    const select = q("[data-dust-count]");
    if (select) {
      select.innerHTML = "";
      const options = Array.from(new Set([1, 2, 5, max].filter((n) => n > 0 && n <= Math.max(1, max))));
      (options.length ? options : [1]).forEach((n) => {
        const opt = document.createElement("option");
        opt.value = String(n);
        opt.textContent = `${fmt(n * exchange.dustCost)} -> ${fmt(n * exchange.pointsReward)}`;
        select.appendChild(opt);
      });
      select.disabled = max <= 0;
    }
    const btn = q("[data-dust-exchange]");
    if (btn) btn.disabled = max <= 0 || exchanging;
  }

  function renderStats() {
    const host = q("[data-stat-list]");
    if (!host) return;
    host.innerHTML = "";
    const stats = state.statistics || {};
    const rows = [
      [ui("cardvault.packs_opened", "Packs opened"), stats.packsOpened || 0],
      [ui("cardvault.cards_collected", "Cards collected"), Object.keys(state.owned || {}).length],
      [ui("cardvault.duplicates", "Duplicates"), state.duplicates?.total || 0]
    ];
    (config.rarities || []).filter((row) => row.statKey).forEach((row) => {
      const statKey = String(row.statKey || "").trim();
      const fallback = `${sourceText(row.name || row.id)} ${ui("cardvault.pulls", "pulls")}`;
      rows.push([sourceText(row.statLabel || fallback), stats[statKey] || stats.pullsByRarity?.[row.id] || 0]);
    });
    rows.push([ui("cardvault.favorite_rarity", "Favorite rarity"), stats.favoriteRarity ? rarityName(stats.favoriteRarity) : "-"]);
    rows.forEach(([name, value]) => {
      const node = document.createElement("div");
      node.className = "progress-row";
      node.innerHTML = `<div class="progress-name"></div><div class="progress-count"></div>`;
      node.querySelector(".progress-name").textContent = name;
      node.querySelector(".progress-count").textContent = String(value);
      host.appendChild(node);
    });
  }

  async function renderDiagnostics() {
    const host = q("[data-diagnostics-list]");
    if (!host || q("[data-diagnostics-tab]")?.hidden) return;
    const diagnostics = await window.CardVaultSystem.getDiagnostics();
    if (!sceneActive) return;
    const rows = [
      [ui("cardvault.diagnostic_version", "Card Vault version"), diagnostics.version],
      [ui("cardvault.diagnostic_season", "Reward season"), diagnostics.seasons.map((season) => season.id).join(", ") || "-"],
      [ui("cardvault.diagnostic_tier", "Tier"), `${diagnostics.tier} (${diagnostics.tierRank})`],
      [ui("cardvault.points", "Points"), diagnostics.points],
      [ui("cardvault.dust", "Dust"), diagnostics.dust],
      [ui("cardvault.diagnostic_owned", "Owned cards"), diagnostics.ownedCards],
      [ui("cardvault.diagnostic_claimed", "Claimed rewards"), diagnostics.claimedRewards.length],
      [ui("cardvault.diagnostic_special_claimed", "Special bonus claimed"), diagnostics.specialBonus?.claimed ? ui("cardvault.yes", "Yes") : ui("cardvault.no", "No")],
      [ui("cardvault.diagnostic_special_amount", "Special bonus amount"), diagnostics.specialBonus?.amountGranted || 0],
      [ui("cardvault.diagnostic_special_integrity", "Special bonus integrity"), diagnostics.specialBonus?.integrity || "FAIL"],
      [ui("cardvault.diagnostic_pending", "Pending reveal"), diagnostics.pendingReveal ? `${diagnostics.pendingReveal.packId} / ${diagnostics.pendingReveal.cards}` : "-"],
      [ui("cardvault.diagnostic_integrity", "Integrity"), diagnostics.integrity]
    ];
    host.innerHTML = "";
    rows.forEach(([name, value]) => {
      const node = document.createElement("div");
      node.className = "progress-row";
      node.innerHTML = '<div class="progress-name"></div><div class="progress-count"></div>';
      node.querySelector(".progress-name").textContent = String(name);
      node.querySelector(".progress-count").textContent = String(value);
      host.appendChild(node);
    });
  }

  function refreshAll() {
    if (!sceneActive) return;
    refreshShell();
    renderPack();
    renderProgress();
    renderCollection();
    renderDustExchange();
    renderSpecialBonus();
    renderRewards();
    renderHistory();
    renderStats();
    renderDiagnostics().catch(() => {});
  }

  function switchTab(tab) {
    root.dataset.activeTab = tab;
    qa("[data-vault-tab]").forEach((node) => node.classList.toggle("is-active", node.dataset.vaultTab === tab));
    qa("[data-vault-view]").forEach((view) => { view.hidden = view.dataset.vaultView !== tab; });
    if (tab === 'collection') {
      qa('.collection-img[data-src]').forEach((node) => {
        loadLazyImage(node);
        try { lazyImages?.unobserve(node); } catch {}
      });
    }
  }

  qa("[data-vault-tab]").forEach((btn) => {
    btn.addEventListener("click", () => {
      switchTab(btn.dataset.vaultTab);
    });
  });

  q("[data-vault-help]")?.addEventListener("click", () => openTutorial(0, true));
  q("[data-tutorial-back]")?.addEventListener("click", () => { if (tutorial.step > 0) { tutorial.step -= 1; renderTutorial(); } });
  q("[data-tutorial-next]")?.addEventListener("click", advanceTutorial);
  q("[data-tutorial-skip]")?.addEventListener("click", skipTutorial);

  q("[data-special-code-redeem]")?.addEventListener("click", redeemSpecialBonus);
  q("[data-special-code-input]")?.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    redeemSpecialBonus();
  });
  q("[data-bonus-overlay]")?.addEventListener("click", closeBonusCelebration);

  q("[data-dust-exchange]")?.addEventListener("click", async () => {
    if (exchanging) return;
    const select = q("[data-dust-count]");
    const count = Math.max(1, Number(select?.value || 1));
    const exchange = config.duplicatePolicy?.dustExchange || { dustCost: 100, pointsReward: 50 };
    const confirmText = ui("cardvault.confirm_exchange", "Confirm exchange") + `: ${fmt(count * exchange.dustCost)} ${ui("cardvault.dust", "Dust")} -> ${fmt(count * exchange.pointsReward)} ${ui("cardvault.points", "Points")}`;
    if (!window.confirm(confirmText)) return;
    exchanging = true;
    const result = await window.CardVaultSystem.exchangeDust(count, { source: "card_vault_scene" });
    if (!sceneActive) return;
    exchanging = false;
    setText("[data-dust-message]", result.ok ? ui("cardvault.exchange_successful", "Exchange successful") : ui("cardvault.not_enough_dust", "Not enough Dust"));
    refreshAll();
  });

  q("[data-viewer-close]")?.addEventListener("click", closeViewer);
  q("[data-viewer-wallpaper]")?.addEventListener("click", async (event) => {
    event.preventDefault();
    event.stopPropagation();
    const card = viewer.cards[viewer.index];
    if (!card || !owned(card)) {
      try { window.reportGameRuntimeEvent?.("wallpaper-card-vault-rejected", { reason: "ownership", cardId: String(card?.id || "") }); } catch {}
      return;
    }
    const source = canonicalViewerArtwork(card);
    if (!source) {
      try { window.reportGameRuntimeEvent?.("wallpaper-card-vault-rejected", { reason: "invalid-artwork", cardId: String(card.id || ""), source: artworkSource(card) }); } catch {}
      return;
    }
    const button = event.currentTarget;
    button.disabled = true;
    const ok = await window.Game?.wallpaper?.set?.(source, { source: "cardVault", cardId: String(card.id || "") });
    if (!sceneActive) return;
    button.disabled = false;
    if (ok) {
      const message = ui("wallpaper.updated", "Wallpaper updated");
      try { window.showToast?.(message); } catch {}
      button.textContent = message;
      setTimeout(() => { if (button.isConnected) button.textContent = ui("wallpaper.set_as", "Set as Wallpaper"); }, 1800);
    } else {
      try { window.reportGameRuntimeEvent?.("wallpaper-card-vault-rejected", { reason: "service-failure", cardId: String(card.id || ""), source }); } catch {}
      try { console.warn("[Wallpaper] Card Vault asset rejected", { cardId: String(card.id || ""), source }); } catch {}
    }
  });
  q("[data-viewer-prev]")?.addEventListener("click", () => moveViewer(-1));
  q("[data-viewer-next]")?.addEventListener("click", () => moveViewer(1));
  let foilTarget = null;
  let foilFrame = 0;
  let foilPointer = null;
  function resetFoilTarget() {
    if (!foilTarget) return;
    foilTarget.classList.remove("is-tcg-hover");
    ["--foil-x", "--foil-y", "--tilt-x", "--tilt-y"].forEach((key) => foilTarget.style.removeProperty(key));
    foilTarget = null;
  }
  function onFoilPointerMove(event) {
    if (!sceneActive || reducedMotion() || liteEffects() || event.pointerType === "touch"
        || !window.matchMedia?.("(hover: hover) and (pointer: fine)")?.matches) return;
    const target = event.target instanceof Element
      ? event.target.closest(".collection-card.is-owned, .viewer-image, .pack-summary-card, .pack-flow-card") : null;
    if (target !== foilTarget) { resetFoilTarget(); foilTarget = target; }
    if (!foilTarget) return;
    foilPointer = { x: event.clientX, y: event.clientY };
    if (foilFrame) return;
    foilFrame = requestAnimationFrame(() => {
      foilFrame = 0;
      if (!foilTarget?.isConnected || !foilPointer) return;
      const box = foilTarget.getBoundingClientRect();
      if (!box.width || !box.height) return;
      const x = Math.max(0, Math.min(1, (foilPointer.x - box.left) / box.width));
      const y = Math.max(0, Math.min(1, (foilPointer.y - box.top) / box.height));
      foilTarget.classList.add("is-tcg-hover");
      foilTarget.style.setProperty("--foil-x", (x * 100).toFixed(1) + "%");
      foilTarget.style.setProperty("--foil-y", (y * 100).toFixed(1) + "%");
      foilTarget.style.setProperty("--tilt-x", ((.5 - y) * 6).toFixed(2) + "deg");
      foilTarget.style.setProperty("--tilt-y", ((x - .5) * 7).toFixed(2) + "deg");
    });
  }
  root.addEventListener("pointermove", onFoilPointerMove, { passive: true });
  root.addEventListener("pointerleave", resetFoilTarget);
  const revealOverlay = q("[data-pack-overlay]");
  const revealInteractiveSelector = "button, a, input, select, textarea, [role='button'], [data-no-advance]";
  revealOverlay?.addEventListener("pointerdown", (ev) => {
    if (!ev.isPrimary || ev.button !== 0) return;
    revealPointer = { id: ev.pointerId, x: ev.clientX, y: ev.clientY };
  });
  revealOverlay?.addEventListener("pointercancel", () => { revealPointer = null; });
  revealOverlay?.addEventListener("pointerup", (ev) => {
    const start = revealPointer;
    revealPointer = null;
    if (!start || start.id !== ev.pointerId || !ev.isPrimary || ev.button !== 0) return;
    if (ev.target instanceof Element && ev.target.closest(revealInteractiveSelector)) return;
    if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 12) return;
    if (reveal.stage >= revealSummaryStage()) return;
    ev.preventDefault();
    advanceReveal();
  });
  revealOverlay?.addEventListener("click", (ev) => {
    // Real pointer activation is handled by pointerup above. A zero-detail click
    // is a keyboard/programmatic activation and must follow the same generic path.
    if (ev.detail !== 0) return;
    if (ev.target instanceof Element && ev.target.closest(revealInteractiveSelector)) return;
    if (reveal.stage >= revealSummaryStage()) return;
    advanceReveal();
  });
  q("[data-card-viewer]")?.addEventListener("click", (ev) => {
    if (ev.target === q("[data-card-viewer]")) closeViewer();
  });
  q("[data-card-viewer]")?.addEventListener("touchstart", (ev) => {
    viewer.touchX = ev.touches?.[0]?.clientX || 0;
  }, { passive: true });
  q("[data-card-viewer]")?.addEventListener("touchend", (ev) => {
    const x = ev.changedTouches?.[0]?.clientX || 0;
    const dx = x - viewer.touchX;
    if (Math.abs(dx) > 42) moveViewer(dx < 0 ? 1 : -1);
  }, { passive: true });
  function onPopState() {
    if (!q("[data-card-viewer]")?.hidden) closeViewer({ fromPop: true });
  }
  window.addEventListener("popstate", onPopState);

  function onKeyDown(ev) {
    const tutorialOpen = !q("[data-tutorial-overlay]")?.hidden;
    const bonusOpen = !q("[data-bonus-overlay]")?.hidden;
    const viewerOpen = !q("[data-card-viewer]")?.hidden;
    const revealOpen = !q("[data-pack-overlay]")?.hidden;
    if (tutorialOpen) {
      if (ev.key === "Escape" && tutorial.replay && window.CardVaultSystem.readState().onboarding?.firstFreePackGranted) { ev.preventDefault(); closeTutorial(); }
      return;
    } else if (bonusOpen && ev.key === "Escape") {
      ev.preventDefault();
      closeBonusCelebration();
    } else if (viewerOpen) {
      if (ev.key === "Escape") { ev.preventDefault(); closeViewer(); }
      if (ev.key === "ArrowLeft") moveViewer(-1);
      if (ev.key === "ArrowRight") moveViewer(1);
    } else if (revealOpen) {
      if (ev.key === "Escape") {
        ev.preventDefault();
        handleRevealBack();
        return;
      }
      if (ev.key === " " || ev.key === "Enter") {
        if (ev.target instanceof Element && ev.target.closest(revealInteractiveSelector)) return;
        ev.preventDefault();
        advanceReveal();
      }
    }
  }
  window.addEventListener("keydown", onKeyDown);

  function handleRevealBack() {
    const revealOpen = !q("[data-pack-overlay]")?.hidden;
    if (!revealOpen || !reveal.result) return false;
    if (reveal.stage >= revealSummaryStage()) {
      closeRevealCollected();
      return true;
    }
    clearPackIntroTimer();
    resetRevealInputState();
    reveal.stage = revealSummaryStage();
    window.CardVaultSystem.updatePendingReveal({ id: reveal.result.pendingReveal?.id, revealIndex: reveal.stage, status: "summary" });
    renderRevealOverlay();
    emitRevealStageCue(reveal.stage);
    return true;
  }

  function cardVaultHandleSceneBack() {
      const current = String(window.Game?.currentScene || "").toLowerCase();
      if (current !== "cardvault") return false;
      if (!q("[data-bonus-overlay]")?.hidden) { closeBonusCelebration(); return true; }
      if (!q("[data-tutorial-overlay]")?.hidden) {
        if (tutorial.replay && window.CardVaultSystem.readState().onboarding?.firstFreePackGranted) closeTutorial();
        else skipTutorial();
        return true;
      }
      if (!q("[data-card-viewer]")?.hidden) return closeViewer();
      return handleRevealBack();
  }
  if (window.Game) {
    window.Game.handleSceneBack = cardVaultHandleSceneBack;
  }

  window.__cardVaultSceneCleanup = function cleanupCardVaultScene() {
    if (!sceneActive) return;
    sceneActive = false;
    root.removeEventListener("pointermove", onFoilPointerMove);
    root.removeEventListener("pointerleave", resetFoilTarget);
    resetFoilTarget();
    window.removeEventListener("popstate", onPopState);
    window.removeEventListener("keydown", onKeyDown);
    lazyImages?.disconnect();
    rarityEffectsObserver?.disconnect();
    packTitleFitObserver?.disconnect();
    sceneTimers.forEach((id) => window.clearTimeout(id));
    sceneTimers.clear();
    sceneFrames.forEach((id) => window.cancelAnimationFrame(id));
    sceneFrames.clear();
    if (window.Game?.handleSceneBack === cardVaultHandleSceneBack) window.Game.handleSceneBack = null;
    root.querySelectorAll("img").forEach((img) => img.removeAttribute("src"));
    imageCache.clear();
    failedImages.clear();
    if (window.__cardVaultSceneCleanup === cleanupCardVaultScene) window.__cardVaultSceneCleanup = null;
  };

  window.CardVaultSystem.loadConfig().then((loaded) => {
    if (!sceneActive) return;
    config = loaded;
    let diagnosticsEnabled = false;
    try {
      diagnosticsEnabled = new URLSearchParams(location.search).get("qa") === "1" || localStorage.getItem("card_vault_qa_diagnostics_v1") === "1";
    } catch {}
    const diagnosticsTab = q("[data-diagnostics-tab]");
    if (diagnosticsTab) diagnosticsTab.hidden = !diagnosticsEnabled;
    refreshAll();
    window.CardVaultSystem.getPendingReveal().then((pending) => {
      if (!sceneActive) return;
      if (pending.ok) {
        reveal.result = pending;
        reveal.stage = normalizeStage(pending.pendingReveal?.revealIndex || 0);
        renderRevealOverlay();
        armRevealFallback();
        if (codeRewardReveal()) emitRevealStageCue(reveal.stage);
        return;
      }
      const onboarding = window.CardVaultSystem.readState().onboarding || {};
      if (!onboarding.tutorialCompleted) openTutorial(0, false);
    });
    try { window.Game?.i18n?.applyTo?.(root); } catch {}
  }).catch((err) => {
    if (!sceneActive) return;
    const stage = q("[data-reveal-summary]");
    if (stage) stage.textContent = ui("cardvault.load_failed", "Card Vault could not load.");
    try { console.warn("[CardVault] load failed", err); } catch {}
  });
})();
</script>
