<!-- scenes/conversation.html -->
<style>
  :root{
    --status-h:32px;

    /* ✅ reserve space for the global phone nav (Back/Home/Save) */
    --nav-h:64px;
    --safe-bottom: calc(var(--nav-h) + 18px);

    /* ===== Same theme as HOME ===== */
    --fg:#f0f5ff;
    --muted:rgba(240,245,255,0.68);

    --btn-bg: rgba(6,7,10,0.46);
    --btn-bg-hover: rgba(8,10,14,0.60);

    --edge: rgba(245,248,255,0.20);
    --edge-strong: rgba(245,248,255,0.44);

    --glow-soft: rgba(112,220,255,0.12);
    --glow-strong: rgba(112,220,255,0.18);

    --accent-a: rgba(112,220,255,0.55);
    --accent-b: rgba(255,166,92,0.45);

    --line: rgba(245,248,255,0.14);

    --card:rgba(5,10,32,0.85);
    --card2:rgba(8,14,40,0.9);

    /* ✅ avatar crop focus (top) */
    --avatar-focus-y: 20%;
  }

  /* ===== Scene ===== */
  .chat{
    height:100%;
    padding-top:calc(var(--status-h) - 8px);

    /* ✅ IMPORTANT: do NOT add padding-bottom here (it shrinks the scene) */
    /* padding-bottom: var(--safe-bottom); */

    display:grid;
    grid-template-rows:auto 1fr 32px;
    position:relative;
    overflow:hidden;
    color:var(--fg);
    font-family:var(--ui-font);

    background:
      radial-gradient(circle at top, rgba(18,26,46,0.22), rgba(3,5,16,0.46));
  }

  /* ✅ wallpaper attenuated + blurred
     Was hardcoded to the literal default asset (url("assets/pictures/
     backscreen.jpg")) instead of the canonical selected Card Vault
     wallpaper -- every other scene (home/messages/story/hak/save/settings/
     snapgram/cardvault/onlyfun/achievements/pictures) already reads
     var(--phone-wallpaper-image), the CSS custom property
     scripts/wallpaper-service.js's applyGlobal() sets on document.body/
     documentElement (persistent across scene navigation, so it is already
     correct by the time this scene mounts -- no new JS needed here, and no
     second/duplicate wallpaper-selection logic). Being a live CSS variable,
     it also updates this backdrop immediately if the wallpaper changes
     while a conversation is already open, same as every other scene. */
  .chat::before{
    content:"";
    position:absolute;
    inset:-18px;
    z-index:0;

    background: var(--phone-wallpaper-image, url("assets/pictures/backscreen.jpg")) center/cover no-repeat;
    filter: blur(12px) saturate(0.55) brightness(0.62) contrast(1.06);
    transform: scale(1.10);
    opacity:1;
    pointer-events:none;
  }

  /* ✅ matte wash + subtle scanlines/grain */
  .chat::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;

    background:
      radial-gradient(circle at top, rgba(18,26,46,0.18), rgba(3,5,16,0.42)),
      linear-gradient(180deg,
        rgba(6,9,22,0.12) 0%,
        rgba(6,9,22,0.22) 45%,
        rgba(6,9,22,0.32) 100%
      ),
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.00) 0px,
        rgba(255,255,255,0.00) 3px,
        rgba(255,255,255,0.035) 4px
      ),
      repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.024) 0px,
        rgba(255,255,255,0.00) 2px,
        rgba(255,255,255,0.018) 4px
      );
    opacity:.95;
  }

  .chat > *{ position:relative; z-index:2; }

  /* ===== Effet glitch bandes noir & blanc (keep) ===== */
  .chat.glitch-bands::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:9;
    pointer-events:none;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.9) 0px,
        rgba(255,255,255,0.9) 4px,
        rgba(0,0,0,1)          4px,
        rgba(0,0,0,1)          8px
      );
    mix-blend-mode:normal;
    opacity:0;
    animation: conv-glitch-bands 1s steps(4,end) forwards;
  }
  @keyframes conv-glitch-bands{
    0%   { opacity:0; transform:translate(0,0); }
    10%  { opacity:1; transform:translate(-2px,1px); }
    40%  { opacity:1; transform:translate(2px,-1px); }
    80%  { opacity:1; transform:translate(-1px,2px); }
    100% { opacity:0; transform:translate(0,0); }
  }

  @keyframes conv-glitch-eject-jitter{
    0%   { transform:translate(0,0); filter:contrast(1) brightness(1); }
    25%  { transform:translate(-1px,1px); filter:contrast(1.18) brightness(1.06); }
    50%  { transform:translate(1px,-1px); filter:contrast(1.22) brightness(1.10); }
    75%  { transform:translate(-1px,0); filter:contrast(1.12) brightness(1.04); }
    100% { transform:translate(0,0); filter:contrast(1) brightness(1); }
  }
  @keyframes conv-glitch-eject-overlay{
    0%   { opacity:0; }
    15%  { opacity:.92; }
    55%  { opacity:.64; }
    100% { opacity:0; }
  }

  body.glitch-eject .chat,
  .chat.glitch-eject{
    animation: conv-glitch-eject-jitter .22s steps(2,end) 4;
  }

  body.glitch-eject .chat::after,
  .chat.glitch-eject::after{
    opacity:1;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.50) 0px,
        rgba(255,255,255,.50) 2px,
        rgba(0,0,0,.22) 2px,
        rgba(0,0,0,.22) 4px
      ),
      linear-gradient(135deg, rgba(112,220,255,.26), rgba(255,166,92,.20));
    animation: conv-glitch-eject-overlay .48s steps(4,end) infinite;
  }

  /* ===== HEADER ===== */
  .chat-header{
    position:relative;
    display:flex;
    align-items:center;
    min-height:56px;
    padding:8px 12px;

    background: rgba(6,7,10,0.70);
    border-bottom:1px solid rgba(245,248,255,0.14);

    box-shadow:
      inset 0 0 0 1px rgba(245,248,255,0.06),
      0 14px 30px rgba(0,0,0,0.75);
    overflow:hidden;
  }
  .chat-header::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.70;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.00) 0px,
        rgba(255,255,255,0.00) 3px,
        rgba(255,255,255,0.040) 4px
      ),
      repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.022) 0px,
        rgba(255,255,255,0.00) 2px,
        rgba(255,255,255,0.016) 4px
      );
  }

  .chat-header .avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#222 no-repeat;
    background-size:cover;
    background-position:50% var(--avatar-focus-y);

    border:2px solid rgba(245,248,255,0.22);
    box-shadow: 0 10px 22px rgba(0,0,0,0.55);

    flex:0 0 auto;
    cursor:pointer;

    transition: filter .18s ease, border-color .18s ease, box-shadow .18s ease;
    position:relative;
    z-index:1;
  }
  .chat-header .avatar:hover{
    filter:brightness(1.08);
    border-color: rgba(245,248,255,0.44);
    box-shadow:
      0 14px 28px rgba(0,0,0,0.70),
      0 0 14px rgba(245,248,255,0.10);
  }

  .chat-header .name{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-weight:900;
    letter-spacing:.10em;
    text-transform:uppercase;
    font-size:0.92rem;
    line-height:1.1;
    white-space:nowrap;
    color:rgba(240,245,255,0.92);
    text-shadow:0 2px 12px rgba(0,0,0,0.65);
    z-index:1;
    max-width:calc(100% - 152px); /* keep long names clear of avatar and playback */
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ✅ wrapper for Auto + Lock */
  .chat-header .tools{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:1;
  }

  /* ✅ Auto button (3 states) */
  .chat-header .autoplay{
    width:32px;
    height:32px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    justify-content:center;

    background: rgba(6,7,10,0.46);
    border:1px solid rgba(245,248,255,0.18);
    cursor:pointer;

    transition: filter .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    box-shadow: 0 10px 18px rgba(0,0,0,.50);
    position:relative;
    overflow:hidden;
    z-index:1;
    padding:0;
  }
  .chat-header .autoplay::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:inherit;
    padding:2px;
    background: rgba(245,248,255,0.26);
    opacity:0;
    filter: blur(10px);

    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    pointer-events:none;
    transition:opacity .18s ease, filter .18s ease;
  }
  .chat-header .autoplay svg{
    width:18px;
    height:18px;
    fill:rgba(240,245,255,0.70); /* OFF = dim */
    opacity:.75;
    transition: fill .18s ease, opacity .18s ease, transform .18s ease;
    position:relative;
    z-index:1;
  }
  .chat-header .autoplay:hover{
    filter:brightness(1.08);
    background: rgba(8,10,14,0.60);
    border-color: rgba(245,248,255,0.44);
    box-shadow:
      0 12px 24px rgba(0,0,0,0.70),
      0 0 14px rgba(245,248,255,0.10);
  }
  .chat-header .autoplay:hover::after{
    opacity:1;
    filter: blur(12px);
  }

  /* State 1: amber glow */
  .chat-header .autoplay[data-auto="1"]{
    background: rgba(48,32,4,0.62);
    border-color: rgba(255,208,84,0.70);
    box-shadow:
      0 12px 26px rgba(0,0,0,0.76),
      0 0 16px rgba(255,198,74,0.30);
  }
  .chat-header .autoplay[data-auto="1"]::after{
    background: rgba(255,205,88,0.66);
    opacity:1;
    filter: blur(12px);
  }
  .chat-header .autoplay[data-auto="1"] svg{
    fill:rgba(255,220,118,0.98);
    opacity:1;
  }

  /* State 2: green glow */
  .chat-header .autoplay[data-auto="2"]{
    background: rgba(5,38,24,0.64);
    border-color: rgba(102,244,170,0.76);
    box-shadow:
      0 12px 26px rgba(0,0,0,0.78),
      0 0 16px rgba(89,236,162,0.34);
  }
  .chat-header .autoplay[data-auto="2"]::after{
    background: rgba(82,232,156,0.68);
    opacity:1;
    filter: blur(12px);
  }
  .chat-header .autoplay[data-auto="2"] svg{
    fill:rgba(150,255,210,0.98);
    opacity:1;
    transform:scale(1.02);
  }

  /* Keep desktop visuals compact; enlarge touch targets only on mobile/coarse pointers. */
  @media (pointer: coarse){
    .chat-header .autoplay{
      min-width:44px;
      min-height:44px;
      width:44px;
      height:44px;
    }

    .chat-header .autoplay svg{
      width:18px;
      height:18px;
    }
  }

  /* ===== Zone messages ===== */
  .chat-body{
    /* ✅ bottom space so choices never get hidden by the phone nav */
    padding:12px 12px calc(16px + var(--safe-bottom));
    /* This is the 1fr row of .chat's grid. Without min-height:0 the grid
       item's automatic minimum is its full transcript height, so the pane
       grows thousands of pixels behind .chat{overflow:hidden} and never
       becomes a real scroll container. Long-story choices then render far
       below the viewport and cannot receive player input. */
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;

    scrollbar-width:none;
    overflow-x:hidden;
  }
  .chat-body::-webkit-scrollbar{ width:0; height:0; }

  .bubble{
    display:inline-block;
    width:fit-content;
    max-width:78%;
    padding:10px 14px;
    border-radius:18px;
    font-size:1em;
    line-height:1.5 !important; /* preserve reading space after text-size scaling */
    word-wrap:break-word;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
    box-shadow:0 10px 24px rgba(0,0,0,0.6);
  }
  @keyframes convBubbleEnter{
    from{opacity:0;transform:translateY(4px)}
    to{opacity:1;transform:translateY(0)}
  }
  .chat-body > .bubble:where(:not(.note):not(.player-thought):last-child){
    animation:convBubbleEnter .18s ease-out;
  }
  html.lite-effects .chat-body > .bubble{animation:none}
  @media (prefers-reduced-motion:reduce){
    .chat-body > .bubble{animation:none}
  }
  .bubble[dir="rtl"],
  .choice[dir="rtl"],
  .choice-prompt-card[dir="rtl"]{
    direction:rtl;
    text-align:right;
    unicode-bidi:plaintext;
  }

  /* contact */
  .bubble-lana{
    align-self:flex-start;
    margin-right:auto;
    background:
      radial-gradient(circle at top left, rgba(112,220,255,0.10), transparent 60%),
      rgba(6,7,10,0.62);
    border:1px solid rgba(245,248,255,0.18);
    border-bottom-left-radius:6px;
    text-align:left;
    color:rgba(240,245,255,0.92);
  }

  /* player */
  .bubble-player{
    align-self:flex-end;
    margin-left:auto;
    background: linear-gradient(
      145deg,
      #4f86d6,
      #2f66b3
    );
    background-blend-mode: overlay;
    border:1px solid rgba(120, 190, 255, 0.35);
    border-bottom-right-radius:6px;
    text-align:left;
    color:rgba(245, 250, 255, 0.96);
    font-weight:500;
    box-shadow:
      0 4px 14px rgba(0, 0, 0, 0.45),
      inset 0 0 12px rgba(120, 190, 255, 0.18);
    filter:saturate(0.96);
  }
  .bubble-player:hover{
    filter:brightness(1.02) saturate(0.98);
  }
.bubble-player:active{
    filter:brightness(0.98);
  }

  .message-link{
    display:inline-flex;
    align-items:center;
    margin-top:8px;
    padding:6px 10px;
    border-radius:12px;
    border:1px solid rgba(245,248,255,0.28);
    background:rgba(6,7,10,0.46);
    color:rgba(112,220,255,0.96);
    text-decoration:underline;
    text-underline-offset:2px;
    font-size:0.8rem;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    transition:filter .18s ease, border-color .18s ease, background .18s ease, color .18s ease;
  }
  .message-link:hover{
    filter:brightness(1.08);
    border-color:rgba(245,248,255,0.5);
    background:rgba(8,10,14,0.62);
  }
  .message-link[disabled],
  .message-link.is-disabled{
    cursor:default;
    pointer-events:none;
    opacity:.72;
    color:rgba(240,245,255,0.72);
    text-decoration:none;
  }

  .bubble-photo img{
    display:block;
    width:220px;
    max-width:70vw;
    aspect-ratio:3 / 4;
    height:auto;
    object-fit:cover;
    border-radius:14px;
    cursor:pointer;
    background:#020617;

    border:1px solid rgba(245,248,255,0.18);
    box-shadow:0 14px 30px rgba(0,0,0,0.85);

    transition: filter .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .bubble-photo img:hover{
    filter:brightness(1.06);
    border-color: rgba(245,248,255,0.44);
    box-shadow:
      0 18px 38px rgba(0,0,0,0.92),
      0 0 16px rgba(245,248,255,0.10);
  }

  /* ===== Bottom hint bar ===== */
  .chat-hintbar{
    font-size:0.8em;
    color:var(--muted);
    opacity:.9;
    display:flex;
    align-items:center;
    justify-content:center;

    border-top:1px solid rgba(245,248,255,0.10);
    background: rgba(6,7,10,0.70);

    transition:opacity .25s ease, transform .25s ease;
    position:relative;
    overflow:hidden;
    user-select:none;
  }
  .chat-hintbar::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.55;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.00) 0px,
        rgba(255,255,255,0.00) 3px,
        rgba(255,255,255,0.035) 4px
      ),
      repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.020) 0px,
        rgba(255,255,255,0.00) 2px,
        rgba(255,255,255,0.016) 4px
      );
  }
  .chat-hintbar.hide{
    opacity:0;
    transform:translateY(4px);
    pointer-events:none;
  }

  /* =========================================================
     ✅ Center hint overlay
     ========================================================= */
  #conv-hint{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:60;

    min-width:260px;
    max-width:min(520px, calc(100vw - 48px));
    padding:16px 18px;

    border-radius:18px;
    background: rgba(6,7,10,0.55);
    border:1px solid rgba(245,248,255,0.20);

    box-shadow:
      inset 0 0 0 1px rgba(245,248,255,0.08),
      0 22px 64px rgba(0,0,0,0.80),
      0 0 18px rgba(245,248,255,0.10);

    color:rgba(240,245,255,0.92);
    text-align:center;

    pointer-events:none;

    opacity:0;
    transition:opacity .18s ease, transform .18s ease;
  }

  #conv-hint::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    opacity:.70;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.00) 0px,
        rgba(255,255,255,0.00) 3px,
        rgba(255,255,255,0.045) 4px
      ),
      repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.030) 0px,
        rgba(255,255,255,0.00) 2px,
        rgba(255,255,255,0.022) 4px
      ),
      radial-gradient(circle at 18% 0%,
        rgba(112,220,255,0.10),
        rgba(0,0,0,0.00) 62%
      ),
      radial-gradient(circle at 90% 95%,
        rgba(255,166,92,0.06),
        rgba(0,0,0,0.00) 62%
      );
  }
  #conv-hint .txt{
    position:relative;
    z-index:1;
    font-weight:900;
    letter-spacing:.2px;
    text-shadow:0 2px 12px rgba(0,0,0,0.65);
  }

  #conv-hint.hide{
    opacity:0;
    transform:translate(-50%,-50%) translateY(4px);
  }
  #conv-hint.show{
    opacity:1;
    transform:translate(-50%,-50%);
  }
  /* ✅ points reward look (optional) */
  #conv-hint.reward .txt{
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* =========================================
     ✅ Floating route points feedback (NEW)
     - no box/frame
     - bottom-right above player choices
     - longer duration
     ========================================= */
  .route-points{
    position:fixed;
    right:22px;
    bottom: calc(var(--safe-bottom) + 22px);
    z-index:10000;

    font-weight:900;
    font-size:15px;
    letter-spacing:.14em;
    text-transform:uppercase;

    opacity:0;
    transform: translateY(12px) scale(.96);
    animation: routePointsFloat 1.85s ease-out forwards;

    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
  }

  /* color by path */
  .route-points[data-path="ntr"]{
    color:#ff4b4b;
    text-shadow: 0 0 12px rgba(255,75,75,.45);
  }
  .route-points[data-path="nts"]{
    color:#4bb3ff;
    text-shadow: 0 0 12px rgba(75,179,255,.45);
  }
  .route-points[data-path="love"]{
    color:#ff7ccf;
    text-shadow: 0 0 12px rgba(255,124,207,.45);
  }

  @keyframes routePointsFloat{
    0%   { opacity:0; transform: translateY(14px) scale(.95); }
    18%  { opacity:1; transform: translateY(0) scale(1); }
    72%  { opacity:1; }
    100% { opacity:0; transform: translateY(-20px) scale(1.04); }
  }

  /* ===== Photo viewer ===== */
  .photo-viewer{
    position:fixed;
    inset:0;
    z-index:999;
    background:rgba(0,0,0,.9);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease-out;
  }
  .photo-viewer.show{ opacity:1; pointer-events:auto; }
  .photo-viewer img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:0;
  }
  .photo-viewer-close{
    position:absolute;
    top:calc(var(--status-h) + 8px);
    right:16px;
    font-size:26px;
    cursor:pointer;
    color:var(--fg);
    text-shadow:0 0 12px rgba(0,0,0,.8);
    user-select:none;
  }

  /* ===== Avatar viewer ===== */
  .avatar-viewer{
    position:fixed;
    inset:0;
    z-index:1001;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease-out;
  }
  .avatar-viewer.show{ opacity:1; pointer-events:auto; }
  .avatar-viewer-bubble{
    width:min(72vw, 320px, calc(100vh - var(--nav-h) - var(--status-h) - 24px));
    aspect-ratio:1 / 1;
    border-radius:999px;
    background:rgba(12,18,36,.95);
    border:3px solid rgba(245,248,255,0.22);
    box-shadow:
      0 18px 50px rgba(0,0,0,.85),
      0 0 0 6px rgba(20,30,60,.45);

  /* ================================
     RENAME OVERLAY
     ✅ FIX: add middle image frame + centered title + remove subtitle
  ================================ */
  .rename-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    background: transparent !important;  /* enlève le voile noir */
    pointer-events:auto;
  }
  .rename-overlay.show{ display:flex; }

  /* ✅ NO blurred image behind */
  .rename-bg{
    display:none !important;
  }
  .rename-bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(60% 60% at 50% 35%, rgba(0,0,0,0.10), rgba(0,0,0,0.80)),
      linear-gradient(to bottom, rgba(0,0,0,0.20), rgba(0,0,0,0.75));
  }

  .rename-card{
    position:relative;
    width:min(520px, calc(100vw - 24px));
    height:auto;
    max-height:calc(100% - 24px);
    border:1px solid var(--edge-strong, rgba(255,255,255,0.35));
    background: rgba(6,7,10,0.38);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    overflow-x:hidden;
    overflow-y:auto;

    /* ✅ ensure card is above bg */
    z-index:1;
  }

  .rename-top{
    position:relative;
    padding:18px 16px 12px 16px;
    border-bottom:1px solid var(--line, rgba(255,255,255,0.14));
    text-align:center; /* ✅ center title */
  }

  .rename-title{
    font-weight:800;
    letter-spacing:0.12em;
    font-size:0.95rem;
    opacity:0.95;
    width:100%;
  }

  /* ✅ subtitle removed */
  .rename-sub{ display:none !important; }

  /* Canonical status/relationship label (e.g. "GIRLFRIEND") -- a SEPARATE
     line from the editable name input below. Never player-editable, never
     written into the saved name. See scripts/contact-status.js. */
  .rename-status{
    font-weight:700;
    letter-spacing:0.16em;
    font-size:0.72rem;
    text-transform:uppercase;
    opacity:0.62;
    width:100%;
    margin-top:2px;
  }
  .rename-status:empty{ display:none; }

  /* ✅ middle image frame (portrait preview without aggressive crop) */
  .rename-preview{
    margin:12px auto 10px auto;
    width:min(420px, calc(100% - 28px), 39vh);
    aspect-ratio: 3 / 4;
    border-radius:16px;
    overflow:hidden;

    border:1px solid rgba(245,248,255,0.20);
    background-color: transparent !important;
    box-shadow:none;
    position:relative;

    /* ✅ hard-kill any accidental overlay/masking */
    -webkit-mask-image: none !important;
            mask-image: none !important;
    isolation:isolate;
  }

  /* ✅ REAL image inside */
  #rename-preview-img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    object-position:50% 50%;
    background-repeat:no-repeat;
    background-size:cover;
    background-position:50% 35%;
    background-color: rgba(6,7,10,0.62);

    /* ✅ FIX 2: remove the bottom darkening (no mask/filter/overlay) */
    filter:none !important;
    -webkit-filter:none !important;
    opacity:1 !important;
    -webkit-mask-image:none !important;
            mask-image:none !important;
    mix-blend-mode:normal !important;
    background-color: transparent !important;
  }

  /* ✅ ensure NO overlay on top of the image */
  .rename-preview::before,
  .rename-preview::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0 !important;
    background:none !important;
  }

  /* ✅ old background-crop kept (harmless) */
  #rename-preview{
    background-repeat:no-repeat;
    background-size:cover;
    background-position:50% 34%;
    background-color: rgba(6,7,10,0.62);
  }

  .rename-bottom{
    position:relative;
    padding:14px 14px 16px 14px;
  }

  .rename-row{
    display:flex;
    gap:10px;
    align-items:center;
  }

  .rename-row.secondary{
    margin-top:10px;
    justify-content:flex-end;
  }

  .rename-input{
    flex:1;
    min-width:0;
    height:52px;
    padding:0 12px;
    border-radius:12px;
    border:1px solid var(--edge, rgba(255,255,255,0.20));

  .rename-btn{
    height:52px;
    padding:0 18px;
    border-radius:12px;

  .rename-btn.primary{

  }

  .rename-btn.primary:hover,
  .rename-btn.primary:focus-visible{
    background: var(--btn-green-bg-hover, rgba(78,214,145,0.22));
    border-color: var(--btn-green-border-hover, rgba(78,214,145,0.58));
  }
  @media (max-width:380px){
    .rename-row:not(.secondary){flex-wrap:wrap}
    .rename-input{flex-basis:100%;width:100%}
    .rename-row .primary{width:100%}
  }

  /* REMOVE dark veil on rename image (force clean colors) */
  .rename-card,
  .rename-preview,
  #rename-preview,
  #rename-preview-img{
    filter:none !important;
    -webkit-filter:none !important;
  }

  /* kill any overlay layers that could darken the image */
  .rename-card::before,
  .rename-card::after,
  .rename-preview::before,
  .rename-preview::after,
  #rename-preview::before,
  #rename-preview::after,
  .rename-bg::before,
  .rename-bg::after{
    opacity:0 !important;
    background:none !important;
  }

<script>
(function () {
  // =========================================================
  // Cleanup guard
  // =========================================================
  if (window.__conv_cleanup) {
    try { window.__conv_cleanup(); } catch {}
  }
  window.__conv_cleanup = null;

  // =========================================================
  // Elements / globals
  // =========================================================
  const bodyEl = document.getElementById("conv-messages");
  const hintBarEl = document.getElementById("conv-hintbar");

  const centerHintEl = document.getElementById("conv-hint");
  const centerHintTextEl = document.getElementById("conv-hint-text");
  const appDownloadOverlayEl = document.getElementById("app-download-overlay");
  const appDownloadLabelEl = document.getElementById("app-download-label");
  const appDownloadFillEl = document.getElementById("app-download-fill");
  const appDownloadPercentEl = document.getElementById("app-download-percent");

const Game = (window.Game ||= {});

// ===============================================
// ✅ Templating helper (single source of truth)
// - Uses Game.tpl() if present
// - Fallback: replaces {{name:key}} from contact_names_v1 / player_identity_v1
// ===============================================
function tplText(raw){
  let s = String(raw ?? "");

  // 1) baseline templating first
  try {
    if (typeof Game.tpl === "function") s = Game.tpl(s);
  } catch {}

  // 2) fallback replacement (supports contact_names_v1 + player_identity_v1 any shape)
  try {
    s = s.replace(/\{\{\s*name:([^}]+)\s*\}\}/g, (_, keyRaw) => {
      const key = String(keyRaw || "").trim().toLowerCase();
      if (!key) return "";
      const resolver = (typeof Game.resolveDisplayName === "function") ? Game.resolveDisplayName : resolveDisplayName;
      return resolver(key, "");
    });
  } catch {}

  return s;
}


  const FROM_SAVE = !!Game._justLoadedFromSave;
  const FROM_SAVE_CONV_RESTART = !!Game?.lastQuery?.__restartConversationStart;
  Game._justLoadedFromSave = false;
// ================================ 
// Rename overlay (blocks auto-advance)
// ================================
const renameOverlay  = document.getElementById("rename-overlay");
const renameBg       = document.getElementById("rename-bg");
const renamePreview  = document.getElementById("rename-preview"); // ✅ NEW (middle frame)
const renameInput    = document.getElementById("rename-input");
const renameSave     = document.getElementById("rename-save");
const renameSkip     = document.getElementById("rename-skip");
const renamePreviewImg = document.getElementById("rename-preview-img");
const renameStatusEl = document.getElementById("rename-status");

let renameResolver = null;

// Contact display identity = customName (this overlay's editable input,
// player-chosen) + a SEPARATE canonical statusLabel (renameStatusEl,
// code-owned via window.ContactStatus, never editable, never folded back
// into the saved name). Root cause this fixes: story JSON used to author
// defaultName as a single concatenated string ("Lena (girlfriend)"), which
// this overlay's input then displayed AND saved as-is -- see
// scripts/contact-status.js for the full history and the save migration
// that repairs already-written saves.
function openRenameOverlay({ contactId, defaultName, image, onceKey, status }){
  if (!renameOverlay || !renameInput) return Promise.resolve(false);

  // ✅ IMPORTANT:
  // - contactId passed by JSON can be wrong (or be a “logical key”)
  // - the conversation MUST stay stable on CONTACT_ID
  // So: we allow saving name under the requested key, but we ALWAYS sync the current thread (CONTACT_ID).
  const requestedKey = String(contactId || "").trim().toLowerCase();
  const threadId = String(CONTACT_ID || "").trim().toLowerCase();
  const statusId = requestedKey || threadId;

  // Defensive strip: if defaultName ever again arrives as a legacy
  // concatenated "Name (Status)" string (e.g. an old JSON authoring
  // mistake), never show/save the status half as part of the name --
  // this is the exact bug scripts/contact-status.js's migration repairs
  // for already-written saves; this is the same guard at the point the
  // value would otherwise be freshly (re)written.
  const rawDefaultName = String(defaultName || "").trim();
  const strippedDefaultName = window.ContactStatus?.stripLegacyStatusSuffix?.(statusId, rawDefaultName) || "";
  const def = strippedDefaultName || rawDefaultName || "Unknown";

  // Canonical, non-editable status/relationship label -- a SEPARATE field
  // from `def` (the editable name). An explicit opts.status wins; otherwise
  // resolve it from the canonical registry by id.
  const statusText = String(status || window.ContactStatus?.getStatusLabel?.(statusId) || "").trim();
  if (renameStatusEl) renameStatusEl.textContent = statusText ? statusText.toUpperCase() : "";

  const rawImg = String(image || "").trim();
  let img = rawImg;
  if (threadId === "mason" && rawImg) {
    try {
      img = /(?:^|\/)assets\/avatars\/mason(?:_female)?\.jpg(?:[?#].*)?$/i.test(rawImg.replace(/\\/g, "/"))
        ? (window.MasonVariantService?.resolveAvatar?.("mason", rawImg) || rawImg)
        : (window.MasonVariantService?.resolveImage?.(rawImg, "mason") || rawImg);
    } catch { img = rawImg; }
  }

  Game._renameOverlayOpen = true;

  // Canonical/persisted interaction boundary: this overlay's answer is a
  // pure renderer-side effect (no story-interpreter step to pause on --
  // the `image` step it followed already committed), so without this the
  // ONLY record that the player still owes an answer is Game._renameOverlayOpen,
  // a plain in-memory flag on the persistent Game singleton. A scene
  // teardown (navigating Home, etc.) destroys this overlay's DOM/closures
  // but never touched that flag, which (a) permanently soft-locked every
  // future conversation's tap handling (advanceClickOrSpace/advanceOnce/
  // isChoiceMoment all treat a stuck-true flag as "still blocked") and (b)
  // gave the player no way to ever come back and actually answer. Persist
  // enough to reconstruct the same overlay on remount/Save-Load/restart --
  // see the mount-time check in loadStory() and Game.clearPendingInteraction
  // in closeWith() below.
  try {
    window.Game?.writePendingInteraction?.({
      kind: "rename",
      contactId: threadId,
      requestedKey: requestedKey || threadId,
      defaultName: def,
      status: statusText,
      image: img,
      onceKey: String(onceKey || ""),
      createdAt: Date.now()
    });
  } catch {}

  if (renameBg) {
    renameBg.style.backgroundImage = img ? `url("${img}")` : "none";
  }
  if (renamePreview) {
    renamePreview.style.backgroundImage = img ? `url("${img}")` : "none";
  }

  if (renamePreviewImg) {
    if (img && window.ProtectedMediaResolver?.applyImage) {
      window.ProtectedMediaResolver.applyImage(renamePreviewImg, img, { assetType: "rename_preview", surface: "conversation_rename", contactId: threadId }).catch(() => {});
    } else renamePreviewImg.src = img || "";
    renamePreviewImg.style.backgroundImage = img ? `url("${img}")` : "none";
    renamePreviewImg.style.display = img ? "block" : "none";
  }

  // ✅ prefill: player_identity_v1 (canonical write authority -- same store
  // scenes/settings.html's contact editor writes) FIRST, contact_names_v1
  // (legacy/read-only-going-forward, see closeWith() below) as fallback,
  // then default. This MUST match resolveDisplayName()'s own precedence
  // (used everywhere else a contact's name is displayed -- header,
  // {{name:x}}, Messages) so this prefill can never show a different name
  // than what the rest of the app is already displaying, regardless of
  // which screen (Settings vs. this overlay) the player used last.
  const identityName =
    (typeof Game.getIdentity === "function" ? String(Game.getIdentity(threadId) || "").trim() : "") ||
    (requestedKey ? (typeof Game.getIdentity === "function" ? String(Game.getIdentity(requestedKey) || "").trim() : "") : "");
  const namesMap = readContactNames();
  const savedThread = namesMap?.[threadId];
  const savedRequested = requestedKey ? namesMap?.[requestedKey] : null;

  renameInput.value =
    identityName ? identityName
    : (typeof savedThread === "string" && savedThread.trim()) ? savedThread.trim()
    : (typeof savedRequested === "string" && savedRequested.trim()) ? savedRequested.trim()
    : def;

  renameOverlay.classList.add("show");
  renameOverlay.setAttribute("aria-hidden", "false");

  setTimeout(() => {
    try { renameInput.focus(); renameInput.select(); } catch {}
  }, 50);

  return new Promise((resolve) => {
    renameResolver = resolve;

    function closeWith(valueOrNull){
      const finalName =
        (typeof valueOrNull === "string" && String(valueOrNull).trim())
          ? String(valueOrNull).trim()
          : def;

      // ✅ 1) Canonical write authority: player_identity_v1, the SAME store
      // scenes/settings.html's contact editor writes (via Game.setIdentity).
      // Before this fix, this overlay only ever wrote contact_names_v1,
      // while resolveDisplayName()/Game.tpl()/the header all read
      // player_identity_v1 first -- meaning a rename made HERE could be
      // invisible to Settings' own contact list, and a later divergence
      // between the two stores made this overlay's own prefill (above) show
      // a different name than the rest of the app. Writing the canonical
      // store from both entry points closes that gap going forward without
      // touching any already-saved data.
      try {
        if (typeof Game.setIdentity === "function") {
          Game.setIdentity(threadId, finalName);
          if (requestedKey && requestedKey !== threadId) Game.setIdentity(requestedKey, finalName);
        }
      } catch {}

      // ✅ 2) Legacy mirror (contact_names_v1) -- kept for backward
      // compatibility with any older code path still reading it directly,
      // and as resolveDisplayName()'s documented fallback. Never the
      // authority once (1) above succeeds.
      setContactName(threadId, finalName);
      if (requestedKey && requestedKey !== threadId) {
        setContactName(requestedKey, finalName);
      }

      // ✅ 3) Sync conversations store under CONTACT_ID ONLY (never under requestedKey)
      try {
        const store = readConversationStore();
        if (store?.[threadId]) {
          store[threadId].name = finalName;
          writeConversationStore(store);

          // ✅ learn alias for the thread id (THIS was the bug)
          learnAlias(threadId, finalName);

          window.dispatchEvent(new Event("game:conversations-updated"));
        }

        const nameEl = document.getElementById("conv-name");
        if (nameEl) nameEl.textContent = finalName;
      } catch {}

      Game._renameOverlayOpen = false;
      try { window.Game?.clearPendingInteraction?.(); } catch {}

      renameOverlay.classList.remove("show");
      renameOverlay.setAttribute("aria-hidden", "true");

      renameSave?.removeEventListener("click", onSave);
      renameSkip?.removeEventListener("click", onSkip);
      window.removeEventListener("keydown", onKey, true);

      renameResolver = null;
      resolve(true);
    }

    function onSave(){
      try { window.Game?.audio?.play?.("ui_confirm", { category: "sfx" }); } catch {}
      const v = String(renameInput.value || "").trim();
      closeWith(v || def);
    }

    function onSkip(){
      try { window.Game?.audio?.play?.("ui_cancel", { category: "sfx" }); } catch {}
      closeWith(def);
    }

    function onKey(e){
      if (e.target && e.target.closest && e.target.closest("input, textarea, [contenteditable]")) {
        if (e.key === "Enter") { e.preventDefault(); onSave(); }
        return;
      }
      if (e.key === "Escape") { e.preventDefault(); onSkip(); }
      if (e.key === "Enter")  { e.preventDefault(); onSave(); }
    }

    renameSave?.removeEventListener("click", onSave);
    renameSkip?.removeEventListener("click", onSkip);
    renameSave?.addEventListener("click", onSave, { once: true });
    renameSkip?.addEventListener("click", onSkip, { once: true });
    // Registered via bindOn (not a raw window.addEventListener) so that
    // leaving the scene WITHOUT resolving the overlay (Home pressed while
    // it's open) still gets this window-scoped listener removed by the
    // normal unbindAll() teardown -- window is the persistent top-level
    // document, so anything attached to it directly outlives the scene
    // that opened it unless something explicit tears it down. closeWith()
    // below still also explicitly removes it on the normal resolve path;
    // calling removeEventListener twice for the same fn is a harmless no-op.
    try { bindOn(window, "keydown", onKey, true); } catch { window.addEventListener("keydown", onKey, true); }
  });
}


// expose for JSON-driven calls
Game.promptRename = async function({ key, defaultName, image, onceKey, status }){
  // ✅ If key is missing/odd, default to the current conversation CONTACT_ID
  const raw = String(key || "").trim().toLowerCase();
  const cid = raw ? raw : String(CONTACT_ID || "").trim().toLowerCase();
  if (!cid) return false;

  return await openRenameOverlay({ contactId: cid, defaultName, image, onceKey, status });
};


  // =========================================================
  // Utils
  // =========================================================
  const canonicalId = (raw) =>
    String(raw || "").trim().toLowerCase().replace(/\s+/g, "_");

  function safeJsonParse(raw, fallback) {
    try { return JSON.parse(raw); } catch { return fallback; }
  }
  function safeGetLS(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function safeSetLS(k, v) { try { localStorage.setItem(k, v); } catch {} }
  function safeRemoveLS(k) { try { return localStorage.removeItem(k); } catch {} }
  const SELECTABLE_CHARACTER_ID_SET = new Set(["evelyn", "hailey", "mason", "lena"]);

  function isCharacterStorageTruthyLocal(rawValue) {
    const v = canonicalId(rawValue);
    return v === "1" || v === "true" || v === "on" || v === "yes" || v === "active";
  }

  function isSelectionMapTruthyLocal(rawValue) {
    if (rawValue === true) return true;
    if (rawValue === false) return false;
    if (typeof rawValue === "number") return rawValue > 0;
    return isCharacterStorageTruthyLocal(rawValue);
  }

  function addSelectedIdsFromValueLocal(rawValue, selectedSet) {
    if (!selectedSet || typeof selectedSet.add !== "function") return false;
    const parsed = (typeof rawValue === "string") ? safeJsonParse(rawValue, null) : rawValue;
    let hasData = false;

    if (Array.isArray(parsed)) {
      hasData = true;
      for (const raw of parsed) {
        const id = canonicalId(raw);
        if (!id || !SELECTABLE_CHARACTER_ID_SET.has(id)) continue;
        selectedSet.add(id);
      }
      return hasData;
    }

    if (parsed && typeof parsed === "object") {
      if (Array.isArray(parsed.selected)) {
        hasData = true;
        for (const raw of parsed.selected) {
          const id = canonicalId(raw);
          if (!id || !SELECTABLE_CHARACTER_ID_SET.has(id)) continue;
          selectedSet.add(id);
        }
      }

      for (const [rawKey, rawMapValue] of Object.entries(parsed)) {
        const id = canonicalId(rawKey);
        if (!id || !SELECTABLE_CHARACTER_ID_SET.has(id)) continue;
        hasData = true;
        if (isSelectionMapTruthyLocal(rawMapValue)) selectedSet.add(id);
      }
    }

    return hasData;
  }

  function inferCharacterActiveFromSelectionLocal(rawId) {
    const cid = canonicalId(rawId);
    if (!cid || !SELECTABLE_CHARACTER_ID_SET.has(cid)) return null;

    const selectedSet = new Set();
    let hasData = false;

    hasData = addSelectedIdsFromValueLocal(safeGetLS("hak_targets_v1"), selectedSet) || hasData;
    hasData = addSelectedIdsFromValueLocal(safeGetLS("hak_watchlist_v1"), selectedSet) || hasData;
    hasData = addSelectedIdsFromValueLocal(safeGetLS("hak_watchlist_v1_selected"), selectedSet) || hasData;

    if (!hasData) return null;
    return selectedSet.has(cid);
  }

  function isCharacterActiveLocal(rawId) {
    const cid = canonicalId(rawId);
    if (!cid) return false;
    if (cid === "aiden") return true;
    try {
      const raw = localStorage.getItem("active_character:" + cid);
      if (raw == null) {
        const inferred = inferCharacterActiveFromSelectionLocal(cid);
        if (typeof inferred === "boolean") return inferred;
        return true;
      }
      return isCharacterStorageTruthyLocal(raw);
    } catch {
      return true;
    }
  }

  function shouldHideCharacterFromUIForConversation(rawId) {
    const cid = resolveContactId(rawId || "", "");
    if (!cid) return false;

  // that then silently vanishes on the next remount/save-load, which is a
  // worse player-facing symptom than not rendering it this pass. This used
  // to be gated to NPC-authored steps only ("player messages are not
  // migrated yet"), but StoryInterpreter's own message-step handler
  // (MESSAGE.has(type) in story-interpreter.js) already commits player-
  // authored "message" steps identically to NPC ones -- it does not check
  // `from`. Excluding player steps here didn't mean they went uncommitted;
  // it meant they went through the OLD legacy Game.notify(...) persistence
  // path below IN ADDITION TO the canonical commit that was already firing
  // through some other caller of this same seam (e.g. a paused-turn resume)
  // -- two independent commits of the same logical message, with two
  // different eventId schemes that could never dedupe against each other.
  // That is the real duplicate-message bug (a player line re-appearing
  // after a conversation remount), not something specific to this contact
  // or story.
  if (opts.persist && !hasCanonicalConversationEvent(step, who, rawText, step?.type === "hak_transcript" ? "hak_transcript" : "message")) {
    // StoryInterpreter (via the shared canonical-story-runtime singleton, the
    // SAME seam convo-runtime.js uses) is the sole semantic authority here --
    // not a second dispatcher. The narrow async boundary this requires (async
    // function addBubble, awaited by renderStep/showNext below) is real but
    // deliberately confined to this one commit-before-render point; the
    // render itself (bodyEl.appendChild below) still happens synchronously
    // once the awaited commit settles, preserving visual ordering.
    //
    // allowReclaim is deliberately NOT passed (stays false, the default):
    // ensureCanonicalStoryLease's reclaim path releases whatever OTHER
    // contact's story currently holds the lease and dispatches a fresh
    // START_STORY for this one -- which resets THAT OTHER story's cursor to
    // rootIndex 0. Reclaiming here would race a still-in-flight background
    // story for a different contact and corrupt its progress, trading a
    // rendering bug for a canonical-state corruption bug, which is worse.
    // Prefer the engine's own LIVE activeStoryPath over the localStorage-
    // cached STORY_KEY when the engine's current lease is unambiguously
    // for THIS scene's own contact -- found live (Feature 4 Day1-15 final
    // certification, Message cutover family, escalated by a real manually-
    // launched `npm restart` session): STORY_KEY can legitimately lag one
    // tick behind the canonical engine (e.g. a chain/continuation moved the
    // lease to a new story before this scene's own localStorage mirror
    // caught up), and ensureCanonicalStoryLease's exact-match fast path
    // requires byte-identical storyPath -- a stale STORY_KEY read fails
    // that match and (with allowReclaim deliberately false, see the
    // comment above) falls straight into LEASE_UNAVAILABLE for a request
    // that is, in fact, for the story this scene's own lease already
    // covers. Only trust engine state when its active contact IS this
    // scene's contact -- otherwise (a different contact's background story
    // genuinely holds the lease right now) keep reading STORY_KEY exactly
    // as before, preserving the existing multi-contact-safe behavior.
    const { exec, activeStoryPathForCatchup } = await commitCanonicalProgressionStepWithCatchup(step);
    // A replacement renderer owns presentation now. The old operation may
    // already be durable; retirement is cancellation, not a failed write.
    if (exec.cancelled) {
      releaseConversationRenderClaim(renderClaim, "reconciliation_owner_retired");
      return false;
    }
    const commitResult = exec.handled ? (exec.result || { ok: true }) : { ok: false, status: "blocked_terminal", reason: exec.reason };
    if (!commitResult.ok) {
      showStorageFullNoticeOnce(commitResult);
      try {
        console.error("[Feature4][text-message] canonical commit blocked " + JSON.stringify(buildBlockedCommitDiagnostics({
          status: commitResult.status, reason: commitResult.reason, code: commitResult.code || commitResult.error?.code,
          commandId: commitResult.commandId, eventId, canonicalEventId: step?.canonicalEventId, storyPath: activeStoryPathForCatchup, contactId: CONTACT_ID,
          sourceStepIndex: step?.sourceStepIndex, expectedRevision: commitResult.previousRevision,
          eventAlreadyExistsCanonically: hasCanonicalConversationEvent(step, who, rawText, step?.type === "hak_transcript" ? "hak_transcript" : "message"),
          eventHasRenderClaim: !!bubbleEventId && hasBubbleInDom(bubbleEventId),
          wasCatchUpOperation: false, initiator: "conversation.html:addBubble", text: rawText
        })));
      } catch {}
      // NPC-authored steps keep the original strict contract: never show
      // content the canonical engine didn't actually record, since that
      // content would silently vanish on the next remount/save-load.
      // Player-authored lines never had that contract before this same-seam
      // unification (they always rendered, historically via the separate
      // legacy Game.notify path) -- blocking their render on a lease/
      // admission conflict that has nothing to do with the player's own
      // action is a strictly worse regression (dropped dialogue) than an
      // occasional missed canonical commit for a line whose content is
      // fully deterministic from the story JSON regardless. Render it; the
      // dataset.eventId tag above still makes this exact-once at the DOM
      // level even without a canonical record backing it this pass.
      //
      // Explicit `return false` (not a bare `return`): this is the ONE path
      // where NOTHING was rendered for an NPC step whose canonical commit
      // did not happen. showNextInner's generic step-advance fallthrough
      // must see this and NOT move its local `index`/saveProgress() bookmark
      // past a step that was never actually committed -- otherwise the
      // local walker and the real canonical cursor permanently diverge from
      // this point on, and every later step this conversation tries to
      // commit fails the same way (measured live: a real `npm restart`
      // profile showed exactly this -- repeating "[Feature4][text-message]
      // canonical commit blocked" at ever-increasing sourceStepIndex values
      // while the canonical engine stayed parked behind, unable to ever
      // catch up, because nothing upstream of this function had ever told
      // the caller to stop advancing). Every other return in this function
      // means "nothing new to commit, but safe to advance" and stays a bare
      // `return` on purpose.
      if (!isPlayer) {
        releaseConversationRenderClaim(renderClaim, "canonical_commit_blocked");
        return false;
      }
    }
  }

  // A later hydration/reload superseded this asynchronous live operation.
  // Its claim belongs to the old generation and must never touch the new DOM.
  if (renderClaim && renderClaim.generation !== conversationRendererGeneration) {
    releaseConversationRenderClaim(renderClaim, "stale_renderer_generation");
    return;
  }

  // ✅ UI shows templated
  const finalText = conversationP2Measure("message.templating", () => tplText(text));

  const div = conversationP2Measure("message.dom_create", () => document.createElement("div"), { domElementsCreated: 1 });
  conversationP2Measure("message.dom_properties", () => { div.className = "bubble " + (who === "player" ? "bubble-player" : "bubble-lana"); div.textContent = finalText; });
  if (isPlayer && window.PlayerThoughts) applyPlayerThoughtPresentation(div, finalText, { ...step?.canonicalSourceStep, ...step, from: "player", text: rawText });

  const linkEl = conversationP2Measure("message.link", () => renderMessageLink({ link: linkData }));
  if (linkEl) conversationP2Measure("message.wrapper_append", () => div.appendChild(linkEl), { domAppends: 1 });

  conversationP2Measure("message.body_append", () => bodyEl.appendChild(div), { domAppends: 1 });
  conversationP2Measure("message.claim_complete", () => completeConversationRenderClaim(renderClaim, div));

  conversationP2Measure("message.scroll_schedule", () => scrollToBottom());

  if (!opts.silentLast) {
    notifyLastMessage(finalText);
    try { window.Game?.audio?.play?.(who === "player" ? "msg_send" : "msg_receive_in", { category: "sfx" }); } catch {}
  }

  if (opts.persist) {
    try {
      const nowTs = Date.now();
      const episodeId = currentEpisodeIdForWrite();

      if (isPlayer) {
        // The canonical commit above (now unconditional on isPlayer) already
        // persisted this message via installCanonicalMessageBridge's own
        // Game.Inbox.pushMessage reaction -- calling Game.notify a second
        // time here would be exactly the duplicate-commit bug this change
        // fixes. Only the bookkeeping the bridge doesn't already cover
        // (episode-boundary tracking, link-preview persistence) stays here.
        const conv = ensureConversationMeta(PROVIDED_NAME_AT_BOOT, PROVIDED_AVATAR_AT_BOOT, { metadataOnly: true });
        learnAlias(CONTACT_ID, conv.name || defaultNameFor(CONTACT_ID));
        stampLastPersistedMessageEpisode({ kind: "text", from: "player", text: rawText, at: nowTs, episodeId });
        if (linkData) persistMessageLinkToStore(rawText, "player", linkData);
      }
      // Both branches: the canonical commit already happened above, gating
      // whether this bubble rendered at all -- nothing further to persist
      // here, only the thread-history bookkeeping below.
    } catch {}
    enforceThreadHistoryLimit({ write: true, discardResult: true });
  }
  return div;
}

async function addHakTranscriptBubble(from, text, opts) {
  opts = opts || {};
  if (!text || !bodyEl) return;

  const step = (opts.step && typeof opts.step === "object") ? opts.step : null;
  const renderSource = String(opts.renderSource || (opts.persist ? "live_interactive" : "transcript_hydration"));
  const renderClaim = claimConversationRender(step, renderSource);
  if (!renderClaim && renderAliases(step).length) return;

  if (opts.persist && !hasCanonicalConversationEvent(step, from, text, "hak_transcript")) {
    const { exec } = await commitCanonicalProgressionStepWithCatchup(step);
    const commitResult = exec.handled ? (exec.result || { ok: true }) : { ok: false };
    if (!commitResult.ok) {
      releaseConversationRenderClaim(renderClaim, "canonical_commit_blocked");
      return false;
    }
  }

  if (renderClaim && renderClaim.generation !== conversationRendererGeneration) {
    releaseConversationRenderClaim(renderClaim, "stale_renderer_generation");
    return;
  }

  const speakerId = canonicalId(opts.speakerId || from || "");
  const node = document.createElement("section");
  node.className = "hak-transcript";
  node.dataset.kind = "hak_transcript";
  node.dataset.speaker = speakerId;
  node.dataset.from = speakerId;
  node.setAttribute("role", "group");
  const hakSpeakerName = speakerId === "player"
    ? (window.PlayerIdentity?.getName?.() || resolveDisplayName(speakerId))
    : resolveDisplayName(speakerId);
  const hakSourceText = (source) => window.Game?.i18n?.sourceText?.(source) || source;
  node.setAttribute("aria-label", hakSourceText("HAK audio capture — {speaker}").replace("{speaker}", hakSpeakerName));

  const head = document.createElement("div");
  head.className = "hak-transcript__head";
  const channel = document.createElement("span");
  channel.textContent = hakSourceText("HAK // AUDIO CAPTURE");
  const status = document.createElement("span");
  status.className = "hak-transcript__status";
  status.textContent = hakSourceText("● MONITORING");
  head.append(channel, status);
  const speaker = document.createElement("div");
  speaker.className = "hak-transcript__speaker";
  speaker.textContent = hakSpeakerName;
  const transcript = document.createElement("div");
  transcript.className = "hak-transcript__text";
  transcript.textContent = tplText(String(text || ""));
  node.append(head, speaker, transcript);
  bodyEl.appendChild(node);
  completeConversationRenderClaim(renderClaim, node);
  scrollToBottom();
  return node;
}
function invalidateConversationRendererGeneration(reason = "conversation_unmount") {

  renderedConversationEventIds.clear();

}

async function addPhotoBubble(from, url, opts) {
  opts = opts || {};
  if (!url || !bodyEl) return;

  const who = (from === "player") ? "player" : CONTACT_ID;
  const step = (opts.step && typeof opts.step === "object") ? opts.step : null;
  const isPlayer = (who === "player");
  const rawSrc = String(url || "");
  let src = rawSrc;
  if (CONTACT_ID === "mason") {
    try {
      src = /(?:^|\/)assets\/avatars\/mason(?:_female)?\.jpg(?:[?#].*)?$/i.test(rawSrc.replace(/\\/g, "/"))
        ? (window.MasonVariantService?.resolveAvatar?.("mason", rawSrc) || rawSrc)
        : (window.MasonVariantService?.resolveImage?.(rawSrc, "mason") || rawSrc);
    } catch { src = rawSrc; }
  }
  const eventId = String(step?.eventId || step?.__eventId || "").trim();
  const renderSource = String(opts.renderSource || (opts.persist ? "live_interactive" : "transcript_hydration"));
  const renderClaim = claimConversationRender(step, renderSource);
  if (!renderClaim && renderAliases(step).length) return;

  // Commit-failure contract (same as addBubble, and same fix: StoryInterpreter
  // commits player-authored image/photo steps identically to NPC ones, so
  // excluding isPlayer here just meant a second, independently-keyed commit
  // via the legacy Game.notify path below -- the same duplicate-message bug
  // as addBubble). Same StoryInterpreter seam and narrow async boundary --
  // and, since 2026-08-19 (Aiden remount stall fix), the SAME shared
  // commitCanonicalProgressionStepWithCatchup() helper addBubble uses, so
  // image/media steps get the identical live-storyPath preference and
  // backpressure-retry contract instead of a bare, non-retried, possibly
  // stale-STORY_KEY-keyed call. See that helper's header comment for the
  // full defect this fixes (a permanent, silent post-remount stall).
  if (opts.persist && !hasCanonicalConversationEvent(step, who, "", "image", src)) {
    // No allowReclaim, and player steps render regardless of commit
    // failure -- see addBubble for the full explanation of both.
    const { exec } = await commitCanonicalProgressionStepWithCatchup(step);
    if (exec.cancelled) {
      releaseConversationRenderClaim(renderClaim, "reconciliation_owner_retired");
      return false;
    }
    const commitResult = exec.handled ? (exec.result || { ok: true }) : { ok: false, status: "blocked_terminal", reason: exec.reason };
    if (!commitResult.ok) {
      try {
        console.error("[Feature4][image-message] canonical commit blocked", { contactId: CONTACT_ID, eventId, src, status: commitResult.status, reason: commitResult.reason, isPlayer, rendering: isPlayer });
      } catch {}
      // Explicit `return false` -- same contract as addBubble's identical
      // guard: nothing was rendered for this NPC step, so the caller
      // (renderStep -> showNextInner) must not advance its local `index`
      // past a step that was never actually canonically committed. See
      // addBubble's own comment on this exact return for the full defect
      // class this prevents.
      if (!isPlayer) {
        releaseConversationRenderClaim(renderClaim, "canonical_commit_blocked");
        return false;
      }
    }
  }

  if (renderClaim && renderClaim.generation !== conversationRendererGeneration) {
    releaseConversationRenderClaim(renderClaim, "stale_renderer_generation");
    return;
  }

  const wrap = document.createElement("div");
  wrap.className =
    "bubble " + (who === "player" ? "bubble-player" : "bubble-lana") + " bubble-photo";

  const mount = document.createElement("div");
  mount.className = "mediaThumbMount";
  mount.dataset.mediaSrc = src;
  mount.addEventListener("click", (e) => {
    e.stopPropagation();
    openViewer(src);
  });
  if (window.MediaViewer && typeof window.MediaViewer.mountThumbnail === "function") {
    const mediaStepIndex = Number(step?.rootIndex ?? step?.stepIndex ?? opts.stepIndex ?? -1);
    const mediaStoryPath = String(opts.storyPath || window.__CURRENT_STORY_PATH__ || STORY_KEY || "");
    const mediaEpisodeId = String(eventId || step?.canonicalEventId || [mediaStoryPath, mediaStepIndex, src].join("|"));
    window.MediaViewer.mountThumbnail(mount, src, {
      alt: "Conversation media",
      surfaceOwner: "conversation",
      lifecycleToken: `conversation:${conversationRendererGeneration}`,
      contactId: CONTACT_ID,
      storyPath: mediaStoryPath,
      stepIndex: mediaStepIndex,
      generation: conversationRendererGeneration,
      presentationEpisodeId: mediaEpisodeId,
      // Reconstructed transcript media can be above the fold. Chromium may
      // leave a lazy image permanently pending while the chat auto-scrolls to
      // the newest message, producing the observed blink/vanish on remount.
      // Conversation history has a terminal presentation contract, so begin
      // its load eagerly; galleries retain MediaViewer's lazy default.
      loading: "eager",
      // Optimized packages replace protected logical paths with opaque
      // records. A history remount has no guarantee that a prefetch entry is
      // still retained, so every conversation presentation must resolve its
      // own runtime URL instead of falling back to a source-only .jpg path.
      resolveRuntimeAsset: true
    });
    setTimeout(scrollToBottom, 80);
  } else {
    const img = document.createElement("img");
    if (window.ProtectedMediaResolver?.applyImage) {
      window.ProtectedMediaResolver.applyImage(img, src, { assetType: "conversation_media", surface: "conversation_inline", contactId: CONTACT_ID }).catch(() => {});
    } else img.src = src;
    img.alt = "";
    img.onload = scrollToBottom;
    mount.appendChild(img);
  }

  wrap.appendChild(mount);
  bodyEl.appendChild(wrap);
  completeConversationRenderClaim(renderClaim, wrap);

  scrollToBottom();

  if (!opts.silentLast) {
    notifyLastMessage("📷 Photo");
    try { window.Game?.audio?.play?.(who === "player" ? "msg_send" : "msg_receive_in", { category: "sfx" }); } catch {}
  }

  if (opts.persist) {
    try {
      const nowTs = Date.now();
      const episodeId = currentEpisodeIdForWrite();

      if (isPlayer) {
        // The canonical commit above (now unconditional on isPlayer) already
        // persisted this via installCanonicalMessageBridge's own
        // Game.Inbox.pushMessage reaction -- see addBubble for the full
        // explanation of why the old Game.notify call here was a genuine
        // second commit of the same photo, not a no-op.
        const conv = ensureConversationMeta(PROVIDED_NAME_AT_BOOT, PROVIDED_AVATAR_AT_BOOT, { metadataOnly: true });
        learnAlias(CONTACT_ID, conv.name || defaultNameFor(CONTACT_ID));
        stampLastPersistedMessageEpisode({ kind: "image", from: "player", image: src, at: nowTs, episodeId });
      }
      // Both branches: the canonical commit already happened above, gating
      // whether this bubble rendered at all -- nothing further to persist
      // here, only the thread-history bookkeeping below.
    } catch {}
    enforceThreadHistoryLimit({ write: true, discardResult: true });
  }
}

function applyPlayerThoughtPresentation(div, text, source) {
  const thoughts = window.PlayerThoughts;
  if (!thoughts?.isThought?.(source)) return false;
  div.classList.add("player-thought");
  div.dataset.presentation = "player_thought";
  div.dataset.speaker = "player";

async function addNoteBubble(text, opts) {
  opts = opts || {};
  const t = String(text || "").trim();
  if (!t || !bodyEl) return;

  const step = (opts.step && typeof opts.step === "object") ? opts.step : null;
  const renderSource = String(opts.renderSource || (opts.persist ? "live_interactive" : "transcript_hydration"));
  const renderClaim = step ? claimConversationRender(step, renderSource) : null;
  if (!renderClaim && renderAliases(step).length) return;
  // Only an authored, positioned step enters the interpreter. HAK hook
  // hints and other presentation-only callers do not create story events.
  if (opts.persist && step && !hasCanonicalConversationEvent(step, "system", text, "note")) {
    try {
      const { exec } = await commitCanonicalProgressionStepWithCatchup(step);
      if (!exec.handled || (exec.result && !exec.result.ok) || !hasCanonicalConversationEvent(step, "system", text, "note")) {
        releaseConversationRenderClaim(renderClaim, "canonical_commit_blocked");
        return false;
      }
    } catch (error) {
      releaseConversationRenderClaim(renderClaim, "canonical_commit_failed");
      throw error;
    }
  }
  if (renderClaim && renderClaim.generation !== conversationRendererGeneration) {
    releaseConversationRenderClaim(renderClaim, "stale_renderer_generation");
    return;
  }
  const finalText = tplText(t);

  const div = document.createElement("div");
  div.className = "bubble note";
  if (opts.className) div.classList.add(String(opts.className));
  div.textContent = finalText;
  if (window.PlayerThoughts) applyPlayerThoughtPresentation(div, finalText, { ...step?.canonicalSourceStep, ...step, type: "note", text: t });
  bodyEl.appendChild(div);
  if (renderClaim) completeConversationRenderClaim(renderClaim, div);

  scrollToBottom();

  // Authored notes were already committed by the interpreter above. Retain
  // the legacy cache path only for non-story callers without a source step.
  if (opts.persist && !step) {
    try {
      const store = readConversationStore();
      const conv = store && store[CONTACT_ID] ? store[CONTACT_ID] : null;
      if (conv && Array.isArray(conv.messages)) {
        const episodeId = currentEpisodeIdForWrite();
        conv.messages.push({
          at: Date.now(),
          kind: "note",
          from: "system",
          text: String(t), // raw
          episodeId: episodeId || "",
          episode: episodeId || ""
        });
        conv.messages = trimThreadMessages(conv.messages, MAX_THREAD_HISTORY);
        store[CONTACT_ID] = conv;
        writeConversationStore(store);
        if (episodeId) writeLastEpisodeId(episodeId);
      }
    } catch {}
  }
  return div;
}

function buildHakHintStableId(step) {
  const onceKey = canonicalId(String(step?.onceKey || "").trim());
  if (onceKey) return normalizeHakHintId(`hak_hint_once_${onceKey}`);

  const storyToken =
    canonicalId(currentStoryOnceKey || "") ||
    keyToken(safeGetLS(STORY_KEY) || "") ||
    "story";

  const kind = normalizeHakHintKind(step?.kind || "") || "unknown";
  const sourceStepKey = keyToken(String(step?.sourceStepKey || "").trim());
  if (sourceStepKey) {
    return normalizeHakHintId(`hak_hint_${storyToken}_${sourceStepKey}_${kind}`);
  }

  const sourceIdxRaw = Number(step?.sourceStepIndex);
  const sourceIdx = (Number.isFinite(sourceIdxRaw) && sourceIdxRaw >= 0)
    ? Math.floor(sourceIdxRaw)
    : ((Number.isFinite(index) && index >= 0) ? Math.floor(index) : 0);

  return normalizeHakHintId(`hak_hint_${storyToken}_${sourceIdx}_${kind}`);
}

function makeHakHintTranscriptItem(step) {
  const kind = normalizeHakHintKind(step?.kind || "");
  const rawText = String(step?.text || "").trim();
  if (!kind || !rawText) return null;

  const hakHintId = buildHakHintStableId(step);
  if (!hakHintId) return null;

  const episodeId = currentEpisodeIdForWrite();
  return {
    id: hakHintId,
    at: Date.now(),
    kind: "note",
    type: "hak_hint",
    from: "system",
    text: rawText,
    hakHintKind: kind,
    hakHintId,
    episodeId: episodeId || "",
    episode: episodeId || ""
  };
}

function hasHakHintBubbleInDom(hakHintId) {
  const id = normalizeHakHintId(hakHintId);
  if (!id || !bodyEl) return false;

  const nodes = bodyEl.querySelectorAll(".hak-hint[data-hak-hint-id]");
  for (const node of nodes) {
    if (normalizeHakHintId(node?.dataset?.hakHintId || "") === id) return true;
  }
  return false;
}

function ensureHakHintTranscriptItem(step) {
  const item = makeHakHintTranscriptItem(step);
  if (!item) return { item: null, inserted: false };

  try {
    const store = readConversationStore();
    let conv = (store && typeof store[CONTACT_ID] === "object") ? store[CONTACT_ID] : null;

    if (!conv) {
      conv = {
        id: CONTACT_ID,
        name: defaultNameFor(CONTACT_ID),
        avatar: CURRENT_AVATAR_URL || defaultAvatarFor(),
        unread: 0,
        last: "",
        messages: []
      };
    }

        }

  async function showFirstHakPointsThoughtAfterConversation(earnedPoints) {

      execution.activeStoryPath === owner.storyPath && execution.generation === owner.generation &&
      Number(execution.operationEpoch || 0) === owner.operationEpoch &&

  async function resumeAfterHakOverlayStep(owner) {
    // END authorizes this presentation's silent consequences. It does not
    // authorize a player reply when autoplay is off, nor another mount/Load.
    await __showNextQueue;
    for (let count = 0; count < 64 && ownsHakOverlayContinuation(owner); count++) {
      if (isInteractionPending() || Game._dayTransitionPending || Game._timeCardBusy) return;
      if (!hasNext()) { await onConversationFinished(); return; }
      const mode = readConversationAutoplayPreference();
      if (mode === 1 || mode === 2) { setAutoState(mode); return; }
      const step = script[index];
      const type = String(step?.type || '').toLowerCase();
      // IF is resolved without showNextInner's recursive visible advance.
      // Inspect the resulting branch again before granting any next action.
      if (type === 'if') {
        const { exec } = await commitCanonicalProgressionStepWithCatchup(step);
        if (!exec.handled || (exec.result && !exec.result.ok) || !ownsHakOverlayContinuation(owner)) return;
        if (!expandIfStepAtScriptIndex(index)) return;
        saveProgress();
        continue;
      }
      if (type === 'hak_add_evidence' || type === 'set_flag') {
        const at = index;
        if (await renderStep(step, { persist: true }) === false ||
            !ownsHakOverlayContinuation(owner) || index !== at) return;
        index++; saveProgress(); applyTriggersAt(index);
        continue;
      }
      if (type === 'time_card' || type === 'next_day' || type === 'start_story' || type === 'hak_overlay') {
        await showNext();
      }
      return;
    }
  }

    const skippedOwner = captureHakOverlayContinuation(step);
    if (window.ConvoRuntime?.skipRepeatedHakSkillAnnouncement?.(step)) {
      advanceAfterHakOverlayStep();

    const onceKey = canonicalId(step?.onceKey || "");
    const pauseToHome = (step?.pauseToHome === true || step?.goHome === true);

    if (onceKey && isOnceKeyDoneLocal(onceKey) && !step?.__canonicalPresentation) {
      Game.actionPending = false;
      advanceAfterHakOverlayStep();
      return;

    const continuationOwner = captureHakOverlayContinuation(step);
    hakOverlayStepBusy = true;

    Game.choicePending = false;

    clearIntroTimer();

      if (closed) return;

      if (continuationOwner.engine !== window.GameStateEngine ||
          continuationOwner.loadGeneration !== __convLoadStoryGeneration ||
          continuationOwner.operationEpoch !== Number(execution?.operationEpoch || 0) ||
          continuationOwner.leaseId !== execution?.lease?.id ||
          index !== continuationOwner.index || !isThisConversationActive() ||
          (continuationOwner.presentation && !ownsHakOverlayContinuation(continuationOwner))) {
        // A retained event callback must not clear a replacement action/choice.
        try { window.removeEventListener("hak:overlay-closed", ownCloseHandler, true); } catch {}
        if (hakOverlayCloseHandler === ownCloseHandler) hakOverlayCloseHandler = null;
        return;
      }
      cleanup();

      if (onceKey) markOnceKeyLocal(onceKey);

      if (pauseToHome) {
        const nextIndex = Math.max(0, Number(index) + 1);
        index = nextIndex;
        saveProgress();
        applyTriggersAt(index);
        queueHakTutorialResumeAt(nextIndex);
        applyHakTutorialHomeFlags(step);

        try {
          if (typeof window.navigateToScene === "function") {
            window.navigateToScene("home", { from: "hak_points_intro" });
          }
        } catch {}
        return;
      }

      advanceAfterHakOverlayStep();
      if (continuationOwner.presentation) resumeAfterHakOverlayStep(continuationOwner).catch(error => {
        try { console.error("[HAK] presentation continuation failed", error); } catch {}
      });
    }

    const ownCloseHandler = () => onOverlayClosed();
    hakOverlayCloseHandler = ownCloseHandler;
    try { window.addEventListener("hak:overlay-closed", hakOverlayCloseHandler, true); } catch {}

    const delayMs = Math.max(0, Number(step?.delayMs ?? step?.postChoiceDelayMs ?? 700) || 700);
    hakOverlayDelayTimer = setTimeout(() => {
      hakOverlayDelayTimer = null;

          return;
        }
        if (window.Game && typeof window.Game.showHakOverlay === "function") {
          window.Game.showHakOverlay(hakPayload);
          return;
        }

    }, delayMs);

  function readPendingStoryRaw() {
    return Game.readPendingStory();
  }

  function clearStalePendingResumeForPath(path) {
    const target = normalizeNext(path || "");
    if (!target) return false;
    const pending = readPendingStoryRaw();
    if (!pending || pending.kind !== "resume") return false;
    const pendingPath = normalizeNext(String(pending.path || pending.storyPath || "").trim());
    if (!pendingPath || pendingPath !== target) return false;
    try { Game.clearPendingStory(); } catch {}
    try { safeRemoveLS("pending_story_lock_v1"); } catch {}
    convDebug("pending_resume_cleared_before_chain", { contactId: CONTACT_ID, path: target });
    return true;
  }

  function walkStorySteps(story, visitor) {
    const rootSteps = Array.isArray(story?.steps) ? story.steps : [];
    const stack = rootSteps.slice().reverse();
    while (stack.length) {
      const step = stack.pop();
      if (!step || typeof step !== "object") continue;
      if (visitor(step) === true) return true;

      const thenSteps = Array.isArray(step.then) ? step.then : [];
      const elseSteps = Array.isArray(step.else) ? step.else : [];
      for (let i = elseSteps.length - 1; i >= 0; i--) stack.push(elseSteps[i]);
      for (let i = thenSteps.length - 1; i >= 0; i--) stack.push(thenSteps[i]);
    }
    return false;
  }

  function inferContactIdFromStory(story, storyPath = "") {
    const json = (story && typeof story === "object") ? story : {};
    if (typeof Game.getStoryOwnerId === "function") {
      return Game.getStoryOwnerId(json, { storyPath, contactId: json.owner || "" });
    }
    const topId = resolveContactId(
      json.contactId || json.contact || json.conversationId || json.characterId || json.ownerCharacterId || json.owner || "",
      json.contactName || json.name || ""
    );
    if (topId && topId !== "player") return topId;

    let found = "";
    walkStorySteps(json, (step) => {
      const type = String(step.type || "").toLowerCase();
      if (type === "message") {
        const fromId = resolveContactId(step.from || "", step.fromName || step.name || "");
        if (fromId && fromId !== "player") {
          found = fromId;
          return true;
        }
      }
      if (type === "notify") {
        const fromId = resolveContactId(step.fromId || "", step.fromName || step.name || "");
        if (fromId && fromId !== "player") {
          found = fromId;
          return true;
        }
      }
      return false;
    });
    return found;
  }

  function isSingleContactStory(story, contactId) {
    const target = canonicalId(contactId || "");
    if (!target) return false;

    let valid = true;
    walkStorySteps(story, (step) => {
      const type = String(step.type || "").toLowerCase();
      if (type === "message") {
        const fromId = resolveContactId(step.from || "", step.fromName || step.name || "");
        if (fromId && fromId !== "player" && canonicalId(fromId) !== target) {
          valid = false;
          return true;
        }
      }
      if (type === "notify") {
        const fromId = resolveContactId(step.fromId || "", step.fromName || step.name || "");
        if (fromId && fromId !== "player" && canonicalId(fromId) !== target) {
          valid = false;
          return true;
        }
      }
      return false;
    });

    return valid;
  }
