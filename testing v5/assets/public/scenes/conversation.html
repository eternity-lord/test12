    const pending = (pendingLike && typeof pendingLike === "object") ? pendingLike : null;
    if (!pending) return false;
    const pendingPath = normalizeStoryPath(String(pending.path || pending.storyPath || "").trim());
    const wantedPath = normalizeStoryPath(String(storyPath || "").trim());
    if (!pendingPath || !wantedPath || pendingPath !== wantedPath) return false;
    const kind = String(pending.kind || "resume").trim().toLowerCase();
    return kind === "resume" || kind === "dispatch" || kind === "player_first";
  }

  async function loadConversationEpisodesForContact(contactId) {
    const contactToken = canonicalId(contactId || "");
    const seen = new Set();
    const candidates = [];

    const pushCandidate = (rawPath) => {
      const normalized = normalizeStoryPath(String(rawPath || "").trim());
      if (!normalized || seen.has(normalized)) return;
      seen.add(normalized);
      candidates.push(normalized);
    };

    defaultConversationStoryCandidates(contactId).forEach(pushCandidate);

    try {
      const resIdx = await fetch("story/conversations_index.json", { cache: "no-store" });
      if (resIdx.ok) {
        const indexJson = await resIdx.json();
        const list = indexJson && indexJson[contactId];
        if (Array.isArray(list)) {
          for (const entry of list) pushCandidate(entry);
        }
      }
    } catch {}

    const episodes = [];
    for (const url of candidates) {
      try {
        const json = await loadStoryJson(url);
        const owner = canonicalId(inferContactIdFromStory(json));
        if (!owner || owner !== contactToken) {
          try {
            console.info(`[EP_PICK] skipped external/global candidate contact=${contactId} story=${url} owner=${owner || "global"}`);
          } catch {}
          continue;
        }
        const onceKey = json.onceKey || null;
        if (onceKey) ensureConvEpisodeFlag(onceKey, url);
        const done = onceKey ? isConvEpisodeDone(onceKey, url) : false;
        const unlocked = requirementsMet(json);
        try {
          console.info(`[EP_PICK] candidate contact=${contactId} story=${url} unlocked=${unlocked ? 1 : 0} done=${done ? 1 : 0} onceKey=${String(onceKey || "")}`);
        } catch {}
        if (done && onceKey) {
          try {
            console.info(`[EP_PICK] skipped because onceKey already done contact=${contactId} story=${url} onceKey=${onceKey}`);
          } catch {}
        }
        episodes.push({
          url,
          json,
          onceKey,
          unlocked,
          done
        });
      } catch {}
    }

    return episodes;
  }

  async function resolveConversationStoryForLoad(preferredPath, opts = {}) {
    const preferredUrl = normalizeStoryPath(String(preferredPath || "").trim());
    const allowIndexFallback = opts?.allowIndexFallback === true;
    const forcePreferred = opts?.forcePreferred === true;
    const allowDonePreferred = opts?.allowDonePreferred === true || forcePreferred;
    const preferredOnceHint = canonicalId(opts?.preferredOnceKey || "");
    const pending = (opts.pending && typeof opts.pending === "object") ? opts.pending : null;
    const pendingOutbound = (opts.pendingOutbound && typeof opts.pendingOutbound === "object") ? opts.pendingOutbound : null;
    const runtime = readStoryRuntimeState();
    const pendingOwner = resolvePendingContactId(pending);
    const runtimeOwner = canonicalId(runtime.turnOwner || runtime.activeCharacterId || "");
    const activeOwner = pendingOwner || runtimeOwner;
    const foreignOwnerActive = !!activeOwner && activeOwner !== CONTACT_ID;
    const runtimePath = normalizeStoryPath(String(runtime.expectedNextStory || runtime.activeStoryPath || "").trim());
    const expectedPath = normalizeStoryPath(String(
      pending?.path ||
      pending?.storyPath ||
      runtime.expectedNextStory ||
      runtime.activeStoryPath ||
      ""
    ).trim());
    const runtimeOwnsPreferred =
      !!preferredUrl &&
      activeOwner === CONTACT_ID &&
      !!runtimePath &&
      runtimePath === preferredUrl;
    const preferredOwned =
      pendingOwnsStoryPath(pending, preferredUrl) ||
      pendingOwnsStoryPath(pendingOutbound, preferredUrl) ||
      runtimeOwnsPreferred;
    if (runtime.transitionLock === true && !preferredOwned && !preferredUrl) {
      try {
        console.info(`[EP_PICK] contact=${CONTACT_ID} blocked during transition lock expected=${expectedPath || "(none)"} owner=${activeOwner || "(none)"}`);
      } catch {}
      return null;
    }
    if (foreignOwnerActive) {
      try {
        console.info(`[EP_PICK] contact=${CONTACT_ID} loading while current turn belongs to ${activeOwner}`);
      } catch {}
    }
    if (expectedPath && activeOwner === CONTACT_ID && !forcePreferred) {
      try {
        const exactJson = await loadStoryJson(expectedPath);
        const expectedOwner = canonicalId(inferContactIdFromStory(exactJson));
        if (!expectedOwner || expectedOwner !== CONTACT_ID) {
          try {
            console.info(`[EP_PICK] contact=${CONTACT_ID} expected story is external (${expectedOwner || "global"}) story=${expectedPath}`);
          } catch {}
          return null;
        }
        const exactOnceKey = exactJson.onceKey || null;
        if (exactOnceKey) ensureConvEpisodeFlag(exactOnceKey, expectedPath);
        const chapterLoadBypass = hasDevChapterLoadUnlock() || chapterLoadModeTargetsStory(expectedPath);
        const unlocked = chapterLoadBypass || requirementsMet(exactJson);
        const done = (!chapterLoadBypass && exactOnceKey) ? isConvEpisodeDone(exactOnceKey, expectedPath) : false;
        const liveOwnership =
          pendingOwnsStoryPath(pending, expectedPath) ||
          pendingOwnsStoryPath(pendingOutbound, expectedPath);
        try {
          console.info(`[EP_PICK] contact=${CONTACT_ID} expected story=${expectedPath} unlocked=${unlocked ? 1 : 0} done=${done ? 1 : 0} live=${liveOwnership ? 1 : 0}`);
        } catch {}
        if (unlocked && (!done || liveOwnership)) {
          return {
            url: expectedPath,
            json: exactJson,
            onceKey: exactOnceKey,
            unlocked,
            done,
            source: pendingOwner ? "pending_owner" : "runtime_owner",
            liveOwnership
          };
        }
        try {
          console.error(`[EP_PICK][ERROR] expected story rejected contact=${CONTACT_ID} story=${expectedPath}`, {
            unlocked,
            done,
            liveOwnership,
            owner: activeOwner
          });
        } catch {}
        return null;
      } catch (err) {
        try {
          console.error(`[EP_PICK][ERROR] expected story failed to load contact=${CONTACT_ID} story=${expectedPath}`, { err });
        } catch {}
        return null;
      }
    }
    const externalChain = readExternalChainForContact(CONTACT_ID, pending || readPendingStoryRaw());
    if (externalChain) {
      try {
        console.info(`[EP_PICK] contact=${CONTACT_ID} skipped because conversation is chaining externally target=${externalChain.path}`);
      } catch {}
      return null;
    }

    let preferredMeta = null;
    let preferredReason = preferredUrl ? "preferred_candidate" : "missing_preferred";

    if (preferredUrl) {
      try {
        const preferredJson = await loadStoryJson(preferredUrl);
        const preferredOwner = canonicalId(inferContactIdFromStory(preferredJson));
        if (!preferredOwner || preferredOwner !== CONTACT_ID) {
          preferredReason = "preferred_external_owner";
          try {
            console.info(`[EP_PICK] contact=${CONTACT_ID} rejected preferred external/global story=${preferredUrl} owner=${preferredOwner || "global"}`);
          } catch {}
          preferredMeta = null;
          throw new Error("preferred_external_owner");
        }
        const preferredOnceKey = preferredJson.onceKey || null;
        if (preferredOnceKey) ensureConvEpisodeFlag(preferredOnceKey, preferredUrl);
        const chapterLoadBypass = hasDevChapterLoadUnlock() || chapterLoadModeTargetsStory(preferredUrl);
        const unlocked = chapterLoadBypass || requirementsMet(preferredJson);
        const done = (!chapterLoadBypass && preferredOnceKey) ? isConvEpisodeDone(preferredOnceKey, preferredUrl) : false;
        const onceMatchesHint =
          !preferredOnceHint ||
          !preferredOnceKey ||
          canonicalId(preferredOnceKey || "") === preferredOnceHint;
        const storedStory = normalizeStoryPath(String(safeGetLS(STORY_KEY) || "").trim());
        const liveOwnership =
          pendingOwnsStoryPath(pending, preferredUrl) ||
          pendingOwnsStoryPath(pendingOutbound, preferredUrl) ||
          runtimeOwnsPreferred;
        const storedOwnership =
          !done &&
          !!storedStory &&
          storedStory === preferredUrl;

        preferredMeta = {
          url: preferredUrl,
          json: preferredJson,
          onceKey: preferredOnceKey,
          unlocked,
          done,
          source: "preferred",
          liveOwnership,
          storedOwnership
        };

        if (forcePreferred && onceMatchesHint) {
          preferredMeta.source = done ? "preferred_forced_done" : "preferred_forced";
          try {
            console.info(`[EP_PICK] contact=${CONTACT_ID} force-selected story=${preferredUrl}`);
          } catch {}
          return preferredMeta;
        }

        if (!liveOwnership && !storedOwnership) {
          preferredReason = "preferred_not_owned";
        } else if (unlocked && (!done || liveOwnership || storedOwnership)) {
          try {
            console.info(`[EP_PICK] contact=${CONTACT_ID} selected story=${preferredUrl}`);
          } catch {}
          return preferredMeta;
        }

        if (liveOwnership || storedOwnership) {
          preferredReason = !unlocked
            ? "preferred_blocked_requirements"
            : (storedOwnership ? "preferred_stored_resume_done" : "preferred_done");
        }
      } catch (err) {
        if (preferredReason !== "preferred_external_owner") {
          preferredReason = "preferred_load_failed";
          convDebug("story_resolution_preferred_load_failed", {
            contactId: CONTACT_ID,
            preferredUrl,
            message: String(err?.message || err || "load_failed")
          });
        }
      }
    }

    if (!allowIndexFallback) {
      try {
        console.info(
          `[EP_PICK] contact=${CONTACT_ID} passive_open_no_owned_story preferred=${preferredUrl || "(none)"} reason=${preferredReason}`
        );
      } catch {}
      return null;
    }

    const episodes = await loadConversationEpisodesForContact(CONTACT_ID);
    const unlockedEpisodes = episodes.filter((episode) => episode.unlocked);
    // When we lose the exact pending/current pointer, prefer the latest
    // unresolved episode instead of the oldest one. Picking the first
    // unresolved entry can rewind the thread into an earlier Day 8 scene.
    const chosen = unlockedEpisodes.slice().reverse().find((episode) => !episode.done) || null;

    if (chosen) {
      try {
        console.info(`[EP_PICK] contact=${CONTACT_ID} selected story=${chosen.url}`);
      } catch {}
      return {
        ...chosen,
        source: preferredUrl && chosen.url === preferredUrl
          ? "preferred_from_index"
          : `fallback:${preferredReason}`,
        preferredUrl
      };
    }

    if (preferredMeta?.done) {
      try {
        console.info(`[EP_PICK] contact=${CONTACT_ID} skipped because onceKey already done story=${preferredMeta.url}`);
      } catch {}
    }

    try {
      console.info(`[EP_PICK] contact=${CONTACT_ID} no unresolved episode available`);
    } catch {}
    return null;
  }

  async function resolveExplicitChainTarget(nextPath, ctx = {}) {
    let normalizedNext = normalizeStoryPath(String(nextPath || "").trim());
    const visited = new Set();
    const allowDoneTarget = ctx?.allowDoneTarget === true;
    const chainEngine = window.GameStateEngine;
    const chainIdentity = chainEngine?.getRuntimeLifecycleIdentity?.();
    const chainLeaseId = chainEngine?.getExecutionState?.().lease?.id;
    const chainIsCurrent = () => {
      if (window.GameStateEngine !== chainEngine) return false;
      const current = chainEngine?.getRuntimeLifecycleIdentity?.();
      if (chainIdentity && (!current || current.playthroughId !== chainIdentity.playthroughId || current.playthroughGeneration !== chainIdentity.playthroughGeneration || current.operationEpoch !== chainIdentity.operationEpoch)) return false;
      return chainEngine?.getExecutionState?.().lease?.id === chainLeaseId;
    };
    const retiredChain = () => ({canonicalChainHandled: true, reason: "retired_chain_resolution"});

    if (!normalizedNext) {
      try {
        console.error(`[CHAIN][ERROR] target failed to load [reason=invalid_path]: ${String(nextPath || "") || "(empty)"}`, {
          sourceStoryPath: String(ctx?.sourceStoryPath || ""),
          sourceOnceKey: String(ctx?.sourceOnceKey || ""),
          reason: "invalid_path"
        });
      } catch {}
      return null;
    }

    // Match the canonical completion handoff before fetching: logical aliases
    // and physical route variants are both resolved for the target owner.
    let continuationTarget;
    try {
      continuationTarget = await Game.resolveContinuationTarget?.(normalizedNext, ctx.sourceContactId || CONTACT_ID);
    } catch (error) {
      if (!chainIsCurrent()) return retiredChain();
      throw error;
    }
    if (!chainIsCurrent()) return retiredChain();
    normalizedNext = normalizeStoryPath(continuationTarget?.targetStoryPath || normalizedNext);
    if (!allowDoneTarget) {
      const canonical = Game.resolveCanonicalChainSuccessor?.(normalizedNext, "", ctx);
      if (canonical?.status === "SATISFIED") return {canonicalChainHandled: true, reason: canonical.reason};
      if (canonical?.status === "NEXT" && canonical.path) normalizedNext = normalizeStoryPath(canonical.path);
      else if (canonical && canonical.status !== "NEXT") {
        try { console.error("[CHAIN][ERROR] canonical successor blocked", canonical); } catch {}
        return null;
      }
    }

    while (normalizedNext) {
      if (visited.has(normalizedNext) || visited.size >= 64) {
        try {
          console.error(`[CHAIN][ERROR] target failed to load [reason=disabled_skip_loop_guard]: ${normalizedNext}`, {
            sourceStoryPath: String(ctx?.sourceStoryPath || ""),
            sourceOnceKey: String(ctx?.sourceOnceKey || ""),
            reason: "disabled_skip_loop_guard"
          });
        } catch {}
        return null;
      }
      visited.add(normalizedNext);

      let nextJson = null;
      try {
        nextJson = await loadStoryJson(normalizedNext);
      } catch (err) {
        if (!chainIsCurrent()) return retiredChain();
        try {
          console.error(`[CHAIN][ERROR] target failed to load [reason=load_json_failed]: ${normalizedNext}`, {
            sourceStoryPath: String(ctx?.sourceStoryPath || ""),
            sourceOnceKey: String(ctx?.sourceOnceKey || ""),
            err
          });
        } catch {}
        return null;
      }
      if (!chainIsCurrent()) return retiredChain();

      if (!nextJson || typeof nextJson !== "object") {
        try {
          console.error(`[CHAIN][ERROR] target failed to load [reason=invalid_json]: ${normalizedNext}`, {
            sourceStoryPath: String(ctx?.sourceStoryPath || ""),
            sourceOnceKey: String(ctx?.sourceOnceKey || ""),
            reason: "invalid_json"
          });
        } catch {}
        return null;
      }

      const targetContactId = canonicalId(inferContactIdFromStory(nextJson, normalizedNext)) || "__global_story__";
      const targetOnceKey = canonicalId(nextJson.onceKey || "");
      if (targetContactId !== "__global_story__" && shouldHideCharacterFromUIForConversation(targetContactId)) {
        try {
          console.info(`[CHAIN] disabled target deferred to runtime skip: ${normalizedNext}`, {
            sourceStoryPath: String(ctx?.sourceStoryPath || ""),
            sourceOnceKey: String(ctx?.sourceOnceKey || ""),
            targetContactId
          });
        } catch {}
        return {
          path: normalizedNext,
          json: nextJson,
          onceKey: targetOnceKey,
          contactId: targetContactId,
          sameContact: false,
          isCurrent: chainIsCurrent,
          singleContact: !!targetContactId && isSingleContactStory(nextJson, targetContactId)
        };
      }

      if (!requirementsMet(nextJson)) {
        try {
          console.error(`[CHAIN][ERROR] target failed to load [reason=requirements_not_met]: ${normalizedNext}`, {
            sourceStoryPath: String(ctx?.sourceStoryPath || ""),
            sourceOnceKey: String(ctx?.sourceOnceKey || ""),
            reason: "requirements_not_met",
            requireOnceKey: String(nextJson.requireOnceKey || "")
          });
        } catch {}
        return null;
      }

      if (targetOnceKey && onceDone(targetOnceKey) && !allowDoneTarget) {
        const handoff = Game.resolveCompletedCanonicalChainTarget?.(normalizedNext, targetOnceKey, ctx);
        if (handoff?.status === "SATISFIED") {
          return {canonicalChainHandled: true, reason: handoff.reason};
        }
        if (handoff?.status === "NEXT" && handoff.path) {
          normalizedNext = normalizeStoryPath(handoff.path);
          continue;
        }
        try {
          console.error(`[CHAIN][ERROR] target failed to load [reason=onceKey_already_done]: ${normalizedNext}`, {
            sourceStoryPath: String(ctx?.sourceStoryPath || ""),
            sourceOnceKey: String(ctx?.sourceOnceKey || ""),
            reason: "onceKey_already_done",
            onceKey: targetOnceKey,
            canonicalHandoff: handoff || null
          });
        } catch {}
        return null;
      }

      try {
        console.info(`[CHAIN] target loaded successfully: ${normalizedNext}`, {
          sourceStoryPath: String(ctx?.sourceStoryPath || ""),
          sourceOnceKey: String(ctx?.sourceOnceKey || ""),
          targetContactId
        });
      } catch {}

      return {
        path: normalizedNext,
        json: nextJson,
        onceKey: targetOnceKey,
        contactId: targetContactId,
        sameContact: !!targetContactId && targetContactId === CONTACT_ID,
        isCurrent: chainIsCurrent,
        singleContact: targetContactId !== "__global_story__" && isSingleContactStory(nextJson, targetContactId)
      };
    }

    return null;
  }

  async function tryAutoChainSameContact(chainTarget, chainKey, fromOnceKey, fromStoryPath, allowDirectOpen = false) {
    if (!allowDirectOpen) return false;
    const normalizedNext = normalizeStoryPath(String(chainTarget?.path || "").trim());
    const nextJson = chainTarget?.json || null;
    if (!normalizedNext || !nextJson || typeof nextJson !== "object") return false;

    const nextContactId = canonicalId(chainTarget?.contactId || inferContactIdFromStory(nextJson));
    if (!nextContactId || nextContactId !== CONTACT_ID) return false;
    if (!(chainTarget?.singleContact === true || isSingleContactStory(nextJson, CONTACT_ID))) return false;

    clearStalePendingResumeForPath(normalizedNext);
    if (chainKey) {
      try { safeSetLS(chainKey, "1"); } catch {}
    }
    try {
      safeSetLS(CHAIN_KEY, JSON.stringify({
        path: String(normalizedNext),
        at: Date.now(),
        from: String(fromOnceKey || ""),
        via: "conversation_on_complete_same_contact"
      }));
    } catch {}
    queueStoryRuntimeTurn(normalizedNext, {
      via: "onCompleteStartStory",
      targetContactId: CONTACT_ID,
      transitionLock: false,
      timelineReplayChain: readStoryRuntimeState().timelineReplayChain === true
    }, "conversation_on_complete_same_contact");

    window.__conv_queued_chain = true;
    pendingOutboundWaiting = false;
    pendingOutboundTask = null;
    Game.actionPending = false;
    Game.choicePending = false;
    clearActionPromptBox();
    clearChoicesBox();

    safeSetLS(STORY_KEY, normalizedNext);
    setProgressCanonical(0);
    try { safeSetLS(EPISODE_KEY, normalizedNext); } catch {}
    try { Game.clearPendingStory(); } catch {}
    try { safeRemoveLS("pending_story_lock_v1"); } catch {}

    index = 0;
    script = [];
    loaded = false;
    introPlayed = false;
    finishFired = false;
    resetConversationStepDedup();
    claimConversationRunner(normalizedNext, 0);

    convDebug("on_complete_chain_same_contact_in_place", {
      contactId: CONTACT_ID,
      fromStoryPath: String(fromStoryPath || ""),
      fromOnceKey: String(fromOnceKey || ""),
      nextPath: normalizedNext,
      chainKey: String(chainKey || "")
    });

    loadStory();
    return true;
  }

  function prepareConversationCompletionHome(storyPath, onceKey) {
    if (TIMELINE_HISTORY_ONLY || cleanupHandled || !isThisConversationActive() ||
        safeGetLS("settings_returnHomeAfterChat") !== "1") return null;
    const engine = window.GameStateEngine;
    const landing = {
      engine,
      identity: JSON.stringify(engine?.getRuntimeLifecycleIdentity?.() || {}),
      mountedStory: mountedCompletionStory,
      sourcePath: normalizeStoryPath(storyPath),
      sourceOnceKey: onceKey,
      sourceIds: [mountedCompletionStory?.canonicalStoryId, currentConversationCanonicalOwner?.storyId, mountedCompletionStory?.json?.id,
        onceKey, storyPath].filter(Boolean),
      loadGeneration: __convLoadStoryGeneration,
      timer: null
    };
    conversationCompletionHome = landing;
    // The successor can be admitted synchronously by COMPLETE_STORY. Its
    // activation may not replace this finished chat before its Home landing.
    clearIntroTimer();
    stopAuto(false);
    return landing;
  }

  function conversationCompletionHomeIsCurrent(landing) {
    return !!landing && conversationCompletionHome === landing && !cleanupHandled &&
      !TIMELINE_HISTORY_ONLY && safeGetLS("settings_returnHomeAfterChat") === "1" &&
      window.GameStateEngine === landing.engine &&
      JSON.stringify(landing.engine?.getRuntimeLifecycleIdentity?.() || {}) === landing.identity &&
      __convLoadStoryGeneration === landing.loadGeneration && mountedCompletionStory === landing.mountedStory &&
      isThisConversationActive();
  }

  function captureMountedConversationCompletionStory(path, json) {
    const sourcePath = normalizeStoryPath(path || "");
    const engine = window.GameStateEngine;
    const owner = currentConversationCanonicalOwner;
    const execution = engine?.getExecutionState?.();
    // Releasing the renderer clears its transient owner before finishing.
    // Archived saves can use an execution ID different from the JSON's once
    // key, so retain that exact completed-story identity with this mount.
    const canonicalStoryId = owner?.storyPath === sourcePath ? owner.storyId :
      normalizeStoryPath(execution?.activeStoryPath || "") === sourcePath ? execution.activeStoryId : null;
    const sourceIds = [canonicalStoryId, json?.id, json?.onceKey, sourcePath].filter(Boolean);
    const wasCompleted = (json?.onceKey && engine?.hasOnceKey?.(json.onceKey)) ||
      sourceIds.some(id => engine?.hasCompletedStory?.(id));
    return Object.freeze({ path: sourcePath, json, canonicalStoryId, incompleteAtMount: !wasCompleted });
  }

  function captureCanonicalConversationCompletionHome(execution, events) {
    if (finishFired || TIMELINE_HISTORY_ONLY || cleanupHandled ||
        mountedCompletionStory?.incompleteAtMount !== true ||
        safeGetLS("settings_returnHomeAfterChat") !== "1" || !isThisConversationActive()) return false;
    const engine = window.GameStateEngine;
    const sourcePath = normalizeStoryPath(mountedCompletionStory?.path || "");
    const sourceOnceKey = canonicalId(mountedCompletionStory?.json?.onceKey || currentStoryOnceKey || "");
    const owner = currentConversationCanonicalOwner;
    // Load/reinitialization must never lend an old renderer's completion a
    // new Home request. A normal source-to-successor handoff keeps its epoch.
    if (!engine || !sourcePath || (owner?.operationEpoch != null &&
        Number(owner.operationEpoch) !== Number(execution?.operationEpoch || 0))) return false;
    const sourceIds = [mountedCompletionStory?.canonicalStoryId, owner?.storyId, mountedCompletionStory?.json?.id, sourceOnceKey, sourcePath].filter(Boolean);
    // A stored completed episode is available for rereading. Only a newly
    // emitted source completion in this mount can request automatic Home.
    if (!Array.isArray(events) || !events.some(event => event?.type === "story:completed" && sourceIds.includes(event.storyId))) return false;
    if ((sourceOnceKey && !engine.hasOnceKey?.(sourceOnceKey)) ||
        !sourceIds.some(id => engine.hasCompletedStory?.(id)) ||
        (normalizeStoryPath(execution?.activeStoryPath || "") === sourcePath && execution?.cursor?.completion !== "completed")) return false;
    const landing = prepareConversationCompletionHome(sourcePath, sourceOnceKey);
    if (!landing) return false;
    scheduleConversationCompletionHome(landing);
    return true;
  }

  function scheduleConversationCompletionHome(landing) {
    if (!landing) return;
    const retire = () => {
      if (landing.timer) clearTimeout(landing.timer);
      landing.timer = null;
      if (conversationCompletionHome === landing) conversationCompletionHome = null;
    };
    const land = () => {
      landing.timer = null;
      if (!conversationCompletionHomeIsCurrent(landing)) { retire(); return; }
      const execution = landing.engine?.getExecutionState?.();
      const committed = landing.engine
        ? (!landing.sourceOnceKey || landing.engine.hasOnceKey?.(landing.sourceOnceKey)) &&
          landing.sourceIds.some(id => landing.engine.hasCompletedStory?.(id)) &&
          (normalizeStoryPath(execution?.activeStoryPath || "") !== landing.sourcePath || execution?.cursor?.completion === "completed")
        : isCurrentEpisodeDone();
      if (!committed) { retire(); return; }
      // Mandatory story presentations keep their existing order and own
      // their day/HAK landing. Never navigate underneath an active overlay.
      if (Game._dayTransitionPending || Game._timeCardBusy || Game._cinematicLock ||
          Game._hakOverlayOpen || Game._renameOverlayOpen || hakOverlayStepBusy || cutsceneOpen ||
          appDownloadInProgress || Game.actionPending || Game.choicePending ||
          safeGetLS("__cinematic_lock_v1") === "1") {
        landing.timer = setTimeout(land, 150);
        return;
      }
      const onHomeMounted = (event) => {
        window.removeEventListener("scene:mounted", onHomeMounted);
        const scene = canonicalId(event?.detail?.name || event?.detail?.id || event?.detail?.scene || "");
        if (window.GameStateEngine !== landing.engine ||
            JSON.stringify(landing.engine?.getRuntimeLifecycleIdentity?.() || {}) !== landing.identity ||
            scene !== "home" || canonicalId(Game.currentScene || "") !== "home") return;
        // A same-contact walker can have paused while the old chat was
        // still visible. Wake its NPC prefix once Home has really mounted;
        // player turns keep their ordinary input/notification boundary.
        Game.resumePendingStory?.({ source: "conversation_return_home", sourceStoryPath: landing.sourcePath,
          sourceOnceKey: landing.sourceOnceKey, sourceContactId: CONTACT_ID, auto: true });
      };
      // navigateToScene starts an asynchronous mount and has no completion
      // promise. The real scene event owns this one continuation wake.
      window.addEventListener("scene:mounted", onHomeMounted, { once: true });
      navigateSceneWithQuery("home", { from: "conversation_return_home", sourceStoryPath: landing.sourcePath });
    };
    // Leave the final bubble visible briefly before disposing this scene.
    landing.timer = setTimeout(land, 350);
  }

  async function onConversationFinished() {
    if (TIMELINE_HISTORY_ONLY) return;
    if (finishFired) {
      releaseConversationRunner();
      convDebug("finish_skip_already_fired", {
        contactId: CONTACT_ID,
        index,
        scriptLength: script.length
      });
      return;
    }
    finishFired = true;

  if (ti < 0) return 0;

  // We search from the end of the script (more stable) to avoid prefix poisoning.
  let anchorScriptPos = -1;
  for (let p = scriptIdx.length - 1; p >= 0; p--) {
    const si = scriptIdx[p];
    if (scriptStepMatchesTranscript(scriptArr[si], transcriptArr[ti])) {
      anchorScriptPos = p;
      break;
    }

  if (anchorScriptPos < 0) return 0;

  // 2) Walk backwards to extend the match window (best-effort),
  // but do NOT fail hard if one row mismatches.
  let p = anchorScriptPos - 1;
  ti--;

  while (p >= 0 && ti >= 0) {
    // Skip unusable transcript rows
    if (!isTranscriptRowUsable(transcriptArr[ti])) {
      ti--;
      continue;
    }

    const si = scriptIdx[p];
    if (scriptStepMatchesTranscript(scriptArr[si], transcriptArr[ti])) {
      p--;
      ti--;
      continue;
    }

    // Soft stop: we don't rewind; we keep the anchor and stop extending
    break;
  }

  // Return the next script index *after* the anchor step
  const anchorSi = scriptIdx[anchorScriptPos];
  return Math.max(0, anchorSi + 1);

function normalizeStoryPath(p){
  // Backslash + leading-"./" normalization matches every other independent
  // copy of this function in the codebase (scripts/achievements.js,
  // scripts/start-from-entry.js, scripts/update-safety-resolver.js,
  // scenes/pictures.html, onlyfun-scene.js's normalizeStoryPathForGate) --
  // this copy and convo-runtime.js's were the only two missing the "./"
  // strip. A story identity that legitimately reaches this function both
  // with and without a "./" prefix (e.g. s.execution.activeStoryPath set
  // directly from a story JSON's own onCompleteStartStory string, which
  // never carries "./", versus this scene's own manifest-resolved usedUrl,
  // which does) produced two different normalized values for the exact
  // same story -- silently breaking every equality check in this file that
  // compares two normalizeStoryPath(...) results (dozens of call sites,
  // including makeConversationStepEventId's identity key).
  const s = String(p || "").trim().replace(/\\/g, "/").replace(/^\.\//, "");
  if (!s) return "";
  if (s.includes("/")) return s;
  if (s.endsWith(".json")) return "story/" + s;
  return "story/" + s + ".json";
}

function estimateCinematicFlushWaitMs(){
  const q = Array.isArray(window.Game?._cinematicQueue) ? window.Game._cinematicQueue : [];

  for (const row of q) {
    if (!row || typeof row !== "object") continue;

    if (t === "notify") notifyCount += 1;
    else if (t === "inbox:new") inboxCount += 1;

  const notifyMs = notifyCount > 1 ? ((notifyCount - 1) * 20) : 0;
  const inboxMs = inboxCount > 1 ? ((inboxCount - 1) * 24) : 0;
  return Math.max(40, Math.min(900, Math.max(notifyMs, inboxMs) + 50));

function getSpeed() {
  let s = 1;

  const shellSpeed = Number(Game?.settings?.messageSpeed);
  if (Number.isFinite(shellSpeed) && shellSpeed > 0) s = shellSpeed;

  const n = Number(safeGetLS("MessageSpeed"));
  if (Number.isFinite(n) && n > 0) s = n;

  // ✅ clamp (prevents instant autoplay if value is insane)
  s = Math.max(0.6, Math.min(3.0, s));
  return s;
}

function runAutoIntro() {
  if (!loaded || introPlayed) return;
  introPlayed = true;
  const token = ++introRunToken;
  const loadGeneration = __convLoadStoryGeneration;

  const baseDelay = 650;
  const delay = baseDelay / getSpeed();

  async function tick() {
    if (token !== introRunToken || loadGeneration !== __convLoadStoryGeneration) return;
    if (!isThisConversationActive()) { clearIntroTimer(); return; }
    if (appDownloadInProgress) { clearIntroTimer(); return; }
    if (!hasNext()) { clearIntroTimer(); return; }

    const nextStep = script[index];
    if (!nextStep) { clearIntroTimer(); return; }
    // Live transcripts are read one line at a time when Autoplay is off.
    // They are spoken dialogue, so keep them out of the compose/send path.
    // Unavailable or empty captures remain invisible and must not block play.
    if (nextStep.type === "hak_transcript" && String(nextStep.text || "").trim() &&
        isHakTranscriptSkillActiveForStory(currentConversationStoryPath || safeGetLS(STORY_KEY) || "")) {
      clearIntroTimer(); return;
    }
    if (nextStep.type === "choice") { clearIntroTimer(); return; }
    if (nextStep.type === "hak_overlay") { clearIntroTimer(); return; }
    if (nextStep.type === "hak_unlock") { clearIntroTimer(); return; }
    if (nextStep.type === "glitch_eject") { clearIntroTimer(); return; }
    if (nextStep.type === "time_card" || nextStep.type === "next_day") { clearIntroTimer(); return; }
    if (nextStep.type === "cutscene") { clearIntroTimer(); return; }
    if (nextStep.type === "hak_gate" || nextStep.type === "dev_message") { clearIntroTimer(); return; }
    if (nextStep.type === "hak_watchlist") { clearIntroTimer(); return; }

    if (!isPlayerStep(nextStep)) {
      // A queued tick checked on an NPC must not later execute on a player
      // step. Wait for this advance before inspecting the next boundary.
      const startedAt = Date.now();
      await showNext();
      if (token !== introRunToken || loadGeneration !== __convLoadStoryGeneration) return;
      introTimer = setTimeout(tick, Math.max(0, delay - (Date.now() - startedAt)));
    } else {
      clearIntroTimer();
    }
  }

  tick();
}

  function isTruePlayerFirstEpisode() {
    const storyJson = window.__CURRENT_STORY_JSON__ || null;
    const rawSteps = Array.isArray(storyJson?.steps) ? storyJson.steps : [];
    if (!rawSteps.length) return false;

    for (const rawStep of rawSteps) {
      if (!rawStep || typeof rawStep !== "object") continue;
      const type = String(rawStep.type || "").toLowerCase();
      if (
        type === "if" ||
        type === "label" ||
        type === "goto" ||
        type === "set_flag" ||
        type === "note" ||
        type === "todo" ||
        type === "todo_clear" ||
        type === "hak_hint"
      ) {
        continue;
      }
      if (type === "notify") return false;
      if (type === "message" || type === "photo" || type === "image" || type === "send_to_continue") {
        return canonicalId(rawStep.from || "") === "player" || type === "send_to_continue";
      }
      return false;
    }

    return false;
  }

  function showPendingOutboundPrompt(task) {

    const draftPrefill = String(

        const targetStoryPath = normalizeStoryPath(String(liveTask.storyPath || liveTask.path || "").trim());

        if (!targetStoryPath || !targetContactId) return false;

            contactId: targetContactId,
            contactName: liveTask.contactName || "",

          contactId: targetContactId,
          contactName: liveTask.contactName || "",
          storyPath: targetStoryPath,
          messageText: sendText,
          draftText: sendText,
          playerDraft: sendText,
          promptText: sendText,
          episodeOnceKey: liveTask.episodeOnceKey || "",
          cueKind: liveTask.cueKind || "rainbow",
          at: Date.now()

        writePendingOutbound(staged);
        setGuidedCueForContact(targetContactId, {
          kind: staged.cueKind,
          reason: "send_first_message",
          story: targetStoryPath,
          label: staged.draftText

        try { setProgressCanonical(0); } catch {}

        loadStory();
        return true;

        let livePlayerFirst = readPendingOutboundForCurrentContact();
        // loadStory() mounts asynchronously.  The outbound task previously
        // attempted SEND in the same microtask and, when the compiled first
        // step was not ready yet, fell through to addBubble(...persist:true)
        // without a step/event identity.  That is the exact first-message
        // NO_EVENT_ID_OR_BRIDGE path.  Wait for the authored root step and
        // pending task to share ownership before invoking the canonical SEND
        // boundary; never manufacture an identity downstream.
        for (let attempt = 0; staged && attempt < 100; attempt++) {
          livePlayerFirst = readPendingOutboundForCurrentContact();
          const readyStep = ensureResolvedPlayerStepAt(0);

        // have a canonical identity and must not be rendered/persisted via a
        // legacy fallback. Keep the actionable pending task in place so a
        // remount/retry can complete it through sendPendingPlayerFirst.
        try { console.error("[Conversation] player_first canonical step unavailable", { contactId: liveTask.contactId, storyPath: targetStoryPath }); } catch {}
        return false;
      });
    });

  function normalizeNext(next) {

  function onceDone(key) {
    const ok = canonicalId(key);
    if (!ok) return false;

    // conversation.html runs in a scene frame.  The canonical engine is
    // owned by the shell in normal play, so consult both scopes before any
    // legacy projection.  A false result from the frame-local ConvoRuntime
    // is not authoritative when that runtime cannot see the shell engine.
    try {
      const engines = [window.GameStateEngine, window.parent?.GameStateEngine];
      for (const engine of engines) {
        if (typeof engine?.hasOnceKey === "function") {
          if (engine.hasOnceKey(ok)) return true;
          continue;
        }
        const state = engine?.getGameplayState?.() || engine?.getState?.();
        const keys = state?.progression?.onceKeys;
        if (Array.isArray(keys) && keys.includes(ok)) return true;
      }
    } catch {}

    // Keep scene-side gating aligned with ConvoRuntime once/fallback rules.
    try {
      if (window.ConvoRuntime && typeof window.ConvoRuntime.onceDone === "function") {
        return !!window.ConvoRuntime.onceDone(ok);
      }
    } catch {}

    try {
      const suffix = "_" + ok;
      let convDone = false;

      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("conv_done_") || !k.endsWith(suffix)) continue;

        if (safeGetLS(k) === "1") { convDone = true; break; }
      }

      if (convDone) return true;
      return safeGetLS("once_" + ok) === "1" || safeGetLS("__once:" + ok) === "1";
    } catch {
      return false;
    }
  }

  const WATCHLIST_DEFAULT_KEY = "hak_watchlist_v1";

  function normalizeWatchlistKey(rawKey) {

  function normalizeWatchlistIds(input) {
    const arr = Array.isArray(input) ? input : [];
    const out = [];
    const seen = new Set();
    for (const raw of arr) {
      const id = canonicalId(raw);
      if (!id || seen.has(id)) continue;
      seen.add(id);
      out.push(id);
    }
    return out;
  }

  function getWatchlistSelection(storeKey, fallbackDefaultSelected = []) {

      }

    const rawMain = safeGetLS(key);
    const parsedMain = rawMain ? safeJsonParse(rawMain, null) : null;
    if (Array.isArray(parsedMain)) return normalizeWatchlistIds(parsedMain);
    if (parsedMain && typeof parsedMain === "object") {

    const rawSecondary = safeGetLS(key + "_selected");
    const parsedSecondary = rawSecondary ? safeJsonParse(rawSecondary, null) : null;
    if (Array.isArray(parsedSecondary)) return normalizeWatchlistIds(parsedSecondary);

    return normalizeWatchlistIds(fallbackDefaultSelected);

    if (Game._conversationAutoplayPreferenceLifecycle !== observer || window.GameStateEngine !== engine) return;

  try { if (!TIMELINE_HISTORY_ONLY) Game._renameOverlayOpen = false; } catch {}
}

function bindOn(target, type, fn, opts) {
  if (!target) return;
  target.addEventListener(type, fn, opts);
  unbindFns.push(() => target.removeEventListener(type, fn, opts));
}

function isTypingTarget(el) {
  if (!el || !(el instanceof Element)) return false;
  if (el.closest("input, textarea, [contenteditable=''], [contenteditable='true'], [contenteditable='plaintext-only']")) return true;
  return el.tagName === "INPUT" || el.tagName === "TEXTAREA" || !!el.isContentEditable;
}

function advanceClickOrSpace() {
  if (TIMELINE_HISTORY_ONLY) return;
  const inputId = (window.__feature4AdvanceInputSequence = Math.max(0, Number(window.__feature4AdvanceInputSequence || 0)) + 1);
  const traceOutcome = (outcome, detail = {}) => {
    try {

      (window.__feature4AdvanceInputTrace ||= []).push({ inputId, at, outcome, contactId: CONTACT_ID, auto: !!auto, interactionPending: !!isInteractionPending(), active: !!isThisConversationActive(), advanceOperationInFlight: !!__showNextRunning, advanceIntentPending: !!__showNextRequested, playerInputQueueDepth: (__showNextRunning ? 1 : 0) + (__showNextRequested ? 1 : 0), presentationQueueDepth: window.PresentationController?.getState?.()?.pendingAdvance ? 1 : 0, reconciliationInFlight: !!window.__feature4ReconciliationInFlight, queueOperations: Number(queue.operations || 0), ...detail });
      if (window.__feature4AdvanceInputTrace.length > 500) window.__feature4AdvanceInputTrace.splice(0, window.__feature4AdvanceInputTrace.length - 500);

      if (paintTrace.length > 1000) paintTrace.splice(0, paintTrace.length - 1000);
    } catch {}
  };
  if (!isThisConversationActive()) { traceOutcome("IGNORED_VALIDLY", { reason: "conversation_inactive" }); return; }
  if (isInteractionPending()) { traceOutcome("IGNORED_VALIDLY", { reason: "interaction_pending" }); return; }
  if (Game._renameOverlayOpen) { traceOutcome("IGNORED_VALIDLY", { reason: "rename_overlay" }); return; }
  if (appDownloadInProgress) { traceOutcome("IGNORED_VALIDLY", { reason: "app_download" }); return; }
  // A real player tap may legitimately skip the active authored wait even
  // though showNext owns that wait. Resolve it, but never arm another intent
  // while the serialized operation is otherwise in flight.
  if (__showNextRunning || __showNextRequested) {
    const activePresentation = window.PresentationController?.getState?.()?.activeWait;
    if (activePresentation) {
      const request = window.PresentationController?.requestAdvance?.({ contactId: CONTACT_ID });
      if (request?.resolvedActive) { traceOutcome("ADVANCE_PRESENTATION_ACCEPTED", { reason:"resolved_in_flight_presentation_wait", request }); return; }
    }
    traceOutcome("IGNORED_VALIDLY", { reason: "advance_operation_in_flight" });
    return;
  }
  try {
    const request = window.PresentationController?.requestAdvance?.({ contactId: CONTACT_ID });
    if (request?.resolvedActive) {
      traceOutcome("ADVANCE_PRESENTATION_ACCEPTED", { reason: request.owner === "background" ? "resolved_background_wait_and_reconcile" : "resolved_interactive_wait", request });
      // A background interpreter commits after its wait resolves but does not
      // own this mounted scene's DOM. Queue one render reconciliation behind
      // that commit. Interactive waits already belong to showNext's serialized
      // queue, so adding another call there would incorrectly request twice.
      if (request.owner === "background" && !auto) advanceOnce();
      return;
    }
    if (request?.armedNext) {
      traceOutcome("ADVANCE_PRESENTATION_ACCEPTED", { reason: auto ? "armed_next_wait_autoplay" : "armed_next_wait_interactive", request });
      if (auto) return;
      advanceOnce();
      return;
    }
  } catch {}
  if (auto) { traceOutcome("IGNORED_INCORRECTLY", { reason: "autoplay_without_controller_acceptance" }); return; }
  traceOutcome("ADVANCE_PRESENTATION_FALLBACK", { reason: "controller_unavailable" });
  advanceOnce();
}

function bindInputsToCurrentChat() {
  const current =
    document.querySelector(".chat[data-scene='conversation']") ||
    document.querySelector(".chat");

  if (!current) return;
  if (boundRoot === current) return;

  unbindAll();
  boundRoot = current;

  // ✅ Bind autoplay button click (3-state cycle)
  if (autoBtnEl) {
    bindOn(autoBtnEl, "click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      cycleAutoState();
      try { window.showToast?.(autoBtnEl.title); } catch {}
    });
  }

  bindOn(boundRoot, "click", (e) => {
    if (e.target.closest(".chat-header")) return;
    if (e.target.closest(".bubble-photo")) return;
    if (e.target.closest(".message-link")) return;
    if (e.target.closest(".choice")) return;
    if (e.target.closest(".action-send")) return;
    if (e.target.closest(".action-prompt")) return;
    if (e.target.closest("#photoViewer")) return;
    if (e.target.closest("#avatarViewer")) return;
    if (e.target.closest("#conv-hint")) return;
    advanceClickOrSpace();
  });

  // Historical events remain canonical, but only the newest window is
  // mounted initially. A real upward scroll prepends the next chunk while
  // preserving the reader's visual anchor.
  let historyTouchY = null;
  bindOn(bodyEl, "wheel", (e) => { if (e.deltaY < 0 && bodyEl.scrollTop <= 12) expandEarlierTranscript(); }, { passive:true });
  bindOn(bodyEl, "touchstart", (e) => { historyTouchY = Number(e.touches?.[0]?.clientY ?? NaN); }, { passive:true });
  bindOn(bodyEl, "touchmove", (e) => { const y=Number(e.touches?.[0]?.clientY ?? NaN);if(Number.isFinite(y)&&Number.isFinite(historyTouchY)&&y>historyTouchY&&bodyEl.scrollTop<=12)expandEarlierTranscript();historyTouchY=y; }, { passive:true });

  bindOn(window, "keydown", (e) => {
    if (TIMELINE_HISTORY_ONLY) return;
    if (!isThisConversationActive()) return;
    if (isTypingTarget(e.target) || isTypingTarget(document.activeElement)) return;

    // Hidden debug shortcut: Ctrl+Shift+R -> reset this conversation progress + IF cache.
    if (
      e.ctrlKey === true &&
      e.shiftKey === true &&
      (e.code === "KeyR" || String(e.key || "").toLowerCase() === "r")
    ) {
      if (e.repeat) return;
      e.preventDefault();
      e.stopPropagation();

      const ok = window.confirm?.("Reset this conversation progress for debug replay?");
      if (!ok) return;

      let report = null;
      try {
        report = window.Game?.debugResetConversationProgress?.({
          contactId: CONTACT_ID,
          onceKey: String(currentStoryOnceKey || ""),
          storyKey: String(safeGetLS(STORY_KEY) || ""),
          clearTranscript: true
        }) || null;
      } catch {}

      if (safeGetLS("debug_if_logs") === "1") {
        try { console.info("[IFDebug] ctrl_shift_r_reset", report || {}); } catch {}
      }

      try { window.showToast?.("Conversation debug reset complete."); } catch {}
      try { loadStory(); } catch {}
      return;
    }

    if (e.code === "Space") {
      if (e.repeat) return;
      e.preventDefault();
      if (auto) {
        // Manual interrupt: stop autoplay immediately, no message advance on this keypress.
        rememberConversationAutoplayPreference(0);
        stopAuto(true);
        return;
      }
      advanceClickOrSpace();
      return;
    }

    // Ctrl press cycles OFF -> 1 -> 2 -> OFF (left or right ctrl)
    if (e.key === "Control" || e.code === "ControlLeft" || e.code === "ControlRight") {
      if (e.repeat) return;
      e.preventDefault();
      cycleAutoState();
      return;
    }
  }, true);

  // ensure UI reflects state after rebinding
  applyAutoButtonUI();
}

const sceneRoot = document.getElementById("scene-root") || document.body;
const mo = new MutationObserver(() => { bindInputsToCurrentChat(); });
mo.observe(sceneRoot, { childList: true, subtree: true });
unbindFns.push(() => mo.disconnect());

bindInputsToCurrentChat();

// hint bar fade
let hintFadeTimer = null;
if (hintBarEl) {
  hintFadeTimer = setTimeout(() => { hintFadeTimer = null; hintBarEl.classList.add("hide"); }, 1000);
}

let cleanupHandled = false;
Game.getConversationRunnerOwner = readConversationRunnerOwner;
window.__conversationRuntimeDiagnostics = () => {
  const diagnosticState = window.GameStateEngine?.getGameplayState?.() || {};
  const diagnosticProgression = diagnosticState.progression || {};
  const diagnosticExecution = diagnosticState.execution || {};
  const diagnosticCursor = diagnosticExecution.cursor || {};
  return ({
  contactId: CONTACT_ID,
  storyId: String(diagnosticExecution.activeStoryId || ""),
  storyPath: String(diagnosticExecution.activeStoryPath || safeGetLS(STORY_KEY) || ""),
  sourceStoryPath: String(window.__CURRENT_STORY_SOURCE__ || ""),
  day: dayNumberFromStoryPath(diagnosticExecution.activeStoryPath || safeGetLS(STORY_KEY) || ""),
  route: String(window.Game?.route || diagnosticState.world?.route || ""),
  actor: String(diagnosticExecution.activeActorId || diagnosticExecution.activeContactId || ""),
  localStepIndex: Number(index || 0),
  localScriptLength: Array.isArray(script) ? script.length : 0,
  localStepType: String(script?.[index]?.type || ""),
  interactionFlags: {
    actionPending: Game.actionPending === true,
    choicePending: Game.choicePending === true,
    hakOverlayStepBusy: hakOverlayStepBusy === true,
    pendingOutboundWaiting: pendingOutboundWaiting === true,
    cutsceneOpen: cutsceneOpen === true,
    cutsceneStepBusy: cutsceneStepBusy === true,
    appDownloadInProgress: appDownloadInProgress === true,
    conversationRunActive: isConversationRunActive()
  },
  canonicalCursor: {
    storyPath: String(diagnosticCursor.storyPath || diagnosticExecution.activeStoryPath || ""),
    rootIndex: Number(diagnosticCursor.rootIndex ?? diagnosticCursor.index ?? 0),
    stepIndex: Number(diagnosticCursor.stepIndex ?? diagnosticCursor.rootIndex ?? diagnosticCursor.index ?? 0),
    phase: String(diagnosticCursor.phase || "")
  },
  commandReceipts: Object.keys(diagnosticProgression.commandReceipts || {}).length,
  branchReceipts: Object.keys(diagnosticProgression.branchReceipts || {}).length,
  choiceReceipts: Object.keys(diagnosticProgression.choiceReceipts || {}).length,
  onceKeys: Array.isArray(diagnosticProgression.onceKeys) ? diagnosticProgression.onceKeys.length : Object.keys(diagnosticProgression.onceKeys || {}).length,
  active: isThisConversationActive(),
  boundListeners: unbindFns.length,
  showNextRunning: __showNextRunning,
  showNextRequested: __showNextRequested,
  autoplayActive: auto,
  autoplayIntent: autoState,
  autoplayEligible: !!canAutoplayAdvance(),
  autoplaySchedulerRunning: !!(auto && autoSchedulerToken && autoSchedulerToken === autoRunToken),
  autoplaySchedulerIdentity: autoSchedulerToken || null,
  autoplayBusy: autoBusy,
  autoplayTimerActive: !!autoInterval,
  introTimerActive: !!introTimer,
  appDownloadTimerActive: !!appDownloadTimer,
  hakOverlayTimerActive: !!hakOverlayDelayTimer,
  renderedEventIds: renderedConversationEventIds.size,
  bubbleCount: document.querySelectorAll(".chat[data-scene='conversation'] .bubble,.chat .bubble").length,
  domNodeCount: document.querySelectorAll("*").length,
  imageElementCount: document.querySelectorAll("img").length

};
const onConversationSceneMounted = (e) => {
  const mounted = canonicalId(e?.detail?.name || e?.detail?.id || e?.detail?.scene || "");
  if (!mounted) return;
  if (mounted === "conversation") {
    try { projectCanonicalContinuePrompt(); } catch {}
    return;
  }
  try { window.__conv_cleanup?.(); } catch {}
};
const onConversationBeforeUnload = () => {
  try { window.__conv_cleanup?.(); } catch {}
};

try { window.addEventListener("scene:mounted", onConversationSceneMounted); } catch {}
try { window.addEventListener("beforeunload", onConversationBeforeUnload); } catch {}
try { window.addEventListener("pagehide", onConversationBeforeUnload); } catch {}

window.__conv_cleanup = function () {
  if (cleanupHandled) return;
  cleanupHandled = true;
  try { if (conversationCompletionHome?.timer) clearTimeout(conversationCompletionHome.timer); } catch {}
  conversationCompletionHome = null;
  try {
    if (!TIMELINE_HISTORY_ONLY && shouldFinishConversationOnCleanup()) {
      index = Array.isArray(script) ? script.length : index;
      saveProgress();
      onConversationFinished();
    }
    if (!TIMELINE_HISTORY_ONLY && !finishFired && shouldMarkConversationUnfinishedOnCleanup()) {
      setConversationUnfinishedForCurrent("conversation_exit");
    } else if (!TIMELINE_HISTORY_ONLY && isCurrentEpisodeDone()) {
      clearConversationUnfinishedForCurrent();
    }
  } catch {}
  try { if (!TIMELINE_HISTORY_ONLY) releaseConversationRunner(); } catch {}
  try { invalidateConversationRendererGeneration("conversation_unmount"); } catch {}
  try { resetConversationStepDedup(); } catch {}
  try { window.removeEventListener("scene:mounted", onConversationSceneMounted); } catch {}
  try { window.removeEventListener("beforeunload", onConversationBeforeUnload); } catch {}
  try { window.removeEventListener("pagehide", onConversationBeforeUnload); } catch {}
  try { window.removeEventListener("identity:changed", onIdentityChanged); } catch {}
  try { unbindAll(); } catch {}
  try { window.removeEventListener("contact:avatar-updated", onAvatarUpdated); } catch {}
  try { window.removeEventListener("game:conversations-updated", onConversationsUpdated); } catch {}
  try { window.removeEventListener("hak:watchlistChanged", onCharacterVisibilityChanged); } catch {}
  try { window.StoryBus?.off?.("hak:watchlistChanged", onCharacterVisibilityChanged); } catch {}
  try { if (hakOverlayDelayTimer) clearTimeout(hakOverlayDelayTimer); } catch {}
  hakOverlayDelayTimer = null;
  hakOverlayStepBusy = false;
  if (hakOverlayCloseHandler) {
    try { hakOverlayCloseHandler.cancel?.(); } catch {}
    try { window.removeEventListener("hak:overlay-closed", hakOverlayCloseHandler, true); } catch {}
    hakOverlayCloseHandler = null;
  }
  try { if (centerHintTimer) clearTimeout(centerHintTimer); } catch {}
  try { window.removeEventListener("hak:seen", checkHakGateAndMaybeStart); } catch {}
  try { window.StoryBus?.off?.("hak:seen", checkHakGateAndMaybeStart); } catch {}
  try { unsubscribeCanonicalStoryActivation?.(); } catch {}
  unsubscribeCanonicalStoryActivation = null;
  try { if (hintFadeTimer) clearTimeout(hintFadeTimer); } catch {}
  hintFadeTimer = null;
  if (activePresenterCancel) {
    try { activePresenterCancel(); } catch {}
    activePresenterCancel = null;
  }
  try { clearGlitchEjectTimers(); } catch {}
  try { hideAppDownloadOverlay(); } catch {}
  try { document.body.classList.remove("glitch-eject"); } catch {}
  try { window.__conversationRuntimeDiagnostics = null; } catch {}
  try { if (Game.getConversationRunnerOwner === readConversationRunnerOwner) Game.getConversationRunnerOwner = null; } catch {}
  try {
    const chat = document.querySelector(".chat[data-scene='conversation']") || document.querySelector(".chat");
    if (chat) chat.classList.remove("glitch-eject");
  } catch {}
};
})();
